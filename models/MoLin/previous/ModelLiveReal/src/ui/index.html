<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ModelLiveReal</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <style>
        :root {
            --primary-blue: #4A90E2; /* 主蓝色 */
            --primary-blue-dark: #3A7BC8; /* 深蓝色 */
            --primary-blue-light: #5CA2FF; /* 浅蓝色 */
            --primary-blue-transparent: rgba(74, 144, 226, 0.1);
            --white: #FFFFFF;
            --light-gray: #F5F7FA;
            --gray: #E1E5EB;
            --dark-gray: #7B8A9E;
            --text-dark: #2C3E50;
            --text-gray: #5D6D7E;
            --border-color: #D1D9E6;
            --error-color: #FF6B6B;
            --success-color: #1DD1A1;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #F5F7FA 0%, #E4E9F2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            position: relative;
        }
        
        /* 背景装饰 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(74, 144, 226, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(74, 144, 226, 0.03) 0%, transparent 40%);
            z-index: 0;
        }
        
        .login-container {
            display: flex;
            width: 800px;
            height: 480px;
            background: var(--white);
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 15px 35px rgba(41, 98, 173, 0.1),
                0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .logo-section {
            flex: 0 0 61.8%;
            background: linear-gradient(145deg, #4A90E2 0%, #3A7BC8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }
        
        /* 左侧蓝色区域背景装饰 */
        .logo-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            z-index: 0;
        }
        
        .logo-container {
            position: relative;
            margin-bottom: 20px;
            z-index: 1;
        }
        
        /* 外环保持旋转动画 */
        .logo-outer-ring {
            width: 120px;
            height: 120px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: rotateSlow 20s linear infinite;
        }
        
        .logo-outer-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }
        
        /* 内环保持反向旋转动画 */
        .logo-inner-ring {
            width: 90px;
            height: 90px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .logo-inner-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-bottom: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rotateReverse 2s linear infinite;
        }
        
        /* 钟表核心 */
        .logo-core {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 0 0 10px rgba(255, 255, 255, 0.2),
                0 0 20px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
        }
        
        /* 钟表中心点 */
        .clock-center {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--white);
            border-radius: 50%;
            z-index: 4;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }
        
        /* 时针 - 恢复动画 */
        .hour-hand {
            position: absolute;
            width: 4px;
            height: 16px;
            background: var(--white);
            top: 14px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 2;
            animation: rotateHour 8s linear infinite;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
        }
        
        /* 分针 - 恢复动画 */
        .minute-hand {
            position: absolute;
            width: 3px;
            height: 24px;
            background: rgba(255, 255, 255, 0.9);
            top: 8px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 3;
            animation: rotateMinute 4s linear infinite;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
        }
        
        /* 秒针 - 恢复快速旋转动画 */
        .second-hand {
            position: absolute;
            width: 2px;
            height: 26px;
            background: rgba(255, 255, 255, 0.7);
            top: 6px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 1px;
            z-index: 1;
            animation: rotateSecond 2s linear infinite;
        }
        
        .logo-text {
            font-size: 38px;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: baseline;
            justify-content: center;
        }
        
        .logo-text .q-char {
            color: var(--white);
            font-size: 46px;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                0 2px 12px rgba(0, 0, 0, 0.2);
            margin-right: 6px;
            position: relative;
            top: 1px;
            font-weight: 400;
            letter-spacing: -1px;
        }
        
        .logo-text .rest-text {
            color: var(--white);
            font-size: 32px;
            position: relative;
            top: -1px;
            font-weight: 350;
            letter-spacing: 1px;
        }
        
        .logo-subtext {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            line-height: 1.5;
            max-width: 320px;
            z-index: 1;
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        /* 左侧底部版权信息 */
        .left-footer {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            z-index: 2;
            font-weight: 300;
        }
        
        /* 右侧登录区域 - 白色背景 */
        .login-section {
            flex: 0 0 38.2%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 25px;
            background: var(--white);
            z-index: 1;
            position: relative;
            border-left: 1px solid var(--border-color);
        }
        
        /* 关闭按钮 - 保持与html1一致的简化无边框版本 */
        .close-btn-login {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            background: transparent;
            border: none;
            border-radius: 50%;
            color: var(--dark-gray);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .close-btn-login:hover {
            background: rgba(255, 107, 107, 0.15);
            color: var(--error-color);
            transform: scale(1.1);
        }
        
        .close-btn-login:active {
            transform: scale(0.95);
        }
        
        .login-header {
            margin-bottom: 20px;
            padding-top: 5px;
            text-align: center;
        }
        
        /* 一行标题 */
        .login-title {
            font-size: 24px;
            font-weight: 400;
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 8px;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }
        
        .login-title-welcome {
            color: var(--text-dark);
            font-size: 20px;
            margin-right: 6px;
            position: relative;
            top: 2px;
            font-weight: 400;
        }
        
        .login-title-q {
            color: var(--text-dark);
            font-size: 22px;
            position: relative;
            top: 2px;
            font-weight: 400;
            letter-spacing: 0px;
        }
        
        .login-title-rest {
            color: var(--text-dark);
            font-size: 22px;
            position: relative;
            top: 2px;
            font-weight: 400;
            letter-spacing: 0px;
        }
        
        .login-header p {
            color: var(--text-gray);
            font-size: 12px;
            line-height: 1.4;
            font-weight: 300;
            text-align: center;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 16px;
            transition: transform 0.3s ease;
        }
        
        .input-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-blue);
            font-size: 14px;
            z-index: 2;
        }
        
        .input-group input {
            width: 100%;
            padding: 11px 11px 11px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s;
            background: var(--light-gray);
            color: var(--text-dark);
            position: relative;
            z-index: 1;
            font-weight: 400;
        }
        
        .input-group input:focus {
            border-color: var(--primary-blue);
            box-shadow: 
                0 0 0 2px rgba(74, 144, 226, 0.15),
                inset 0 0 8px rgba(74, 144, 226, 0.08);
            outline: none;
            background: var(--white);
        }
        
        .input-group input::placeholder {
            color: var(--dark-gray);
            font-weight: 300;
        }
        
        .options-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-gray);
            font-weight: 300;
        }
        
        .option-item input {
            accent-color: var(--primary-blue);
            width: 14px;
            height: 14px;
        }
        
        .forgot-password {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 400;
            transition: all 0.3s;
            font-size: 13px;
        }
        
        .forgot-password:hover {
            color: var(--primary-blue-dark);
            text-decoration: underline;
        }
        
        .login-btn {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 18px;
            box-shadow: 
                0 4px 15px rgba(74, 144, 226, 0.25),
                0 0 25px rgba(74, 144, 226, 0.08);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            width: 100%;
        }
        
        .login-btn:hover {
            background: linear-gradient(135deg, var(--primary-blue-light), var(--primary-blue));
            transform: translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(74, 144, 226, 0.35),
                0 0 30px rgba(74, 144, 226, 0.15);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.7s;
        }
        
        .login-btn:hover::after {
            left: 100%;
        }
        
        /* 底部链接 */
        .bottom-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .bottom-link {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        .bottom-link:hover {
            color: var(--primary-blue-dark);
            background: rgba(74, 144, 226, 0.08);
            text-decoration: underline;
        }
        
        .link-separator {
            color: var(--dark-gray);
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
            font-weight: 300;
        }
        
        /* 状态消息 */
        .status-message {
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
            text-align: center;
            font-weight: 300;
        }
        
        .status-success {
            background: rgba(29, 209, 161, 0.08);
            color: var(--success-color);
            border: 1px solid rgba(29, 209, 161, 0.2);
        }
        
        .status-error {
            background: rgba(255, 107, 107, 0.08);
            color: var(--error-color);
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        
        /* 加载动画 */
        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--white);
            animation: spin 1s ease-in-out infinite;
            margin-right: 6px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 左侧时钟动画关键帧 - 恢复原有动画 */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes rotateReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes rotateHour {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        @keyframes rotateMinute {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        @keyframes rotateSecond {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 左侧Logo区域 - 蓝色背景，恢复时钟动画 -->
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-outer-ring">
                    <div class="logo-inner-ring">
                        <div class="logo-core">
                            <!-- 时针 - 恢复动画 -->
                            <div class="hour-hand"></div>
                            <!-- 分针 - 恢复动画 -->
                            <div class="minute-hand"></div>
                            <!-- 秒针 - 恢复快速旋转动画 -->
                            <div class="second-hand"></div>
                            <!-- 钟表中心点 -->
                            <div class="clock-center"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="logo-text">
                <span class="q-char">M</span>
                <span class="rest-text">odelLiveReal</span>
            </div>
            <div class="logo-subtext">
                专业交易分析与策略执行平台<br>
                精准把握交易时机，优化每一笔投资决策
            </div>
            
            <!-- 左侧底部版权信息 -->
            <div class="left-footer">
                &copy; 2025 ModelLiveReal | v2.0.1
            </div>
        </div>
        
        <!-- 右侧登录区域 - 白色背景，保持与html1一致的功能 -->
        <div class="login-section">
            <!-- 关闭按钮 - 简化版，与html1一致 -->
            <button class="close-btn-login" id="closeWindowBtn" title="关闭窗口">
                <i class="fas fa-times"></i>
            </button>
            
            <div class="login-header">
                <!-- 一行标题 -->
                <div class="login-title">
                    <span class="login-title-welcome">欢迎登录</span>
                    <span class="login-title-q">M</span>
                    <span class="login-title-rest">odelLiveReal</span>
                </div>
                <p>请输入您的凭据访问交易分析平台</p>
            </div>
            
            <div class="status-message" id="statusMessage"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="用户名 / 邮箱" required>
                    <div class="error-message" id="username-error"></div>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="登录密码" required>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <div class="options-container">
                    <div class="option-item">
                        <input type="checkbox" id="rememberPassword">
                        <label for="rememberPassword">记住密码</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="autoLogin">
                        <label for="autoLogin">自动登录</label>
                    </div>
                    <a href="#" class="forgot-password">忘记密码</a>
                </div>
                
                <button type="submit" class="login-btn" id="loginButton">
                    <div class="btn-content">
                        <div class="loader" id="loader"></div>
                        <span id="buttonText">登录交易系统</span>
                    </div>
                </button>
                
                <!-- 底部链接 -->
                <div class="bottom-links">
                    <a href="#" class="bottom-link" id="applyAccount">申请交易账号</a>
                    <span class="link-separator">|</span>
                    <a href="#" class="bottom-link" id="contactUs">联系交易支持</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 添加pywebview ready事件监听
            window.addEventListener('pywebviewready', function() {
                console.log('PyWebView API 现在可用');
                // 页面加载时检查是否有保存的登录凭证
                checkSavedCredentials();
            });
            
            // 添加申请账号链接功能
            const applyAccountLink = document.getElementById('applyAccount');
            const contactUsLink = document.getElementById('contactUs');
            
            applyAccountLink.addEventListener('click', function(e) {
                e.preventDefault();
                showStatusMessage('正在打开交易账号申请页面...', 'success');
                setTimeout(() => {
                    alert('交易账号申请\n\n请访问我们的交易平台官网填写申请表格，或联系交易客服获取更多信息。\n邮箱: trading@q-invest.com\n电话: 400-987-6543');
                }, 500);
            });
            
            contactUsLink.addEventListener('click', function(e) {
                e.preventDefault();
                showStatusMessage('正在加载交易支持联系方式...', 'success');
                setTimeout(() => {
                    alert('联系交易支持\n\n交易支持邮箱: trading-support@q-invest.com\n交易支持电话: 400-987-6543\n交易时间支持: 周一至周五 8:30-17:30\n交易平台官网: www.q-invest-trading.com');
                }, 500);
            });
            
            // 原来的忘记密码链接事件处理
            const forgotPasswordLink = document.querySelector('.forgot-password');
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                const email = prompt('请输入您的注册邮箱以重置密码：');
                if (email && validateEmail(email)) {
                    showStatusMessage(`密码重置链接已发送到 ${email}`, 'success');
                } else if (email) {
                    showStatusMessage('请输入有效的邮箱地址', 'error');
                }
            });
            
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loader = document.getElementById('loader');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            const statusMessage = document.getElementById('statusMessage');
            const rememberPassword = document.getElementById('rememberPassword');
            const autoLogin = document.getElementById('autoLogin');
            
            // 自动登录被选中时，自动选中记住密码
            autoLogin.addEventListener('change', function() {
                if (this.checked) {
                    rememberPassword.checked = true;
                }
            });
            
            // 记住密码取消时，取消自动登录
            rememberPassword.addEventListener('change', function() {
                if (!this.checked) {
                    autoLogin.checked = false;
                }
            });
            
            // 登录表单提交处理
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberPwd = rememberPassword.checked;
                const autoLoginChecked = autoLogin.checked;
                
                // 重置错误信息
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
                
                // 简单的验证
                let isValid = true;
                
                if (!username) {
                    usernameError.textContent = '请输入用户名或邮箱地址';
                    usernameError.style.display = 'block';
                    isValid = false;
                } else if (!validateEmail(username) && username.length < 3) {
                    usernameError.textContent = '用户名至少3个字符或使用有效邮箱';
                    usernameError.style.display = 'block';
                    isValid = false;
                }
                
                if (!password) {
                    passwordError.textContent = '请输入登录密码';
                    passwordError.style.display = 'block';
                    isValid = false;
                } else if (password.length < 6) {
                    passwordError.textContent = '密码长度至少6个字符';
                    passwordError.style.display = 'block';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                // 显示加载状态
                buttonText.textContent = '正在验证交易身份...';
                loader.style.display = 'block';
                loginButton.disabled = true;
                
                // 调用pywebview API进行登录验证
                if (window.pywebview && window.pywebview.api) {
                    // 准备用户数据
                    const userData = {
                        username: username,
                        password: password,
                        rememberPassword: rememberPwd,
                        autoLogin: autoLoginChecked
                    };
                    
                    // 调用Python后端的登录方法
                    pywebview.api.login(userData)
                        .then(response => {
                            console.log('交易登录响应:', response);
                            
                            if (response.success) {
                                // 登录成功
                                buttonText.textContent = '交易身份验证通过！';
                                loginButton.style.background = 'linear-gradient(135deg, #1DD1A1, #10A881)';
                                
                                // 显示成功消息
                                let successMsg = '交易身份验证成功！正在进入交易平台...';
                                showStatusMessage(successMsg, 'success');
                                
                                // 成功后自动跳转（Python端会处理页面跳转）
                                console.log('交易登录成功，等待Python端加载交易主页面...');
                                
                                // 延迟跳转，让用户看到成功消息
                                setTimeout(() => {
                                    if (window.pywebview && window.pywebview.api.load_main_page) {                                        
                                        // 前端调用方式
                                        pywebview.api.load_main_page().then(function(response) {
                                            console.log("API响应:", response);
                                            if (response.success) {
                                                console.log(response.message);
                                            }
                                        }).catch(function(error) {
                                            console.error("API调用错误:", error);
                                        });
                                    }
                                }, 1500);
                                
                            } else {
                                // 登录失败
                                buttonText.textContent = '交易身份验证失败';
                                passwordError.textContent = response.message || '用户名或密码错误，请重试';
                                passwordError.style.display = 'block';
                                loginButton.style.background = 'linear-gradient(135deg, #FF6B6B, #E74C3C)';
                                
                                showStatusMessage(response.message || '交易身份验证失败，请检查您的凭据', 'error');
                                
                                setTimeout(() => {
                                    resetLoginButton();
                                }, 2000);
                            }
                        })
                        .catch(error => {
                            console.error('交易登录请求失败:', error);
                            // 登录失败
                            buttonText.textContent = '连接失败';
                            showStatusMessage('无法连接到交易服务器，请检查网络连接', 'error');
                            loginButton.style.background = 'linear-gradient(135deg, #FF6B6B, #E74C3C)';
                            
                            setTimeout(() => {
                                resetLoginButton();
                            }, 2000);
                        });
                } else {
                    // 如果没有pywebview API，使用模拟验证
                    setTimeout(() => {
                        const mockUsers = [
                            {username: 'trader', password: 'trade123'},
                            {username: 'q@trading.com', password: 'qtrade2023'},
                            {username: 'demo', password: 'demo789'},
                            {username: 'admin', password: 'admin123'},
                            {username: 'test', password: 'test123'}
                        ];
                        
                        const user = mockUsers.find(u => 
                            (u.username === username) && u.password === password
                        );
                        
                        if (user) {
                            // 登录成功
                            buttonText.textContent = '验证通过！';
                            loginButton.style.background = 'linear-gradient(135deg, #1DD1A1, #10A881)';
                            
                            let successMsg = '交易登录成功！演示模式';
                            showStatusMessage(successMsg, 'success');
                            
                            setTimeout(() => {
                                alert(`交易演示模式：欢迎 ${username}！\n\n实际交易应用中，系统将自动跳转到交易主页面。`);
                                resetLoginForm();
                            }, 1500);
                        } else {
                            // 登录失败
                            buttonText.textContent = '身份验证失败';
                            passwordError.textContent = '用户名或密码错误，请重试';
                            passwordError.style.display = 'block';
                            loginButton.style.background = 'linear-gradient(135deg, #FF6B6B, #E74C3C)';
                            
                            showStatusMessage('交易身份验证失败，请检查您的凭据', 'error');
                            
                            setTimeout(() => {
                                resetLoginButton();
                            }, 2000);
                        }
                    }, 1500);
                }
            });
            
            // 检查保存的登录凭证
            function checkSavedCredentials() {
                if (window.pywebview && window.pywebview.api.get_saved_credentials) {
                    pywebview.api.get_saved_credentials()
                        .then(credentials => {
                            console.log('获取到的交易凭证:', credentials);
                            
                            if (credentials.has_saved) {
                                // 如果有保存的凭证，自动填充
                                document.getElementById('username').value = credentials.username || '';
                                document.getElementById('password').value = credentials.password || '';
                                
                                if (credentials.rememberPassword) {
                                    rememberPassword.checked = true;
                                }
                                
                                if (credentials.autoLogin) {
                                    autoLogin.checked = true;
                                }
                                
                                // 如果启用了自动登录且有密码，自动提交表单
                                if (credentials.autoLogin && credentials.password) {
                                    //console.log('检测到自动登录，5秒后自动登录...');
                                    //showStatusMessage('检测到自动登录，正在自动登录...', 'success');
                                    
                                    setTimeout(() => {
                                        loginForm.dispatchEvent(new Event('submit'));
                                    }, 3000);
                                } else if (credentials.username) {
                                    showStatusMessage(`欢迎回来 ${credentials.username}，请点击登录或输入密码`, 'success');
                                }
                            }
                        })
                        .catch(error => {
                            console.error('获取保存的交易凭证失败:', error);
                        });
                }
            }
            
            // 清除保存的凭证功能
            function clearSavedCredentials() {
                if (confirm('确定要清除所有保存的交易登录凭证吗？')) {
                    if (window.pywebview && window.pywebview.api.clear_saved_credentials) {
                        pywebview.api.clear_saved_credentials()
                            .then(response => {
                                if (response.success) {
                                    showStatusMessage('已清除所有保存的交易登录凭证', 'success');
                                    // 清空表单
                                    document.getElementById('username').value = '';
                                    document.getElementById('password').value = '';
                                    rememberPassword.checked = false;
                                    autoLogin.checked = false;
                                } else {
                                    showStatusMessage('清除交易凭证失败', 'error');
                                }
                            })
                            .catch(error => {
                                console.error('清除交易凭证失败:', error);
                                showStatusMessage('清除交易凭证失败', 'error');
                            });
                    }
                }
            }
            
            // 为忘记密码链接添加清除凭证功能（长按3秒）
            let clearTimer;
            forgotPasswordLink.addEventListener('mousedown', function(e) {
                e.preventDefault();
                clearTimer = setTimeout(() => {
                    clearSavedCredentials();
                }, 3000);
            });
            
            forgotPasswordLink.addEventListener('mouseup', function(e) {
                clearTimeout(clearTimer);
            });
            
            forgotPasswordLink.addEventListener('mouseleave', function(e) {
                clearTimeout(clearTimer);
            });
            
            // 显示状态消息
            function showStatusMessage(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = 'status-message';
                statusMessage.classList.add(`status-${type}`);
                statusMessage.style.display = 'block';
                
                // 5秒后自动隐藏
                setTimeout(() => {
                    if (statusMessage.textContent === message) {
                        statusMessage.style.display = 'none';
                    }
                }, 5000);
            }
            
            // 邮箱验证函数
            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            // 重置登录按钮状态
            function resetLoginButton() {
                buttonText.textContent = '登录交易系统';
                loader.style.display = 'none';
                loginButton.disabled = false;
                loginButton.style.background = 'linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark))';
            }
            
            // 重置登录表单
            function resetLoginForm() {
                resetLoginButton();
                document.getElementById('password').value = '';
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
            }
            
            // 输入框实时验证
            document.getElementById('username').addEventListener('input', function() {
                usernameError.style.display = 'none';
                statusMessage.style.display = 'none';
            });
            
            document.getElementById('password').addEventListener('input', function() {
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
            });
            
            // 与pywebview集成的示例代码
            if (window.pywebview && window.pywebview.api) {
                console.log('pywebview API已检测到 - ModelLiveReal登录界面已就绪');
            }
            
            // 添加键盘快捷键支持
            document.addEventListener('keydown', function(e) {
                // Ctrl+Enter 提交表单
                if (e.ctrlKey && e.key === 'Enter') {
                    loginButton.click();
                }
                
                // F1 显示帮助
                if (e.key === 'F1') {
                    e.preventDefault();
                    alert('交易登录帮助:\n\n1. 输入用户名/邮箱和密码\n2. 点击"登录交易系统"或按Ctrl+Enter\n3. 交易时间: 周一至周五 8:30-17:30\n4. 如需帮助请联系交易支持\n\n高级功能:\n- 记住密码：下次自动填充\n- 自动登录：启动时自动登录\n- 长按"忘记密码"3秒清除所有保存的交易凭证');
                }
                
                // Ctrl+Shift+C 清除凭证
                if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                    e.preventDefault();
                    clearSavedCredentials();
                }
            });
            
            // 添加输入框焦点效果（与html1一致）
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
            
            // 为Q字符添加呼吸效果
            const qChar = document.querySelector('.q-char');
            let breathDirection = 1;
            let breathValue = 0;
            
            function animateBreath() {
                breathValue += 0.02 * breathDirection;
                if (breathValue >= 0.3) breathDirection = -1;
                if (breathValue <= 0) breathDirection = 1;
                
                qChar.style.textShadow = `
                    0 0 ${8 + breathValue * 4}px rgba(255, 255, 255, ${0.5 + breathValue}),
                    0 2px ${10 + breathValue * 5}px rgba(0, 0, 0, ${0.2 + breathValue * 0.5})
                `;
                
                requestAnimationFrame(animateBreath);
            }
            
            animateBreath();
            
            // 关闭窗口
            document.getElementById('closeWindowBtn').addEventListener('click', () => {
                // 关闭窗口
                if (typeof pywebview !== 'undefined') {
                    pywebview.api.close_window();
                } else {
                    console.log('关闭窗口');
                }
            }); 
        });
    </script>
</body>
</html>
