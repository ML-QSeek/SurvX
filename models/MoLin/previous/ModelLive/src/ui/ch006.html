	<script	type="text/javascript">
		
		
		const editkuang = `<div  id="edit_kuang">

										<input id="tjSubmit" type="button" class="WarnMButton" value="发布">
										</div>
										</div>`;

		
		
		
			//接受参数
			$(document).ready(function(){
				// 获取当前页面的URL参数
				const params = new URLSearchParams(window.location.search);
				// 获取指定参数的值
				Q14123101 = params.get('par');
				})
			//server
			var MServer = "http://10.10.98.51/test/sys/";
			// 生成一个不重复的ID
			function GenNonDuplicateID(randomLength){
				return Number(Math.random().toString().substr(3,randomLength) + Date.now()).toString(36)
			}
			//警示消息
			function WarnMessage(content){
				var sid=GenNonDuplicateID(1);	
				$("body").append('<div class="Warn"><div class="WarnB" id="WarnB_'+sid+'"></div><div class="WarnM"><button id="Yes" class="WarnMButton"> 好的 </button></div></div>');
				$("#WarnB_"+sid).html(content);
				}
			//屏蔽右键事件
			document.oncontextmenu=function(){return	false;}
			$(document).ready(function (){$("#ssbtn").html("无");$("#QPointSelect").click();})
			$(document).on("click",".shut1",function(){$(this).parent().remove();})
			//时间
			function getLangDate(item){
				var dateObj = new Date();
				var year = dateObj.getFullYear();
				var month = dateObj.getMonth()+1;
				var date = dateObj.getDate();
				var day = dateObj.getDay();
				var weeks = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
				var week = weeks[day];
				var hour = dateObj.getHours();
				var minute = dateObj.getMinutes();
				var second = dateObj.getSeconds();
				if(month<10){month="0"+month;}
				if(date<10){date="0"+date;}
				if(hour<10){hour="0"+hour;}
				if(minute<10){minute="0"+minute;}
				if(second<10){second="0"+second;}
				//var newDate = year+"年"+month+"月"+date+"日 "+hour+":"+minute+":"+second+" "+week;
				if(item=='systime'){
				var newDate ="<font class='ttext'>"+year+"年"+month+"月"+date+"日 "+hour+":"+minute+":"+second+" "+week+"</font>";
				document.getElementById("home_main_rbottom1_colr").innerHTML = newDate;
				setTimeout("getLangDate('systime')",1000);//每隔1秒重新调用一次该函数
					}
				else{
				var newDate = year.toString()+month.toString()+date.toString();
				var newMonth = year.toString()+month.toString();
				var newDate1 = year+"-"+month+"-"+date;
				return eval(item);
				}
			}
			//自定义右键上下文
		function oncontextmenu(){
			var obUp={text:"修改",func:function(){
				
			var ArticleTextID = $(this).attr('id');
			if (ArticleTextID !=""){
				$.ajax({
					type: "POST",
					url: MServer+"qq/channel/ch006C.php",
					data:{
						qflag:"QPOINT",
						sflag:'ArticleText_04',
						sid:ArticleTextID,
						},
						async:false,
						success: function(data1){
							JchanCon = JSON.parse(data1);
							ArticleTextBT = JchanCon[2];
							bghtml=JchanCon[3];
							
							}
						});
				
						$("body").append(editkuang);
						divmove("edit_kuang","edit_kuang");
						$("#editor_myDIS").css('all','initial');
						var ue = UE.getEditor('editor_myDIS');
						$("#tjtopic").html("技术文档");
						$("#tjtopic1").val(ArticleTextBT);
						$("#Author").html(Q14123101);
						$("#newcontentTime").html(getLangDate('newDate'));
						ue.ready(function() {ue.setContent(bghtml);});
						$(document).off('click','#tjSubmit').on('click','#tjSubmit', function(){
							//alert(ue.getContent());
								$.ajax({
							  type: "POST",
							  url: MServer+"qq/channel/ch006C.php",
							  data:{
							  	sid:ArticleTextID,//id
									qflag:"QPOINT",
							  	sflag:'ArticleText_02',
									主题: $("#tjtopic").text(),//主题
									提交人: $("#Author").text(),//作者 
									标题: $("#tjtopic1").val(),//标题
									内容: ue.getContent(),//内容   
							  	},
							  async:false,
							  success: function(data1){
									WarnMessage(data1);
									$(document).off('click',"#Yes").on('click',"#Yes",function(){
										$(this).parent().parent().remove();
										//查询列表更新
										$("#QPointSelect").click();
										})
							  	}
							});
						UE.getEditor('editor_myDIS',{toolbars:[]}).destroy();
						$("#edit_kuang").remove();
							});
					
			}
			}
			};
			
			var obDel={text:"删除",func:function(){
			var trid =$(this).attr("id");
			$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch006C.php",
				data:{
					qflag:"QPOINT",
					sflag:"ArticleText_03",
					trid:trid,
					},
				async:false,
				success: function(data){
					$("#QPointSelect").click();
				}
				})
			}
			};
			var mailMenuData = [[obUp,obDel]];
			$(".PointTr").smartMenu(mailMenuData, {
				name: "mail",
				beforeShow: function() {
				$.smartMenu.remove();
				}
			});
			
		}
		// 模块拖拽	
		function	divmove(DivId1,DivId2){
		var _move=false;
		var _x,_y;
		$('#'+DivId1).click(function(){
			}).mousedown(function(e){
				_move=true;
				_x=e.pageX-parseInt($('#'+DivId2).css("left"));
				_y=e.pageY-parseInt($('#'+DivId2).css("top"));
				});
			$(document).mousemove(function(e){
				if(_move){
					var x=e.pageX-_x;
					var y=e.pageY-_y;
					$('#'+DivId2).css({top:y,left:x});
				}
			}).mouseup(function(){
			_move=false;
			});
		}
