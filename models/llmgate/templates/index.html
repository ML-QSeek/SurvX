<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM-Gate</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
    --blue:#2f54eb;--green:#00b42a;--orange:#ff7d00;--red:#f53f3f;
    --line:#e5e6eb;--line2:#f2f3f5;--gray:#86909c;--text:#1d2129;
    --sb:#d0d3d9;--sbh:#a8adb5;
}
html,body{height:100%;}
body{
    font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Roboto,sans-serif;
    background:#f5f6f8;color:var(--text);
    padding:12px;overflow:hidden;
}
.app{
    max-width:1600px;height:100%;margin:0 auto;
    display:flex;flex-direction:column;gap:10px;
}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--sb);border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--sbh);border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent;}

/* 顶栏 */
.navbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fff;border:1px solid var(--line);flex:0 0 auto;}
.logo{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.logo i,.logo span{color:var(--blue);}
.nav-right{display:flex;align-items:center;gap:14px;font-size:13px;color:#4e5a6b;}
.env{background:#e8f5e9;color:#2e7d32;padding:3px 10px;font-size:12px;font-weight:500;}

/* 状态条 */
.bar{display:flex;background:#fff;border:1px solid var(--line);font-size:13px;flex-wrap:wrap;flex:0 0 auto;}
.bar>span{display:flex;align-items:center;gap:6px;padding:8px 14px;border-right:1px solid var(--line2);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.g{background:var(--green);}
.dot.r{background:var(--red);}
.dot.o{background:#c9cdd4;}
.badge{background:var(--red);color:#fff;font-size:11px;padding:0 8px;font-weight:600;}
.emg{margin-left:auto;background:#fff1f0;color:var(--red);border:0;border-left:1px solid var(--line);padding:0 18px;font:500 13px inherit;cursor:pointer;}
.emg:hover{background:var(--red);color:#fff;}
.emg.on{background:#e8f5e9;color:#2e7d32;}
.emg.on:hover{background:#2e7d32;color:#fff;}

/* 主布局：占满剩余，左右等高 */
.main{
    flex:1;min-height:0;
    display:grid;grid-template-columns:1fr 480px;gap:10px;
}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;}

/* 面板 */
.panel{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);flex:0 0 auto;}
.ph b{font-size:13px;display:flex;align-items:center;gap:6px;}
.ph b i{color:var(--blue);}
.ph a{font-size:12px;color:var(--blue);cursor:pointer;padding:3px 8px;border:1px solid var(--line);}
.ph a:hover{background:#f0f2ff;}
.pb{padding:12px;overflow-y:auto;flex:1;min-height:0;}

/* KPI：固定高 */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:0 0 auto;}
.kpi>div{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);padding:10px 14px;}
.kpi>div:nth-child(2){border-left-color:var(--green);}
.kpi>div:nth-child(3){border-left-color:var(--orange);}
.kpi>div:nth-child(4){border-left-color:var(--red);}
.kpi small{font-size:12px;color:var(--gray);display:flex;align-items:center;gap:5px;}
.kpi b{display:block;font-size:22px;margin-top:2px;}
.kpi em{font-size:12px;font-style:normal;color:var(--green);}

/* 趋势：固定高 */
.trend-panel{flex:0 0 auto;}
.chart{height:70px;display:flex;align-items:flex-end;gap:2px;}
.chart i{flex:1;background:var(--blue);min-height:3px;opacity:.85;display:block;}
.legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--gray);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;display:inline-block;}

/* 双列：占剩余一部分 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1 1 auto;min-height:120px;}

/* 权限表：占剩余 */
.agents-panel{flex:1 1 auto;min-height:140px;}

/* 行 */
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;}
.row:last-child{border:0;}
.ct{font-weight:600;padding:1px 8px;font-size:12px;background:var(--line2);}
.ct.o{color:var(--orange);background:#fff7e8;}
.ct.r{color:var(--red);background:#fff1f0;}
.ct.b{color:var(--blue);background:#f0f2ff;}
.cnt{background:var(--line2);padding:1px 10px;font-size:12px;}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:8px;color:var(--gray);font-weight:500;font-size:12px;border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0;}
td{padding:9px 8px;border-bottom:1px solid var(--line2);}
tr:last-child td{border:0;}
tr.click{cursor:pointer;}
tr.click:hover{background:#f7f8fa;}
.st{display:flex;align-items:center;gap:5px;}
.st .dot{width:6px;height:6px;}
.tag{font-size:12px;background:var(--line2);padding:2px 10px;color:#4e5a6b;}
.quota{width:60px;height:5px;background:var(--line2);display:inline-block;vertical-align:middle;margin-right:6px;}
.quota i{display:block;height:100%;}
.quota i.g{background:var(--green);}
.quota i.o{background:var(--orange);}
.quota i.r{background:var(--red);}

/* 按钮 */
.btn{padding:3px 10px;border:0;font:12px inherit;cursor:pointer;background:var(--line2);color:#4e5a6b;transition:.15s;}
.btn:hover{background:var(--line);}
.btn.b{background:#f0f2ff;color:var(--blue);}
.btn.b:hover{background:var(--blue);color:#fff;}
.btn.r{background:#fff1f0;color:var(--red);}
.btn.r:hover{background:var(--red);color:#fff;}
.btn.g{background:#e8f5e9;color:#2e7d32;}
.btn.g:hover{background:#2e7d32;color:#fff;}

/* Server：固定高 */
.server{flex:0 0 280px;}
.server #servers{flex:1;overflow-y:auto;}

.srv{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.15s;}
.srv:last-child{border:0;}
.srv:hover{background:#f7f8fa;}
.srv.active{background:#f0f2ff;border-left:3px solid var(--blue);padding-left:9px;}
.srv-info{flex:1;min-width:0;}
.srv-name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;}
.srv-meta{font-size:12px;color:var(--gray);margin-top:2px;display:flex;gap:10px;}
.srv-acts{display:flex;gap:5px;}

/* Log：占剩余 */
.log{flex:1;min-height:0;}
.log-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line2);background:#fafbfc;font-size:12px;flex:0 0 auto;}
.log-bar b{display:flex;align-items:center;gap:4px;color:#4e5a6b;}
.log-bar b i{color:var(--blue);}
.log-bar button{background:0;border:0;color:var(--gray);font:12px inherit;cursor:pointer;padding:2px 6px;}
.log-bar button:hover{color:var(--blue);}
.log-body{flex:1;min-height:0;background:#1d2129;color:#c9d1d9;font:12px/1.7 'SFMono-Regular',Consolas,Monaco,monospace;padding:10px 12px;overflow-y:auto;}
.log-body::-webkit-scrollbar-thumb{background:#3a414d;border:2px solid transparent;background-clip:padding-box;}
.log-body::-webkit-scrollbar-thumb:hover{background:#4e5a6b;border:2px solid transparent;background-clip:padding-box;}
.log-body::-webkit-scrollbar-track{background:#14171c;}
.log-body div{display:flex;gap:8px;white-space:pre-wrap;word-break:break-all;}
.log-body time{color:#6b7480;}
.log-body .warn{color:#ffb84d;}
.log-body .error{color:#ff7875;}
.log-body .ok{color:#7ee0b8;}
.log-body p{color:#6b7480;text-align:center;padding:50px 0;}

/* 告警 */
.al{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;}
.al:last-child{border:0;}
.lv{font-size:11px;font-weight:600;padding:2px 8px;}
.lv.p0{background:var(--red);color:#fff;}
.lv.p1{background:var(--orange);color:#fff;}
.lv.p2{background:var(--line2);color:#4e5a6b;}
.al time{color:var(--gray);font-size:12px;min-width:46px;}
.al span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 底部 */
.foot{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;color:var(--gray);flex:0 0 auto;}
.load{text-align:center;padding:16px;color:var(--gray);font-size:13px;}

/* 侧滑 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:.2s;z-index:99;}
.mask.on{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:90vw;background:#fff;border-left:1px solid var(--line);box-shadow:-4px 0 16px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .25s;z-index:100;display:flex;flex-direction:column;}
.drawer.on{transform:none;}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.dh b{font-size:14px;}
.dh button{background:0;border:0;font-size:15px;color:var(--gray);cursor:pointer;padding:4px 8px;}
.dh button:hover{color:var(--text);}
.db{flex:1;overflow-y:auto;padding:16px;min-height:0;}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex:0 0 auto;}

/* 表单 */
.f{margin-bottom:12px;}
.f label{display:block;font-size:12px;font-weight:500;margin-bottom:5px;color:#4e5a6b;}
.f label i{color:var(--red);font-style:normal;}
.f input,.f select{width:100%;padding:7px 9px;border:1px solid var(--line);font:13px inherit;background:#fff;outline:0;transition:.15s;}
.f input:focus,.f select:focus{border-color:var(--blue);}
.f small{font-size:11px;color:var(--gray);display:block;margin-top:3px;}
.ib{display:flex;position:relative;}
.ib input{flex:1;padding-right:34px;}
.ib button{position:absolute;right:0;top:0;bottom:0;width:34px;background:0;border:0;border-left:1px solid var(--line);color:var(--gray);cursor:pointer;}
.ib button:hover{color:var(--blue);}
.checks{display:flex;gap:16px;margin-top:2px;}
.checks label{display:flex;align-items:center;gap:5px;font-size:12px;color:#4e5a6b;cursor:pointer;}

/* 小屏：允许整页滚 */
@media (max-width:1200px){
    body{overflow:auto;}
    .app{height:auto;min-height:100%;}
    .main{grid-template-columns:1fr;min-height:0;}
    .col{min-height:400px;}
    .kpi{grid-template-columns:1fr 1fr;}
    .server{flex:0 0 auto;max-height:280px;}
    .log{min-height:260px;}
    .trend-panel,.agents-panel,.g2{flex:0 0 auto;}
    .g2{min-height:140px;}
}
@media (max-width:640px){
    body{padding:8px;}
    .kpi,.g2{grid-template-columns:1fr;}
    .navbar{flex-wrap:wrap;gap:8px;}
    .emg{margin-left:0;width:100%;padding:8px;}
}
</style>
</head>
<body>
<div class="app">

    <!-- 顶栏 -->
    <div class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> LLM<span>-Gate</span></div>
        <div class="nav-right">
            <span class="env"><i class="fas fa-check-circle"></i> 内网 · 开发</span>
            <i class="far fa-bell"></i>
            <span>负责人</span>
        </div>
    </div>

    <!-- 状态条 -->
    <div class="bar">
        <span><i class="dot g" id="gDot"></i> <em id="gText" style="font-style:normal">系统正常</em></span>
        <span><i class="fas fa-microchip"></i> 模型 <b style="color:var(--green)">●</b> 可用</span>
        <span><i class="fas fa-users"></i> 活跃 Agent <em id="activeAgents" style="font-style:normal">-</em></span>
        <span><i class="fas fa-exclamation-triangle" style="color:var(--orange)"></i> 告警 <i class="badge" id="alertCount">0</i></span>
        <button class="emg" id="emgBtn" onclick="toggleEmg()"><i class="fas fa-power-off"></i> 一键熔断</button>
    </div>

    <!-- 主布局 -->
    <div class="main">

        <!-- 左栏 -->
        <div class="col">
            <!-- KPI -->
            <div class="kpi">
                <div><small><i class="fas fa-arrow-right"></i> 实时 QPS</small><b id="kQps">-</b><em>加载中</em></div>
                <div><small><i class="fas fa-clock"></i> P95 延时</small><b id="kLat">-</b><em>加载中</em></div>
                <div><small><i class="fas fa-coins"></i> 今日成本</small><b id="kCost">-</b><em style="color:var(--orange)">加载中</em></div>
                <div><small><i class="fas fa-exclamation-circle"></i> 错误率</small><b id="kErr">-</b><em>加载中</em></div>
            </div>

            <!-- 趋势 -->
            <div class="panel trend-panel">
                <div class="ph"><b><i class="fas fa-chart-area"></i> 流量趋势（24h）</b></div>
                <div class="pb" style="overflow:hidden;">
                    <div class="chart" id="chart"></div>
                    <div class="legend">
                        <span><i style="background:var(--blue)"></i> 成功</span>
                        <span><i style="background:var(--red)"></i> 错误</span>
                    </div>
                </div>
            </div>

            <!-- 错误 + 告警 -->
            <div class="g2">
                <div class="panel">
                    <div class="ph"><b><i class="fas fa-times-circle"></i> 错误分布</b></div>
                    <div class="pb" id="errors"><div class="load">加载中...</div></div>
                </div>
                <div class="panel">
                    <div class="ph"><b><i class="fas fa-bell"></i> 实时告警</b></div>
                    <div class="pb" id="alerts"><div class="load">加载中...</div></div>
                </div>
            </div>

            <!-- 权限表 -->
            <div class="panel agents-panel">
                <div class="ph">
                    <b><i class="fas fa-user-cog"></i> Agent 权限表</b>
                    <a onclick="registerDemo()"><i class="fas fa-plus-circle"></i> 注册演示</a>
                </div>
                <div class="pb" id="agents"><div class="load">加载中...</div></div>
            </div>
        </div>

        <!-- 右栏 -->
        <div class="col">
            <div class="panel server">
                <div class="ph">
                    <b><i class="fas fa-server"></i> Agent Server</b>
                    <a onclick="openDrawer('add')"><i class="fas fa-plus"></i> 新增</a>
                </div>
                <div id="servers" style="min-height:0;"><div class="load">加载中...</div></div>
            </div>

            <div class="panel log">
                <div class="log-bar">
                    <b id="logSrc"><i class="fas fa-terminal"></i> 网关日志</b>
                    <span>
                        <button onclick="refreshLog()"><i class="fas fa-sync"></i></button>
                        <button onclick="clearLog()"><i class="fas fa-trash"></i></button>
                    </span>
                </div>
                <div class="log-body" id="logBody"><p>点击上方 Agent 或 Server 查看日志</p></div>
            </div>
        </div>
    </div>

    <div class="foot">
        <span><i class="fas fa-database"></i> 10s · <em id="updTime" style="font-style:normal">-</em></span>
        <span><i class="fas fa-shield-alt"></i> SQLite · ClickHouse</span>
    </div>
</div>

<!-- 侧滑表单 -->
<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="dh">
        <b id="dTitle">新增 Agent Server</b>
        <button onclick="closeDrawer()"><i class="fas fa-times"></i></button>
    </div>
    <div class="db">
        <div class="f"><label>Agent 名称 <i>*</i></label><input id="fName" placeholder="如 agent-gemini"><small>唯一标识，字母数字中划线</small></div>
        <div class="f"><label>Provider <i>*</i></label>
            <select id="fProvider">
                <option value="deepseek">deepseek</option>
                <option value="openai">openai</option>
                <option value="claude">claude</option>
                <option value="gemini">gemini</option>
            </select>
        </div>
        <div class="f"><label>端口 <i>*</i></label><input id="fPort" type="number" placeholder="8003"></div>
        <div class="f"><label>API Key <i>*</i></label>
            <div class="ib">
                <input id="fKey" type="password" placeholder="sk-...">
                <button onclick="toggleKey()"><i class="fas fa-eye" id="eyeI"></i></button>
            </div>
            <small id="keyHint">调 AI 用的 key，存 SQLite</small>
        </div>
        <div class="f"><label>Base URL</label><input id="fBase" placeholder="留空用默认"></div>
        <div class="f"><label>默认模型</label><input id="fModel" placeholder="如 deepseek-chat"></div>
        <div class="f"><label>日配额</label><input id="fQuota" type="number" placeholder="100000"></div>
        <div class="checks">
            <label><input type="checkbox" id="fOn" checked> 启用</label>
            <label><input type="checkbox" id="fAuto" checked> 启动时自动拉起</label>
        </div>
    </div>
    <div class="df">
        <button class="btn" onclick="closeDrawer()">取消</button>
        <button class="btn b" onclick="saveForm()">保存</button>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = async (u, o = {}) => (await fetch(u, {...o, headers: {'Content-Type': 'application/json', ...(o.headers || {})}})).json();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => new Date().toLocaleTimeString('zh-CN', {hour12: false});

// ---------- 监控 ----------
async function loadOverview(){
    const r = await api('/api/stats/overview');
    if(r.code !== 0) return;
    const d = r.data;
    $('kQps').textContent = d.qps || 0;
    $('kLat').textContent = (d.p95_latency || 0) + 'ms';
    $('kCost').textContent = '¥' + (d.cost_today || 0);
    $('kErr').textContent = (d.error_rate || 0) + '%';
    $('activeAgents').textContent = (d.active_agents || 0) + '/' + (d.total_agents || 0);
}

async function loadTrend(){
    const r = await api('/api/stats/trend');
    if(r.code !== 0) return;
    const {labels = [], success = [], error = []} = r.data;
    const max = Math.max(...success, 1);
    $('chart').innerHTML = labels.map((_, i) => {
        const h = Math.max(3, (success[i] || 0) / max * 60);
        const eh = error[i] ? Math.max(2, error[i] / max * 60) : 0;
        return `<div style="flex:1;display:flex;flex-direction:column-reverse;height:60px">
            <i style="height:${h}px"></i>
            ${eh ? `<i style="height:${eh}px;margin-top:-${eh}px;background:var(--red);opacity:.6"></i>` : ''}
        </div>`;
    }).join('');
}

async function loadErrors(){
    const r = await api('/api/stats/errors');
    const el = $('errors');
    if(r.code === 0 && r.data.length){
        el.innerHTML = r.data.map(e => {
            const c = e.code >= 500 ? 'r' : e.code === 429 ? 'o' : 'b';
            const t = e.code === 429 ? '限流' : e.code >= 500 ? '服务端' : '客户端';
            return `<div class="row"><span><i class="ct ${c}">${e.code}</i> ${t}</span><span class="cnt">${e.count} 次</span></div>`;
        }).join('');
    } else el.innerHTML = '<div class="load">暂无错误</div>';
}

async function loadAlerts(){
    const r = await api('/api/stats/alerts');
    const el = $('alerts');
    if(r.code === 0 && r.data.length){
        el.innerHTML = r.data.map(a => `<div class="al"><i class="lv ${a.level.toLowerCase()}">${a.level}</i><time>${a.time}</time><span title="${esc(a.msg)}">${esc(a.msg)}</span></div>`).join('');
        $('alertCount').textContent = r.data.length;
    } else {
        el.innerHTML = '<div class="load">暂无告警</div>';
        $('alertCount').textContent = '0';
    }
}

async function loadAgents(){
    const r = await api('/api/agents');
    const el = $('agents');
    if(r.code === 0 && r.data.length){
        el.innerHTML = `<table>
            <thead><tr><th>Agent ID</th><th>状态</th><th>模型</th><th>配额</th><th style="text-align:right">操作</th></tr></thead>
            <tbody>${r.data.map(a => {
                const u = a.quota_used || 0, d = a.quota_daily || 0;
                const p = d > 0 ? u / d * 100 : 0;
                const c = p > 85 ? 'r' : p > 60 ? 'o' : 'g';
                const s = a.enabled ? (p >= 100 ? 'o' : 'g') : 'o';
                const t = a.enabled ? (p >= 100 ? '限流' : '启用') : '禁用';
                return `<tr class="click" onclick="showLog('agent:${esc(a.agent_id)}')">
                    <td><b>${esc(a.agent_id)}</b></td>
                    <td><span class="st"><i class="dot ${s}"></i>${t}</span></td>
                    <td><span class="tag">${esc(a.model || '-')}</span></td>
                    <td><span class="quota"><i class="${c}" style="width:${Math.min(p, 100)}%"></i></span>${u.toLocaleString()}/${d.toLocaleString()}</td>
                    <td style="text-align:right" onclick="event.stopPropagation()">
                        ${a.enabled
                            ? `<button class="btn r" onclick="toggleAgent('${esc(a.agent_id)}','disable')">禁用</button>`
                            : `<button class="btn b" onclick="toggleAgent('${esc(a.agent_id)}','enable')">启用</button>`}
                    </td>
                </tr>`;
            }).join('')}</tbody></table>`;
    } else el.innerHTML = '<div class="load">暂无 Agent，点击右上角注册</div>';
}

async function toggleAgent(id, a){
    const r = await api(`/api/agents/${id}/${a}`, {method: 'POST'});
    if(r.code === 0){ loadAgents(); loadAlerts(); } else alert('失败: ' + r.msg);
}

async function registerDemo(){
    for(const id of ['agent-coder', 'agent-chat', 'agent-data', 'agent-vision']){
        await api(`/api/agents/${id}`, {method: 'POST', body: JSON.stringify({model: 'deepseek-v3', quota_daily: Math.floor(Math.random() * 100000) + 50000})});
    }
    loadAgents(); loadOverview();
}

// ---------- Server ----------
let servers = [];

async function loadServers(){
    const r = await api('/api/servers');
    if(r.code === 0){ servers = r.data || []; renderServers(); }
}

function renderServers(){
    const el = $('servers');
    if(!servers.length){ el.innerHTML = '<div class="load">暂无 Server，点击新增</div>'; return; }
    el.innerHTML = servers.map(s => `
        <div class="srv" onclick="showLog('server:${esc(s.name)}')">
            <div class="srv-info">
                <div class="srv-name"><i class="dot ${s.status === 'running' ? 'g' : 'o'}"></i> ${esc(s.name)}</div>
                <div class="srv-meta">
                    <span><i class="fas fa-microchip"></i> ${esc(s.provider)}</span>
                    <span><i class="fas fa-plug"></i> :${s.port}</span>
                    <span><i class="fas fa-hashtag"></i> ${s.pid || '-'}</span>
                </div>
            </div>
            <div class="srv-acts" onclick="event.stopPropagation()">
                ${s.status === 'running'
                    ? `<button class="btn r" onclick="srvAct('${esc(s.name)}','stop')">停止</button>
                       <button class="btn" onclick="srvAct('${esc(s.name)}','restart')">重启</button>`
                    : `<button class="btn g" onclick="srvAct('${esc(s.name)}','start')">启动</button>`}
                <button class="btn b" onclick="openDrawer('edit','${esc(s.name)}')">配置</button>
            </div>
        </div>`).join('');
}

async function srvAct(name, a){
    if(!confirm(`确认 ${a} ${name}？`)) return;
    const r = await api(`/api/servers/${name}/${a}`, {method: 'POST'});
    if(r.code === 0) loadServers(); else alert('操作失败: ' + r.msg);
}

// ---------- 侧滑表单 ----------
const MASK = '••••••••••••';
let dMode = 'add', dTarget = null;

function openDrawer(mode, name){
    dMode = mode; dTarget = name || null;
    const s = mode === 'edit' ? servers.find(x => x.name === name) : null;
    $('dTitle').textContent = mode === 'add' ? '新增 Agent Server' : `配置 ${name}`;
    $('fName').value = s?.name || ''; $('fName').disabled = mode === 'edit';
    $('fProvider').value = s?.provider || 'deepseek';
    $('fPort').value = s?.port || '';
    $('fKey').value = mode === 'edit' && s?.api_key ? MASK : '';
    $('fKey').type = 'password'; $('eyeI').className = 'fas fa-eye';
    $('fBase').value = s?.base_url || '';
    $('fModel').value = s?.model || '';
    $('fQuota').value = s?.quota_daily || '';
    $('fOn').checked = s?.enabled !== false;
    $('fAuto').checked = s?.auto_start !== false;
    $('keyHint').textContent = mode === 'edit' ? '留空表示不修改' : '调 AI 用的 key，存 SQLite';
    $('mask').classList.add('on'); $('drawer').classList.add('on');
}

function closeDrawer(){ $('mask').classList.remove('on'); $('drawer').classList.remove('on'); }

function toggleKey(){
    const i = $('fKey'), ic = $('eyeI');
    i.type = i.type === 'password' ? 'text' : 'password';
    ic.className = i.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}

async function saveForm(){
    const p = {
        name: $('fName').value.trim(),
        provider: $('fProvider').value,
        port: parseInt($('fPort').value),
        base_url: $('fBase').value.trim(),
        model: $('fModel').value.trim(),
        quota_daily: parseInt($('fQuota').value) || 0,
        enabled: $('fOn').checked,
        auto_start: $('fAuto').checked,
    };
    const k = $('fKey').value.trim();
    if(dMode === 'add'){ if(!k){ alert('请填 API Key'); return; } p.api_key = k; }
    else if(k && k !== MASK) p.api_key = k;
    if(!p.name){ alert('请填 Agent 名称'); return; }
    if(!p.port){ alert('请填端口'); return; }
    const r = dMode === 'add'
        ? await api('/api/servers', {method: 'POST', body: JSON.stringify(p)})
        : await api(`/api/servers/${dTarget}`, {method: 'PUT', body: JSON.stringify(p)});
    if(r.code === 0){ closeDrawer(); loadServers(); } else alert('保存失败: ' + r.msg);
}

// ---------- 日志 ----------
const mockLogs = {
    gateway: [
        {ts: '20:00:01', lv: 'info', msg: '网关启动，监听 0.0.0.0:5000'},
        {ts: '20:00:02', lv: 'info', msg: 'Redis 连接成功'},
        {ts: '20:00:03', lv: 'ok', msg: 'ClickHouse 连接成功'},
        {ts: '20:01:12', lv: 'info', msg: 'agent-coder 上报：1280 tokens, 320ms'},
        {ts: '20:01:15', lv: 'warn', msg: 'agent-data 配额使用 82%'},
    ],
};
let logSrc = 'gateway';

function showLog(k){
    logSrc = k;
    $('logSrc').innerHTML = `<i class="fas fa-terminal"></i> ${esc(k)}`;
    document.querySelectorAll('.srv').forEach(el => el.classList.remove('active'));
    refreshLog();
}

async function refreshLog(){
    const r = await api(`/api/logs?src=${encodeURIComponent(logSrc)}`);
    const lines = (r.code === 0 && r.data) ? r.data : (mockLogs[logSrc] || []);
    $('logBody').innerHTML = lines.length
        ? lines.map(l => `<div class="${l.lv}"><time>${l.ts}</time><span>${esc(l.msg)}</span></div>`).join('')
        : '<p>（无日志）</p>';
}

function clearLog(){ $('logBody').innerHTML = '<p>（无日志）</p>'; }

// ---------- 熔断 ----------
let blocked = false;
async function toggleEmg(){
    const r = await api(blocked ? '/api/global/recover' : '/api/global/block', {method: 'POST'});
    if(r.code !== 0) return;
    blocked = !blocked;
    $('emgBtn').innerHTML = blocked ? '<i class="fas fa-power-off"></i> 解除熔断' : '<i class="fas fa-power-off"></i> 一键熔断';
    $('emgBtn').className = blocked ? 'emg on' : 'emg';
    $('gDot').className = blocked ? 'dot r' : 'dot g';
    $('gText').textContent = blocked ? '全局熔断' : '系统正常';
}

// ---------- 启动 ----------
async function refreshAll(){
    $('updTime').textContent = now();
    await Promise.all([loadOverview(), loadTrend(), loadErrors(), loadAlerts(), loadAgents()]);
}
loadServers(); refreshLog(); refreshAll();
setInterval(refreshAll, 10000);
</script>
