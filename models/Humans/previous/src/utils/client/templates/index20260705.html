<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SurvX · 荒岛求生</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js">
    </script>

    <style>
        /* ===== 全局暖色调 ===== */
        :root {
            --primary: #f6b07c;
            --primary-dark: #d4845a;
            --primary-light: #f5cba0;
            --primary-transparent: rgba(246, 176, 124, 0.15);
            --bg-primary: #0e0b0a;
            --bg-secondary: #1a1412;
            --bg-tertiary: #221c19;
            --text-primary: #e4d7cf;
            --text-secondary: #d4c4b8;
            --text-tertiary: #a28c7c;
            --border-color: #3a2c24;
            --error-color: #f58b7a;
            --success-color: #eab676;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 18px;
            font-weight: 300;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(246, 176, 124, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(212, 132, 90, 0.04) 0%, transparent 45%);
            z-index: 0;
            pointer-events: none;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 6px;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .map-container {
            flex: 1;
            min-width: 420px;
            position: relative;
            background: #0a0807;
            overflow: hidden;
        }
        .map-container.controlling {
            cursor: none;
        }
        .map-container:not(.controlling) {
            cursor: grab;
        }
        .map-container:not(.controlling):active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .title-block {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 15;
            pointer-events: none;
            user-select: none;
        }
        .title-block h1 {
            font-size: 2.0rem;
            font-weight: 500;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f5cba0 0%, #f6b07c 40%, #d4845a 80%, #c07a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(246, 176, 124, 0.15);
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        /* ===== 状态面板 — 标题下方 ===== */
        .status-panel {
            position: absolute;
            top: 72px;
            left: 16px;
            z-index: 14;
            background: rgba(14, 11, 10, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(246, 176, 124, 0.15);
            border-radius: 10px;
            padding: 18px 24px 16px 24px;
            min-width: 220px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            display: none;
            pointer-events: none;
            user-select: none;
        }
        .status-panel.show {
            display: block;
        }
        .status-panel .panel-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--primary-light);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.08);
            padding-bottom: 8px;
        }
        .status-panel .stat-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .status-panel .stat-row .stat-label {
            min-width: 36px;
            color: var(--text-tertiary);
            font-size: 1.0rem;
            flex-shrink: 0;
        }
        .status-panel .stat-row .stat-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            min-width: 80px;
        }
        .status-panel .stat-row .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .status-panel .stat-row .stat-value {
            min-width: 36px;
            text-align: right;
            font-size: 0.95rem;
            color: var(--text-tertiary);
        }
        .fill-health {
            background: linear-gradient(90deg, #f58b7a, #f6b07c);
        }
        .fill-energy {
            background: linear-gradient(90deg, #eab676, #f5cba0);
        }
        .fill-mood {
            background: linear-gradient(90deg, #7ec8c8, #a8e0e0);
        }
        .fill-hunger {
            background: linear-gradient(90deg, #eab676, #f6b07c);
        }

        /* ===== 右下角竖排图标 ===== */
        .right-actions {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 14px;
            pointer-events: none;
        }
        .right-actions .action-btn {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 1px solid rgba(246, 176, 124, 0.25);
            background: rgba(14, 11, 10, 0.7);
            backdrop-filter: blur(8px);
            color: var(--text-secondary);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            user-select: none;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .right-actions .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
            box-shadow: 0 0 20px rgba(246, 176, 124, 0.08);
            transform: scale(1.05);
        }
        .right-actions .action-btn .icon {
            font-size: 22px;
            line-height: 1;
        }
        .right-actions .action-btn .label {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .right-actions .action-btn.active-btn {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
        }

        .minimap {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 180px;
            height: 150px;
            border: 1px solid rgba(246, 176, 124, 0.3);
            border-radius: 6px;
            background: rgba(14, 11, 10, 0.8);
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }

        .control-cursor {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            font-size: 36px;
            transform: translate(-50%, -50%);
            display: none;
            text-shadow: 0 0 20px rgba(255, 152, 0, 0.6);
        }
        .control-cursor.show {
            display: block;
        }

        /* ===== 弹窗 ===== */
        .float-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border: 1px solid rgba(246, 176, 124, 0.25);
            border-radius: 12px;
            padding: 32px 36px 28px 36px;
            min-width: 420px;
            max-width: 600px;
            width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(246, 176, 124, 0.05);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            pointer-events: auto;
            animation: modalFadeIn 0.2s ease;
        }
        .float-modal.show {
            display: block;
        }
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .float-modal .modal-title {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--primary-light);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.1);
            padding-bottom: 14px;
            text-align: center;
        }
        .float-modal .modal-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 22px;
        }
        .float-modal .modal-body .option-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .float-modal .modal-body .option-group label {
            min-width: 80px;
            color: var(--text-tertiary);
            font-size: 1.0rem;
            flex-shrink: 0;
        }
        .float-modal .modal-body .option-group select,
        .float-modal .modal-body .option-group input,
        .float-modal .modal-body .option-group textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(246, 176, 124, 0.2);
            border-radius: 4px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 1.0rem;
            outline: none;
            font-family: inherit;
            flex: 1;
            min-width: 100px;
        }
        .float-modal .modal-body .option-group textarea {
            resize: vertical;
            min-height: 60px;
            line-height: 1.4;
        }
        .float-modal .modal-body .option-group select:focus,
        .float-modal .modal-body .option-group input:focus,
        .float-modal .modal-body .option-group textarea:focus {
            border-color: var(--primary);
        }
        .float-modal .modal-body .option-group select option {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .float-modal .modal-body .option-group .coord-display {
            font-size: 0.95rem;
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
            padding: 4px 14px;
            border-radius: 4px;
            border: 1px dashed rgba(246, 176, 124, 0.2);
            min-width: 100px;
            text-align: center;
        }
        .float-modal .modal-body .option-group .hint-text {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            font-style: italic;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 10px;
            border-radius: 3px;
            user-select: none;
        }
        .float-modal .modal-body .option-group .hint-text:hover {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
        }
        .float-modal .modal-body .option-group .hint-text.active {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
        }
        .float-modal .modal-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            border-top: 1px solid rgba(246, 176, 124, 0.08);
            padding-top: 18px;
        }
        .float-modal .modal-actions button {
            background: transparent;
            border: 1px solid rgba(246, 176, 124, 0.25);
            color: var(--text-secondary);
            padding: 8px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.0rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .float-modal .modal-actions button:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: var(--primary-transparent);
        }
        .float-modal .modal-actions .btn-confirm {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
        }
        .float-modal .modal-actions .btn-confirm:hover {
            background: rgba(246, 176, 124, 0.15);
        }

        .func-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.08);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }
        .func-tabs .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            padding: 8px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .func-tabs .tab-btn:hover {
            color: var(--text-secondary);
            background: rgba(246, 176, 124, 0.05);
        }
        .func-tabs .tab-btn.active {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.1);
        }
        .func-panel-content {
            min-height: 140px;
        }
        .func-panel-content .option-group {
            margin: 12px 0;
        }

        /* ===== 日志面板 ===== */
        .log-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 33.33%;
            height: 280px;
            background: rgba(10, 8, 7, 0.55);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(246, 176, 124, 0.08);
            border-right: 1px solid rgba(246, 176, 124, 0.08);
            z-index: 15;
            display: none;
            flex-direction: column;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            pointer-events: auto;
            padding: 12px 18px 14px 18px;
        }
        .log-panel.show {
            display: flex;
        }
        .log-panel .log-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .log-panel .log-header .close-log {
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 24px;
            line-height: 1;
            transition: 0.2s;
            padding: 0 4px;
        }
        .log-panel .log-header .close-log:hover {
            color: var(--primary-light);
        }
        .log-panel .log-body {
            flex: 1;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.9;
            color: var(--text-secondary);
            padding-right: 4px;
        }
        .log-panel .log-body .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(246, 176, 124, 0.03);
            display: flex;
            gap: 14px;
            align-items: baseline;
        }
        .log-panel .log-body .log-entry .log-time {
            color: var(--primary-light);
            font-weight: 400;
            flex-shrink: 0;
            font-size: 0.85rem;
            min-width: 56px;
            opacity: 0.8;
        }
        .log-panel .log-body .log-entry .log-msg {
            color: var(--text-secondary);
            word-break: break-word;
            font-weight: 300;
            opacity: 0.9;
        }

        .map-container.pick-coord {
            cursor: crosshair !important;
        }
        .map-container.pick-coord canvas {
            cursor: crosshair !important;
        }

        /* ============================================================
           漫画风气泡 — 无尾巴，图标区分
           ============================================================ */
        .bubble-container {
            position: absolute;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.35s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bubble-container.show {
            opacity: 1;
        }
        .bubble-container.fading {
            opacity: 0;
        }

        .bubble-body {
            padding: 16px 24px;
            border-radius: 22px;
            min-width: 100px;
            max-width: 360px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 400;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
            scrollbar-width: thin;
            word-break: break-word;
            position: relative;
            z-index: 2;
            border-width: 2px;
            border-style: solid;
        }
        .bubble-body::-webkit-scrollbar {
            width: 3px;
        }
        .bubble-body::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }

        /* ----- 想法气泡（暖色 · 左侧） ----- */
        .bubble-thought .bubble-body {
            background: #fdf6ee;
            border-color: #3d2b1f;
            color: #2d1f14;
        }

        /* ----- 说话气泡（冷色 · 右侧） ----- */
        .bubble-speech .bubble-body {
            background: #e8f4f8;
            border-color: #4a7c8c;
            color: #1a3a44;
        }

        /* ===== 天气层 ===== */
        #weatherCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: block;
        }

        /* ===== 天气指示器 (小) ===== */
        .weather-indicator {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            background: rgba(14, 11, 10, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(246, 176, 124, 0.12);
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            pointer-events: none;
            user-select: none;
            letter-spacing: 0.5px;
            font-weight: 400;
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        .weather-indicator.show {
            opacity: 0.7;
        }
        .weather-indicator .env-icon {
            margin-right: 6px;
        }

        @media (max-width: 800px) {
            .main {
                flex-direction: column;
            }
            .map-container {
                min-width: auto;
                height: 100vh;
            }
            .minimap {
                width: 140px;
                height: 110px;
                top: 8px;
                right: 8px;
            }
            .title-block h1 {
                font-size: 1.6rem;
            }
            .status-panel {
                top: 64px;
                left: 10px;
                padding: 14px 18px 14px 18px;
                min-width: 180px;
            }
            .status-panel .panel-name {
                font-size: 1.0rem;
            }
            .status-panel .stat-row .stat-label {
                font-size: 0.9rem;
                min-width: 30px;
            }
            .status-panel .stat-row .stat-value {
                font-size: 0.9rem;
                min-width: 30px;
            }
            .right-actions {
                bottom: 14px;
                right: 8px;
                gap: 10px;
            }
            .right-actions .action-btn {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }
            .right-actions .action-btn .label {
                font-size: 0.6rem;
            }
            .log-panel {
                width: 50%;
                height: 220px;
                padding: 8px 14px 10px 14px;
            }
            .log-panel .log-body {
                font-size: 0.85rem;
            }
            .float-modal {
                min-width: 300px;
                padding: 22px 24px;
                max-width: 95vw;
            }
            .func-tabs .tab-btn {
                font-size: 0.85rem;
                padding: 6px 14px;
            }
            .float-modal .modal-body .option-group label {
                min-width: 70px;
                font-size: 0.9rem;
            }
            .bubble-body {
                max-width: 220px !important;
                max-height: 120px !important;
                font-size: 1.0rem !important;
                padding: 12px 18px !important;
            }
            .weather-indicator {
                font-size: 0.65rem;
                padding: 3px 12px;
                top: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="main">
        <div class="map-container" id="mapContainer">
            <!-- 地图 -->
            <canvas id="mapCanvas"></canvas>
            <!-- 天气层 (透明动画层) -->
            <canvas id="weatherCanvas"></canvas>

            <div class="title-block">
                <h1 id="mapTitle">加载中...</h1>
            </div>

            <!-- ===== 状态面板 — 标题下方 ===== -->
            <div class="status-panel" id="statusPanel">
                <div class="panel-name" id="panelName">🧒 鲁滨逊</div>
                <div class="stat-row"><span class="stat-label">❤️</span><div class="stat-bar"><div class="stat-fill fill-health" id="pHealth" style="width:80%"></div></div><span class="stat-value" id="pHealthVal">80</span></div>
                <div class="stat-row"><span class="stat-label">⚡</span><div class="stat-bar"><div class="stat-fill fill-energy" id="pEnergy" style="width:70%"></div></div><span class="stat-value" id="pEnergyVal">70</span></div>
                <div class="stat-row"><span class="stat-label">😊</span><div class="stat-bar"><div class="stat-fill fill-mood" id="pMood" style="width:60%"></div></div><span class="stat-value" id="pMoodVal">60</span></div>
                <div class="stat-row"><span class="stat-label">🍗</span><div class="stat-bar"><div class="stat-fill fill-hunger" id="pHunger" style="width:50%"></div></div><span class="stat-value" id="pHungerVal">50</span></div>
            </div>

            <!-- ===== 天气指示器 ===== -->
            <div class="weather-indicator" id="weatherIndicator">
                <span class="env-icon" id="weatherIcon">☀️</span>
                <span id="weatherLabel">晴天</span>
                <span style="margin:0 6px;opacity:0.3;">·</span>
                <span id="timeLabel">白天</span>
            </div>

            <div class="minimap" id="minimap"><canvas id="minimapCanvas"></canvas></div>

            <div class="control-cursor" id="controlCursor">🎯</div>

            <!-- ===== 右下角竖排图标 ===== -->
            <div class="right-actions" id="rightActions">
                <div class="action-btn" id="btnMode" title="选择模式"><span class="icon">⚙️</span></div>
                <div class="action-btn" id="btnPanel" title="功能面板"><span class="icon">📋</span></div>
                <div class="action-btn" id="btnLog" title="日志"><span class="icon">📜</span></div>
                <div class="action-btn" id="btnStatus" title="状态"><span class="icon">📊</span></div>
            </div>

            <div class="log-panel" id="logPanel">

        // ---- 初始化粒子 ----
        function initRainParticles(count) {

                snowParticles.push({
                    x: Math.random() * WORLD_W,

        // ---- 重置天气 ----
        function resetWeather() {
            ENV.timeOfDay = 'day';

        // ---- 设置环境 (供后端调用) ----
        function setEnvironment(data) {
            if (data.timeOfDay) ENV.timeOfDay = data.timeOfDay;
            if (data.weather) ENV.weather = data.weather;
            if (data.intensity !== undefined) ENV.intensity = Math.max(0, Math.min(1, data.intensity));

            // 根据天气初始化粒子
            if (ENV.weather === 'rain' || ENV.weather === 'storm') {
                const count = ENV.weather === 'storm' ? MAX_RAIN : Math.floor(MAX_RAIN * (0.3 + ENV.intensity * 0.7));
                initRainParticles(Math.max(20, count));
            } else {
                rainParticles = [];
            }

            if (ENV.weather === 'snow') {
                const count = Math.floor(MAX_SNOW * (0.3 + ENV.intensity * 0.7));
                initSnowParticles(Math.max(15, count));
            } else {
                snowParticles = [];
            }

            if (ENV.timeOfDay === 'night') {
                initStarParticles(MAX_STARS);
            } else {
                starParticles = [];
            }

            if (ENV.weather === 'storm') {
                flashTimer = 0;
                isFlashing = false;
            }

            updateWeatherIndicator();
            addLogEntry('环境', `${TIME_ICONS[ENV.timeOfDay] || ''} ${WEATHER_ICONS[ENV.weather] || ''} · 强度 ${Math.round(ENV.intensity * 100)}%`);
        }

        // ---- 更新天气指示器 ----
        function updateWeatherIndicator() {
            const indicator = document.getElementById('weatherIndicator');
            const icon = document.getElementById('weatherIcon');
            const label = document.getElementById('weatherLabel');
            const timeLabel = document.getElementById('timeLabel');

            const isDefault = ENV.weather === 'clear' && ENV.timeOfDay === 'day';
            if (isDefault) {
                indicator.classList.remove('show');
                return;
            }

            icon.textContent = WEATHER_ICONS[ENV.weather] || '☀️';
            label.textContent = WEATHER_LABELS[ENV.weather] || '晴天';
            timeLabel.textContent = TIME_LABELS[ENV.timeOfDay] || '白天';
            indicator.classList.add('show');
        }

        // ============================================================
        // 🌤️ 天气绘制函数
        // ============================================================

        function drawWeather() {
            const canvas = document.getElementById('weatherCanvas');
            const container = document.getElementById('mapContainer');
            if (!canvas || !container) return;

            const ctx = canvas.getContext('2d');
            const cw = canvas.width = container.clientWidth;
            const ch = canvas.height = container.clientHeight;

            // 如果天气是 clear 且时间是 day，直接清空透明
            const isDefault = ENV.weather === 'clear' && ENV.timeOfDay === 'day';
            if (isDefault) {
                ctx.clearRect(0, 0, cw, ch);
                return;
            }

            ctx.clearRect(0, 0, cw, ch);

            // ----- 1. 时间色调 (全屏遮罩) -----
            drawTimeOverlay(ctx, cw, ch);

            // ----- 2. 天气粒子 -----
            if (ENV.weather === 'rain' || ENV.weather === 'storm') {
                drawRain(ctx, cw, ch);
            } else if (ENV.weather === 'snow') {
                drawSnow(ctx, cw, ch);
            } else if (ENV.weather === 'fog') {
                drawFog(ctx, cw, ch);
            }

            // ----- 3. 星星 (夜晚) -----
            if (ENV.timeOfDay === 'night' && ENV.weather !== 'storm') {
                drawStars(ctx, cw, ch);
            }

            // ----- 4. 暴风雨闪电 -----
            if (ENV.weather === 'storm') {
                drawStormFlash(ctx, cw, ch);
            }
        }

        // ---- 1. 时间遮罩 ----
        function drawTimeOverlay(ctx, cw, ch) {
            let alpha = 0;
            let color = '';

            switch (ENV.timeOfDay) {
                case 'day':
                    return; // 不画
                case 'dawn':
                    alpha = 0.08 + ENV.intensity * 0.08;
                    color = 'rgba(255, 180, 80, ';
                    break;
                case 'dusk':
                    alpha = 0.12 + ENV.intensity * 0.12;
                    color = 'rgba(200, 100, 60, ';
                    break;
                case 'night':
                    alpha = 0.45 + ENV.intensity * 0.25;
                    color = 'rgba(10, 15, 40, ';
                    break;
                default:
                    return;
            }

            // 如果是夜晚且天气是 storm，加重暗度
            if (ENV.timeOfDay === 'night' && ENV.weather === 'storm') {
                alpha = Math.min(0.85, alpha + 0.2);
            }

            ctx.fillStyle = color + alpha + ')';
            ctx.fillRect(0, 0, cw, ch);

            // 黎明/黄昏加一点径向渐变光晕
            if (ENV.timeOfDay === 'dawn' || ENV.timeOfDay === 'dusk') {
                const grad = ctx.createRadialGradient(
                    cw * (ENV.timeOfDay === 'dawn' ? 0.2 : 0.8), ch * 0.85, 50,
                    cw * (ENV.timeOfDay === 'dawn' ? 0.2 : 0.8), ch * 0.85, cw * 0.8
                );
                if (ENV.timeOfDay === 'dawn') {
                    grad.addColorStop(0, 'rgba(255, 200, 120, 0.12)');
                    grad.addColorStop(1, 'rgba(255, 200, 120, 0)');
                } else {
                    grad.addColorStop(0, 'rgba(200, 100, 60, 0.15)');
                    grad.addColorStop(1, 'rgba(200, 100, 60, 0)');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);
            }
        }

        // ---- 2. 雨 ----
        function drawRain(ctx, cw, ch) {
            const count = rainParticles.length;
            if (count === 0) return;

            const isStorm = ENV.weather === 'storm';
            const wind = isStorm ? 0.6 + ENV.intensity * 0.4 : 0.2 + ENV.intensity * 0.3;
            const speedMul = isStorm ? 1.4 : 0.8 + ENV.intensity * 0.6;
            const alphaMul = isStorm ? 0.8 + ENV.intensity * 0.2 : 0.5 + ENV.intensity * 0.4;

            ctx.strokeStyle = 'rgba(180, 200, 220, ';
            ctx.lineWidth = isStorm ? 1.5 : 1.2;

            for (const p of rainParticles) {
                const sx = (p.x - viewX) * zoom;
                const sy = (p.y - viewY) * zoom;

                // 屏幕外裁剪
                if (sx < -20 || sx > cw + 20 || sy < -20 || sy > ch + 20) {
                    p.y -= 20; // 重置到顶部附近
                    p.x = Math.random() * WORLD_W;
                    continue;
                }

                const len = p.length * (0.8 + ENV.intensity * 0.4);
                const alpha = p.opacity * alphaMul;

                ctx.globalAlpha = Math.min(0.7, alpha);
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(
                    sx - wind * len * 0.6,
                    sy + len * speedMul * 0.8
                );
                ctx.stroke();

                // 更新位置 (世界坐标)
                p.x -= wind * 0.6;
                p.y += p.speed * speedMul * 0.7;

                // 重置
                if (p.y > WORLD_H + 20) {
                    p.y = -20;
                    p.x = Math.random() * WORLD_W;
                }
                if (p.x < -20) p.x = WORLD_W + 20;
                if (p.x > WORLD_W + 20) p.x = -20;
            }

            ctx.globalAlpha = 1;
        }

        // ---- 3. 雪 ----
        function drawSnow(ctx, cw, ch) {
            const count = snowParticles.length;
            if (count === 0) return;

            const time = Date.now() / 1000;
            const wind = 0.1 + ENV.intensity * 0.3;

            for (const p of snowParticles) {
                const sx = (p.x - viewX) * zoom;
                const sy = (p.y - viewY) * zoom;

                if (sx < -20 || sx > cw + 20 || sy < -20 || sy > ch + 20) {
                    p.y = -10;
                    p.x = Math.random() * WORLD_W;
                    continue;
                }

                const size = p.size * (0.8 + ENV.intensity * 0.4);
                const alpha = p.opacity * (0.6 + ENV.intensity * 0.3);

                ctx.globalAlpha = Math.min(0.8, alpha);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(1, size), 0, Math.PI * 2);
                ctx.fill();

                // 更新 (世界坐标)
                p.x += Math.sin(time * p.wobbleSpeed + p.phase) * p.wobbleAmount * 0.15 + wind * 0.2;
                p.y += p.speed * (0.6 + ENV.intensity * 0.4);

                if (p.y > WORLD_H + 20) {
                    p.y = -10;
                    p.x = Math.random() * WORLD_W;
                }
                if (p.x < -20) p.x = WORLD_W + 20;
                if (p.x > WORLD_W + 20) p.x = -20;
            }

            ctx.globalAlpha = 1;
        }

        // ---- 4. 雾 ----
        function drawFog(ctx, cw, ch) {
            const alpha = 0.08 + ENV.intensity * 0.25;
            const time = Date.now() / 10000;

            // 多层雾
            for (let layer = 0; layer < 3; layer++) {
                const offset = layer * 0.3 + time * (0.2 + layer * 0.1);
                const cx = cw * (0.3 + Math.sin(offset) * 0.3);
                const cy = ch * (0.4 + Math.cos(offset * 0.7) * 0.3);
                const radius = Math.max(cw, ch) * (0.6 + layer * 0.2);

                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, `rgba(200, 210, 220, ${alpha * (0.6 + layer * 0.2)})`);
                grad.addColorStop(0.5, `rgba(180, 190, 200, ${alpha * (0.3 + layer * 0.15)})`);
                grad.addColorStop(1, 'rgba(180, 190, 200, 0)');

                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);
            }
        }

        // ---- 5. 星星 ----
        function drawStars(ctx, cw, ch) {
            const time = Date.now() / 1000;

            for (const star of starParticles) {
                const sx = (star.x - viewX) * zoom;
                const sy = (star.y - viewY) * zoom;

                if (sx < -5 || sx > cw + 5 || sy < -5 || sy > ch + 5) continue;

                const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.phase);
                const size = star.size * (0.5 + twinkle * 0.5);
                const alpha = 0.4 + twinkle * 0.5;

                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(255, 255, 240, 0.9)';
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(0.5, size), 0, Math.PI * 2);
                ctx.fill();

                // 大星星加十字光芒
                if (star.size > 1.8 && twinkle > 0.7) {
                    ctx.globalAlpha = alpha * 0.3;
                    ctx.fillStyle = 'rgba(255, 255, 240, 0.8)';
                    ctx.fillRect(sx - 1, sy - 4, 2, 8);
                    ctx.fillRect(sx - 4, sy - 1, 8, 2);
                }
            }

            ctx.globalAlpha = 1;
        }

        // ---- 6. 暴风雨闪电 ----
        function drawStormFlash(ctx, cw, ch) {
            // 随机触发闪电
            flashTimer += 0.016;

            if (!isFlashing) {
                // 每 3-8 秒触发一次
                if (flashTimer > 3 + Math.random() * 5) {
                    isFlashing = true;
                    flashAlpha = 0.6 + Math.random() * 0.3;
                    flashTimer = 0;
                    // 随机闪电位置偏移
                    const flashX = (Math.random() - 0.5) * cw * 0.4 + cw * 0.5;
                    const flashY = (Math.random() - 0.5) * ch * 0.3 + ch * 0.2;
                    // 闪电形状用白色闪光 + 放射状线条简化
                    ctx.save();

                    // 主闪光
                    ctx.globalAlpha = flashAlpha * 0.9;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(flashX, flashY, 8 + Math.random() * 12, 0, Math.PI * 2);
                    ctx.fill();

                    // 枝杈 (简单线条)
                    ctx.globalAlpha = flashAlpha * 0.6;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2 + Math.random() * 2;
                    ctx.shadowBlur = 20;
                    for (let i = 0; i < 3 + Math.random() * 4; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const len = 20 + Math.random() * 50;
                        ctx.beginPath();
                        ctx.moveTo(flashX, flashY);
                        ctx.lineTo(
                            flashX + Math.cos(angle) * len,
                            flashY + Math.sin(angle) * len * (0.5 + Math.random() * 0.5)
                        );
                        ctx.stroke();
                    }

                    ctx.restore();

                    // 闪后渐暗
                    setTimeout(() => {
                        isFlashing = false;
                        flashAlpha = 0;
                    }, 80 + Math.random() * 120);
                }
            } else {
                // 正在闪烁中，逐渐变暗
                flashAlpha *= 0.95;
                if (flashAlpha < 0.01) {
                    isFlashing = false;
                    flashAlpha = 0;
                }
            }

            // 全屏闪白 (非常短暂)
            if (isFlashing && flashAlpha > 0.3) {
                ctx.globalAlpha = flashAlpha * 0.15;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(0, 0, cw, ch);
                ctx.globalAlpha = 1;
            }
        }

        // ============================================================
        // 天气模拟 (模拟后端推送)
        // ============================================================

        let weatherSimTimer = 0;
        let weatherSimActive = false;

        function startWeatherSimulation() {
            if (weatherSimActive) return;
            weatherSimActive = true;
            addLogEntry('天气', '🌤️ 天气模拟已启动');

            // 先重置为晴天
            resetWeather();

            // 序列模拟: 晴天 → 黄昏 → 夜晚 → 下雨 → 暴风雨 → 雪 → 雾 → 黎明 → 晴天
            const sequence = [
                { timeOfDay: 'dusk', weather: 'clear', intensity: 0.3, delay: 8000 },
                { timeOfDay: 'night', weather: 'clear', intensity: 0.6, delay: 6000 },
                { timeOfDay: 'night', weather: 'rain', intensity: 0.5, delay: 7000 },
                { timeOfDay: 'night', weather: 'storm', intensity: 0.8, delay: 5000 },
                { timeOfDay: 'night', weather: 'snow', intensity: 0.6, delay: 7000 },
                { timeOfDay: 'night', weather: 'fog', intensity: 0.7, delay: 5000 },
                { timeOfDay: 'dawn', weather: 'fog', intensity: 0.4, delay: 6000 },
                { timeOfDay: 'day', weather: 'clear', intensity: 0, delay: 4000 },
            ];

            let index = 0;

            function nextWeather() {
                if (!weatherSimActive) return;
                if (index >= sequence.length) {
                    // 循环
                    index = 0;
                }

                const step = sequence[index];
                setEnvironment({
                    timeOfDay: step.timeOfDay,
                    weather: step.weather,
                    intensity: step.intensity
                });

                // 记录到日志
                const icon = WEATHER_ICONS[step.weather] || '☀️';
                const label = WEATHER_LABELS[step.weather] || '晴天';
                const timeLabel = TIME_LABELS[step.timeOfDay] || '白天';
                addLogEntry('天气模拟', `${icon} ${timeLabel} · ${label} (${Math.round(step.intensity * 100)}%)`);

                index++;
                setTimeout(nextWeather, step.delay);
            }

            // 3秒后开始
            setTimeout(nextWeather, 3000);
        }

        function stopWeatherSimulation() {
            weatherSimActive = false;
            resetWeather();
            addLogEntry('天气', '⏹️ 天气模拟已停止');
        }

        // ---- 工具函数 ----
        function getTerrainZ(wx, wy) {
            for (const t of TERRAINS) {
                if (pointInPolygon(wx, wy, t.points)) {
                    let minDist = Infinity,
                        closestZ = 0;
                    for (const p of t.points) {
                        const dx = p.x - wx,
                            dy = p.y - wy;
                        const dist = dx * dx + dy * dy;
                        if (dist < minDist) { minDist = dist;
                            closestZ = p.z; }
                    }
                    return closestZ;
                }
            }
            return 0;
        }

        function pointInPolygon(px, py, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x,
                    yi = polygon[i].y;
                const xj = polygon[j].x,
                    yj = polygon[j].y;
                if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
            }
            return inside;
        }

        function wx2sx(wx) { return (wx - viewX) * zoom; }

        function wy2sy(wy) { return (wy - viewY) * zoom; }

        function clampView() {
            const vw = WORLD_W / zoom,
                vh = WORLD_H / zoom;
            viewX = Math.max(0, Math.min(WORLD_W - vw, viewX));
            viewY = Math.max(0, Math.min(WORLD_H - vh, viewY));
        }

        function updateViewFollow() {
            if (!followRobinson) return;
            const vw = WORLD_W / zoom,
                vh = WORLD_H / zoom;
            viewX = robinsonLocal.x - vw / 2;
            viewY = robinsonLocal.y - vh / 2;
            clampView();
        }

        function updateViewEdgeScroll() {
            const canvas = document.getElementById('mapCanvas');
            if (!canvas) return;
            const cw = canvas.width;
            const ch = canvas.height;
            const sx = (robinsonLocal.x - viewX) * zoom;
            const sy = (robinsonLocal.y - viewY) * zoom;
            const MARGIN = 120;
            const SPEED = 6;
            let dx = 0,
                dy = 0;
            if (sx > cw - MARGIN) dx = SPEED / zoom;
            if (sx < MARGIN) dx = -SPEED / zoom;
            if (sy > ch - MARGIN) dy = SPEED / zoom;
            if (sy < MARGIN) dy = -SPEED / zoom;
            if (dx !== 0 || dy !== 0) {
                viewX += dx;
                viewY += dy;
                clampView();
                drawMap();
                updateBubblePositions();
            }
        }

        function syncRobinsonFromState() {
            if (controlMode) return;
            const f = currentState.features || {};
            robinsonLocal.x = f.x ?? ROBINSON_INIT.x;
            robinsonLocal.y = f.y ?? ROBINSON_INIT.y;
            robinsonLocal.z = f.z ?? ROBINSON_INIT.z;
            if (f.health !== undefined) robinsonStats.health = f.health;
            if (f.energy !== undefined) robinsonStats.energy = f.energy;
            if (f.mood !== undefined) robinsonStats.mood = f.mood;
            if (f.hunger !== undefined) robinsonStats.hunger = f.hunger;
            updateStatusPanel();
        }

        function moveRobinsonTo(wx, wy) {
            wx = Math.max(5, Math.min(WORLD_W - 5, wx));
            wy = Math.max(5, Math.min(WORLD_H - 5, wy));
            const terrainZ = getTerrainZ(wx, wy);
            robinsonLocal.x = wx;
            robinsonLocal.y = wy;
            robinsonLocal.z = terrainZ;
            const now = Date.now();
            if (now - lastControlSend > 80) {
                lastControlSend = now;
                API.moveRobinson(Math.round(robinsonLocal.x), Math.round(robinsonLocal.y), Math.round(robinsonLocal
                    .z))
                    .then(s => { if (s) renderState(s); }).catch(() => {});
            }
            if (clickControlActive || controlMode) {
                updateViewEdgeScroll();
            } else {
                updateViewFollow();
            }
            drawMap();
            updateBubblePositions();
        }

        // ---- 绘制 ----
        function drawMap() {
            const canvas = document.getElementById('mapCanvas');
            const container = document.getElementById('mapContainer');
            if (!canvas || !container) return;
            const ctx = canvas.getContext('2d');
            const cw = canvas.width = container.clientWidth;
            const ch = canvas.height = container.clientHeight;

            ctx.fillStyle = '#1a1412';
            ctx.fillRect(0, 0, cw, ch);

            TERRAINS.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.globalAlpha = 0.35;
                ctx.beginPath();
                t.points.forEach((p, i) => {
                    const sx = wx2sx(p.x),
                        sy = wy2sy(p.y);
                    if (i === 0) ctx.moveTo(sx, sy);
                    else ctx.lineTo(sx, sy);
                });
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1;

                const avgZ = t.points.reduce((sum, p) => sum + (p.z || 0), 0) / t.points.length;
                ctx.strokeStyle = avgZ < 0 ? 'rgba(52,152,219,0.4)' : 'rgba(246,176,124,0.25)';
                ctx.lineWidth = avgZ < 0 ? 2 : 1;
                ctx.setLineDash(avgZ < 0 ? [4, 3] : []);
                ctx.stroke();
                ctx.setLineDash([]);

                const cx = t.points.reduce((s, p) => s + p.x, 0) / t.points.length;
                const cy = t.points.reduce((s, p) => s + p.y, 0) / t.points.length;
                const lsx = wx2sx(cx),
                    lsy = wy2sy(cy);
                if (lsx > -100 && lsx < cw + 100 && lsy > -100 && lsy < ch + 100) {
                    const fs = Math.max(14, Math.min(19, zoom * 8));
                    ctx.font = `500 ${fs}px "Inter","Segoe UI",monospace`;
                    const label = t.name + ' z:' + Math.round(avgZ);
                    const lw = ctx.measureText(label).width;
                    ctx.fillStyle = 'rgba(14,11,10,0.7)';
                    ctx.fillRect(lsx - lw / 2 - 8, lsy - fs - 4, lw + 16, fs + 8);
                    ctx.fillStyle = '#d4c4b8';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(label, lsx, lsy - fs / 2);
                }
            });

            ITEMS.forEach(item => {
                const sx = wx2sx(item.x),
                    sy = wy2sy(item.y);
                if (sx < -30 || sx > cw + 30 || sy < -30 || sy > ch + 30) return;
                const isz = Math.max(16, Math.min(26, zoom * 14));
                ctx.font = `${isz}px "Segoe UI",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.icon, sx, sy);
            });

            // 鲁滨逊
            const rsx = wx2sx(robinsonLocal.x),
                rsy = wy2sy(robinsonLocal.y);
            const rSize = Math.max(10, zoom * 6.5);
            ctx.fillStyle = '#E57324';
            ctx.beginPath();
            ctx.arc(rsx, rsy, rSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.font = `bold ${rSize * 1.5}px "Segoe UI",monospace`;
            ctx.fillStyle = '#2D2E1C';
            ctx.textAlign = 'center';
            ctx.fillText(SEGO_CONFIG.characters.robinson.icon || '🧒', rsx, rsy - rSize * 2.2);

            ctx.font = `500 ${Math.max(14, rSize * 0.9)}px "Inter","Segoe UI",monospace`;
            ctx.fillStyle = 'rgba(228,215,207,0.9)';
            ctx.textAlign = 'center';
            ctx.fillText('鲁滨逊', rsx, rsy - rSize * 4.2);

            // 父亲
            let fx = currentState.father_x ?? FATHER_INIT.x;
            let fy = currentState.father_y ?? FATHER_INIT.y;
            if (currentState.father_status === 'home') {
                const fsx = wx2sx(fx),
                    fsy = wy2sy(fy),
                    fSize = rSize * 0.8;
                ctx.fillStyle = '#C28A5C';
                ctx.beginPath();
                ctx.arc(fsx, fsy, fSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#2C221A';
                ctx.textAlign = 'center';
                ctx.fillText(SEGO_CONFIG.characters.father.icon || '👨‍🦱', fsx, fsy - fSize * 2.2);

                ctx.font = `500 ${Math.max(13, fSize * 0.9)}px "Inter","Segoe UI",monospace`;
                ctx.fillStyle = 'rgba(228,215,207,0.8)';
                ctx.textAlign = 'center';
                ctx.fillText('父亲', fsx, fsy - fSize * 4.0);
            }

            drawMinimap();
            updateBubblePositions();
        }

        function drawMinimap() {
            const mm = document.getElementById('minimapCanvas');
            if (!mm) return;
            const ctx = mm.getContext('2d');
            const mw = 180,
                mh = 150;
            mm.width = mw;
            mm.height = mh;
            ctx.fillStyle = 'rgba(14,11,10,0.9)';
            ctx.fillRect(0, 0, mw, mh);
            TERRAINS.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                t.points.forEach((p, i) => {
                    const sx = p.x / WORLD_W * mw;
                    const sy = p.y / WORLD_H * mh;
                    if (i === 0) ctx.moveTo(sx, sy);
                    else ctx.lineTo(sx, sy);
                });
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1;
            });
            const rsx = robinsonLocal.x / WORLD_W * mw;
            const rsy = robinsonLocal.y / WORLD_H * mh;
            ctx.fillStyle = '#E57324';
            ctx.beginPath();
            ctx.arc(rsx, rsy, 6, 0, Math.PI * 2);
            ctx.fill();
            const vw = WORLD_W / zoom,
                vh = WORLD_H / zoom;
            ctx.strokeStyle = 'rgba(246,176,124,0.4)';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(viewX / WORLD_W * mw, viewY / WORLD_H * mh, vw / WORLD_W * mw, vh / WORLD_H * mh);
            if (currentState.father_status === 'home') {
                let fx = currentState.father_x ?? FATHER_INIT.x;
                let fy = currentState.father_y ?? FATHER_INIT.y;
                ctx.fillStyle = '#C28A5C';
                ctx.beginPath();
                ctx.arc(fx / WORLD_W * mw, fy / WORLD_H * mh, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ============================================================
        // 鼠标交互
        // ============================================================
        function setupMouse() {
            const container = document.getElementById('mapContainer');
            const canvas = document.getElementById('mapCanvas');
            if (!container || !canvas) return;

            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                if (controlMode) return;
                followRobinson = false;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const wx = mx / zoom + viewX;
                const wy = my / zoom + viewY;
                const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
                viewX = wx - (mx / newZoom);
                viewY = wy - (my / newZoom);
                zoom = newZoom;
                clampView();
                drawMap();
                updateBubblePositions();
            });

            canvas.addEventListener('mousedown', e => {
                if (e.button === 0) {
                    if (coordPickMode || clickControlActive) return;
                    isDragging = true;
                    followRobinson = false;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    dragViewX = viewX;
                    dragViewY = viewY;
                }
            });

            window.addEventListener('mousemove', e => {
                if (isDragging && !controlMode && !coordPickMode && !clickControlActive) {
                    const dx = (e.clientX - dragStartX) / zoom;
                    const dy = (e.clientY - dragStartY) / zoom;
                    viewX = dragViewX - dx;
                    viewY = dragViewY - dy;
                    clampView();
                    drawMap();
                    updateBubblePositions();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) { isDragging = false;
                    drawMap();
                    updateBubblePositions(); }
            });

            canvas.addEventListener('dblclick', () => {
                if (!controlMode && !coordPickMode && !clickControlActive) {
                    followRobinson = true;
                    updateViewFollow();
                    drawMap();
                    updateBubblePositions();
                }
            });

            canvas.addEventListener('touchstart', e => {
                if (coordPickMode || clickControlActive) return;
                if (e.touches.length === 1 && !clickControlActive) {
                    isDragging = true;
                    followRobinson = false;
                    dragStartX = e.touches[0].clientX;
                    dragStartY = e.touches[0].clientY;
                    dragViewX = viewX;
                    dragViewY = viewY;
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (coordPickMode || clickControlActive) return;
                if (e.touches.length === 1 && isDragging && !clickControlActive) {
                    const dx = (e.touches[0].clientX - dragStartX) / zoom;
                    const dy = (e.touches[0].clientY - dragStartY) / zoom;
                    viewX = dragViewX - dx;
                    viewY = dragViewY - dy;
                    clampView();
                    drawMap();
                    updateBubblePositions();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => { isDragging = false; });

            setupMapClick();
        }

        function setupMapClick() {
            const canvas = document.getElementById('mapCanvas');
            const container = document.getElementById('mapContainer');
            if (!canvas) return;

            canvas.addEventListener('click', function(e) {
                if (coordPickMode) {
                    e.stopPropagation();
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;
                    const wx = Math.round(mx / zoom + viewX);
                    const wy = Math.round(my / zoom + viewY);
                    const clampedX = Math.max(0, Math.min(WORLD_W, wx));
                    const clampedY = Math.max(0, Math.min(WORLD_H, wy));
                    selectedCoord = { x: clampedX, y: clampedY };
                    const display = document.getElementById('oracleCoord');
                    if (display) {
                        display.textContent = `📍 (${clampedX}, ${clampedY})`;
                        display.style.borderColor = 'var(--primary)';
                    }
                    coordPickMode = false;
                    container.classList.remove('pick-coord');
                    document.getElementById('oraclePickHint').classList.remove('active');
                    addLogEntry('坐标', `选择坐标 (${clampedX}, ${clampedY})`);
                    return;
                }

                if (clickControlActive) {
                    e.stopPropagation();
                    const rect = canvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;
                    const wx = mx / zoom + viewX;
                    const wy = my / zoom + viewY;
                    const clampedX = Math.max(5, Math.min(WORLD_W - 5, wx));
                    const clampedY = Math.max(5, Math.min(WORLD_H - 5, wy));
                    clickTargetX = clampedX;
                    clickTargetY = clampedY;
                    isClickControlling = true;
                    addLogEntry('操控', `${clickControlTarget} 前往 (${Math.round(clampedX)}, ${Math.round(clampedY)})`);
                    executeClickControlMove();
                    return;
                }
            });
        }

        function executeClickControlMove() {
            if (!isClickControlling || !clickControlActive) return;
            const target = clickControlTarget;
            const tx = clickTargetX,
                ty = clickTargetY;
            let currentX, currentY;
            if (target === '鲁滨逊') { currentX = robinsonLocal.x;
                currentY = robinsonLocal.y; } else { currentX = fatherLocal.x;
                currentY = fatherLocal.y; }
            const dist = Math.sqrt((tx - currentX) ** 2 + (ty - currentY) ** 2);
            if (dist < 2) {
                isClickControlling = false;
                if (clickControlInterval) { clearInterval(clickControlInterval);
                    clickControlInterval = null; }
                document.getElementById('controlStatus').textContent = '✅ 已到达目标';
                document.getElementById('controlStatus').style.color = 'var(--success-color)';
                return;
            }
            const speed = Math.min(8, Math.max(2, dist * 0.12));
            const dx = (tx - currentX) / dist * speed;
            const dy = (ty - currentY) / dist * speed;
            if (target === '鲁滨逊') {
                moveRobinsonTo(currentX + dx, currentY + dy);
            } else {
                fatherLocal.x += dx;
                fatherLocal.y += dy;
                fatherLocal.z = getTerrainZ(fatherLocal.x, fatherLocal.y);
                currentState.father_x = fatherLocal.x;
                currentState.father_y = fatherLocal.y;
                drawMap();
            }
        }

        function startClickControl() {
            const target = document.getElementById('controlTarget').value;
            clickControlTarget = target;
            clickControlActive = true;
            isClickControlling = false;
            document.getElementById('btnStartControl').style.display = 'none';
            document.getElementById('btnStopControl').style.display = 'inline-block';
            document.getElementById('controlStatus').textContent = `🟢 操控中: ${target} · 点击地图移动`;
            document.getElementById('controlStatus').style.color = 'var(--primary-light)';
            document.getElementById('mapContainer').style.cursor = 'pointer';
            addLogEntry('操控', `开始操控 ${target}，点击地图移动`);
            if (clickControlInterval) clearInterval(clickControlInterval);
            clickControlInterval = setInterval(() => {
                if (clickControlActive && isClickControlling) { executeClickControlMove(); }
            }, 50);
        }

        function stopClickControl() {
            clickControlActive = false;
            isClickControlling = false;
            if (clickControlInterval) { clearInterval(clickControlInterval);
                clickControlInterval = null; }
            document.getElementById('btnStartControl').style.display = 'inline-block';
            document.getElementById('btnStopControl').style.display = 'none';
            document.getElementById('controlStatus').textContent = '⚪ 已停止';
            document.getElementById('controlStatus').style.color = 'var(--text-tertiary)';
            document.getElementById('mapContainer').style.cursor = '';
            addLogEntry('操控', '停止操控');
        }

        function initWebSocket() {
            try {
                socket = io(BASE_URL, {
                    transports: ['websocket', 'polling'],
                    reconnection: true,
                    reconnectionAttempts: 3,
                    timeout: 5000
                });

                socket.on('connect', () => {
                    useWebSocket = true;
                    addLogEntry('Socket', '✅ 已连接服务器');
                });

                socket.on('connect_error', () => {
                    useWebSocket = false;
                    addLogEntry('Socket', '❌ 连接失败，使用轮询模式');
                });

                socket.on('disconnect', () => {
                    useWebSocket = false;
                    addLogEntry('Socket', '⚠️ 连接断开');
                });

                // ============================================================
                // 🔌 后端接口：环境更新
                // 后端推送格式: { timeOfDay, weather, intensity }
                // ============================================================
                socket.on('environment_update', (data) => {
                    if (data) {
                        setEnvironment({
                            timeOfDay: data.timeOfDay,
                            weather: data.weather,
                            intensity: data.intensity
                        });
                        addLogEntry('环境(后端)', `${WEATHER_ICONS[data.weather] || '☀️'} ${data.weather || 'clear'} · ${data.timeOfDay || 'day'} · 强度 ${Math.round((data.intensity || 0) * 100)}%`);
                    }
                });

                // 兼容旧字段名
                socket.on('weather_update', (data) => {
                    if (data) {
                        setEnvironment({
                            timeOfDay: data.timeOfDay || 'day',
                            weather: data.weather || 'clear',
                            intensity: data.intensity || 0
                        });
                        addLogEntry('天气(后端)', `${WEATHER_ICONS[data.weather] || '☀️'} ${data.weather || 'clear'}`);
                    }
                });

                socket.on('state_update', (data) => {
                    if (data && data.data) {
                        renderState(data.data);
                        if (!controlMode) syncRobinsonFromState();
                        updateViewFollow();
                        drawMap();
                    }
                });

            } catch (e) {
                useWebSocket = false;
                addLogEntry('Socket', '⚠️ WebSocket 初始化失败');
            }
        }

        // ---- UI ----
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('mapTitle').textContent = FIELD_CONFIG.field.name;
            document.title = 'SurvX · ' + FIELD_CONFIG.field.name;

            const characterKeys = Object.keys(SEGO_CONFIG.characters);
            ['communicateTarget', 'teachTarget', 'improveTarget', 'controlTarget'].forEach(selectorId => {
                const select = document.getElementById(selectorId);
                if (!select) return;
                select.innerHTML = '';
                characterKeys.forEach(key => {
                    const char = SEGO_CONFIG.characters[key];
                    const option = document.createElement('option');
                    option.value = char.name;
                    option.textContent = `${char.icon || '👤'} ${char.name}`;
                    select.appendChild(option);
                });
            });

            // ---- 模式弹窗 ----
            const modeModal = document.getElementById('modeModal');
            document.getElementById('btnMode').addEventListener('click', (e) => {
                e.stopPropagation();
                modeModal.classList.add('show');
            });
            document.getElementById('modeCancel').addEventListener('click', () => { modeModal.classList.remove(
                'show'); });
            document.getElementById('modeConfirm').addEventListener('click', () => {
                const mode = document.getElementById('modeSelect').value;
                const speed = mode === 'train' ?
                    document.getElementById('speedSelect').value :
                    document.getElementById('hybridSpeedSelect').value;
                addLogEntry('模式', `${mode === 'train' ? '训练' : '混合场域'} · ${speed}x`);
                modeModal.classList.remove('show');
            });
            document.getElementById('modeSelect').addEventListener('change', () => {
                const isTrain = document.getElementById('modeSelect').value === 'train';
                document.getElementById('speedGroup').style.display = isTrain ? 'flex' : 'none';
                document.getElementById('hybridSpeedGroup').style.display = isTrain ? 'none' : 'flex';
            });
            document.getElementById('speedGroup').style.display = 'none';
            document.getElementById('hybridSpeedGroup').style.display = 'flex';

            // ---- 功能面板 ----
            const funcModal = document.getElementById('funcModal');
            document.getElementById('btnPanel').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('logPanel').classList.remove('show');
                funcModal.classList.toggle('show');
                selectedCoord = null;
                coordPickMode = false;
                document.getElementById('mapContainer').classList.remove('pick-coord');
                document.getElementById('oraclePickHint').classList.remove('active');
                const oracleDisplay = document.getElementById('oracleCoord');
                if (oracleDisplay) {
                    oracleDisplay.textContent = '未选择';
                    oracleDisplay.style.borderColor = 'rgba(246,176,124,0.2)';
                }
            });

            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = {
                oracle: document.getElementById('tab-oracle'),
                communicate: document.getElementById('tab-communicate'),
                teach: document.getElementById('tab-teach'),
                improve: document.getElementById('tab-improve'),
                control: document.getElementById('tab-control')
            };
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const tab = btn.dataset.tab;
                    Object.keys(tabContents).forEach(key => {
                        tabContents[key].style.display = key === tab ? 'block' : 'none';
                    });
                    if (tab === 'oracle') {
                        coordPickMode = false;
                        document.getElementById('mapContainer').classList.remove('pick-coord');
                        document.getElementById('oraclePickHint').classList.remove('active');
                    }
                });
            });

            document.getElementById('oraclePickHint').addEventListener('click', (e) => {
                e.stopPropagation();
                if (clickControlActive) stopClickControl();
                coordPickMode = !coordPickMode;
                if (coordPickMode) {
                    document.getElementById('mapContainer').classList.add('pick-coord');
                    document.getElementById('oraclePickHint').classList.add('active');
                    addLogEntry('坐标', '点击地图选择坐标...');
                } else {
                    document.getElementById('mapContainer').classList.remove('pick-coord');
                    document.getElementById('oraclePickHint').classList.remove('active');
                }
            });

            document.getElementById('btnStartControl').addEventListener('click', () => {
                if (coordPickMode) {
                    coordPickMode = false;
                    document.getElementById('mapContainer').classList.remove('pick-coord');
                    document.getElementById('oraclePickHint').classList.remove('active');
                }
                startClickControl();
            });
            document.getElementById('btnStopControl').addEventListener('click', stopClickControl);
            document.getElementById('controlTarget').addEventListener('change', () => {
                if (clickControlActive) {
                    clickControlTarget = document.getElementById('controlTarget').value;
                    document.getElementById('controlStatus').textContent =
                        `🟢 操控中: ${clickControlTarget} · 点击地图移动`;
                }
            });

            document.getElementById('funcCancel').addEventListener('click', () => {
                if (clickControlActive) stopClickControl();
                funcModal.classList.remove('show');
                coordPickMode = false;
                document.getElementById('mapContainer').classList.remove('pick-coord');
                document.getElementById('oraclePickHint').classList.remove('active');
            });
            document.getElementById('funcConfirm').addEventListener('click', () => {
                const activeTab = document.querySelector('.tab-btn.active');
                const tab = activeTab ? activeTab.dataset.tab : 'oracle';
                if (tab !== 'control') {
                    const coord = selectedCoord ? `(${selectedCoord.x}, ${selectedCoord.y})` : '未选择';
                    const text = document.getElementById('oracleInput').value.trim() || '(空)';
                    addLogEntry('功能', `神谕 · 坐标 ${coord} · 内容: ${text}`);
                    document.getElementById('oracleInput').value = '';
                    document.getElementById('communicateInput').value = '';
                    selectedCoord = null;
                    const oracleDisplay = document.getElementById('oracleCoord');
                    if (oracleDisplay) {
                        oracleDisplay.textContent = '未选择';
                        oracleDisplay.style.borderColor = 'rgba(246,176,124,0.2)';
                    }
                    coordPickMode = false;
                    document.getElementById('mapContainer').classList.remove('pick-coord');
                    document.getElementById('oraclePickHint').classList.remove('active');
                    funcModal.classList.remove('show');
                } else {
                    funcModal.classList.remove('show');
                    coordPickMode = false;
                    document.getElementById('mapContainer').classList.remove('pick-coord');
                    document.getElementById('oraclePickHint').classList.remove('active');
                }
            });

            // ---- 日志面板 ----
            document.getElementById('btnLog').addEventListener('click', (e) => {
                e.stopPropagation();
                funcModal.classList.remove('show');
                document.getElementById('logPanel').classList.toggle('show');
                renderLogPanel();
            });
            document.getElementById('closeLog').addEventListener('click', () => {
                document.getElementById('logPanel').classList.remove('show');
            });

            // ---- 状态面板 ----
            const statusPanel = document.getElementById('statusPanel');
            const btnStatus = document.getElementById('btnStatus');
            let statusVisible = false;

            btnStatus.addEventListener('click', (e) => {
                e.stopPropagation();
                statusVisible = !statusVisible;
                if (statusVisible) {
                    statusPanel.classList.add('show');
                    btnStatus.classList.add('active-btn');
                    updateStatusPanel();
                } else {
                    statusPanel.classList.remove('show');
                    btnStatus.classList.remove('active-btn');
                }
            });

            addLogEntry('系统', FIELD_CONFIG.field.name + ' · 心智场域已启动');
            addLogEntry('系统', '💬 说话优先 · 💭 想法会被说话覆盖');
            addLogEntry('系统', '📊 点击右下角状态按钮查看人物状态');
            addLogEntry('系统', '🌤️ 天气模拟将在3秒后自动开始 (模拟后端推送)');
        });

        // ---- 初始化 ----
        async function init() {
            updateViewFollow();
            drawMap();
            initWebSocket();
            setupMouse();
            refreshState();
            updateStatusPanel();

            // 重置天气
            resetWeather();

            setTimeout(() => {
                simulateThought();
                simulateSpeech();
            }, 3000);

            // 启动天气模拟 (模拟后端推送)
            setTimeout(() => {
                startWeatherSimulation();
            }, 3000);

            setInterval(async () => { if (!useWebSocket) { await refreshState(); } }, 5000);
            window.addEventListener('resize', () => { drawMap();
                updateBubblePositions(); });

            setInterval(() => {
                if (clickControlActive || controlMode) {
                    updateViewEdgeScroll();
                }
            }, 100);

            // 天气绘制循环 (独立于地图绘制，持续运行)
            function weatherLoop() {
                drawWeather();
                requestAnimationFrame(weatherLoop);
            }
            weatherLoop();

            // 气泡位置更新循环
            function bubbleLoop() {
                if (thoughtState.active || thoughtState.showing ||
                    speechState.active || speechState.showing) {
                    updateBubblePositions();
                }
                requestAnimationFrame(bubbleLoop);
            }
            bubbleLoop();

            // 额外：当拖拽/缩放时也要更新天气层（因为它与view同步）
            // 但 drawWeather 每次都会用最新的 viewX/viewY/zoom，所以不需要额外触发
        }

        init().catch(console.error);

        // ============================================================
        // 暴露 API 给后端 (通过 window)
        // ============================================================
        window.SurvX = {
            // 环境控制
            setEnvironment: setEnvironment,
            resetWeather: resetWeather,
            getEnvironment: () => ({ ...ENV }),
            // 天气模拟控制
            startWeatherSimulation: startWeatherSimulation,
            stopWeatherSimulation: stopWeatherSimulation,
            // 日志
            addLog: addLogEntry,
            // 状态
            getState: () => currentState,
        };

        console.log('🌤️ SurvX 环境系统已加载');
        console.log('📡 后端接口: socket.on("environment_update", data)');
        console.log('📡 数据格式: { timeOfDay, weather, intensity }');
        console.log('💡 可用值: timeOfDay=day|night|dawn|dusk, weather=clear|rain|snow|storm|fog');
        console.log('💡 前端模拟已启动，3秒后开始循环演示');
        console.log('🛠️ 手动控制: window.SurvX.setEnvironment({ timeOfDay:"night", weather:"rain", intensity:0.6 })');
    </script>
</body>
