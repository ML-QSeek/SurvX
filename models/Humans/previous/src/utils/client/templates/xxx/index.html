<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SurvX · 生存世界</title>
    <style>
        /* ===== 全局暖色调 ===== */
        :root {
            --primary: #f6b07c;
            --primary-dark: #d4845a;
            --primary-light: #f5cba0;
            --primary-transparent: rgba(246, 176, 124, 0.15);
            --bg-primary: #0e0b0a;
            --bg-secondary: #1a1412;
            --bg-tertiary: #221c19;
            --text-primary: #e4d7cf;
            --text-secondary: #d4c4b8;
            --text-tertiary: #a28c7c;
            --border-color: #3a2c24;
            --error-color: #f58b7a;
            --success-color: #eab676;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 18px;
            font-weight: 300;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(246, 176, 124, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(212, 132, 90, 0.04) 0%, transparent 45%);
            z-index: 0;
            pointer-events: none;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 6px;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .map-container {
            flex: 1;
            min-width: 420px;
            position: relative;
            background: #0a0807;
            overflow: hidden;
        }
        .map-container.controlling {
            cursor: none;
        }
        .map-container:not(.controlling) {
            cursor: grab;
        }
        .map-container:not(.controlling):active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .title-block {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 15;
            pointer-events: none;
            user-select: none;
        }
        .title-block h1 {
            font-size: 2.0rem;
            font-weight: 500;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f5cba0 0%, #f6b07c 40%, #d4845a 80%, #c07a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(246, 176, 124, 0.15);
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .title-block .instance-name {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* ===== 状态面板 ===== */
        .status-panel {
            position: absolute;
            top: 76px;
            left: 16px;
            z-index: 14;
            background: rgba(14, 11, 10, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(246, 176, 124, 0.15);
            border-radius: 10px;
            padding: 18px 24px 16px 24px;
            min-width: 220px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            display: none;
            pointer-events: none;
            user-select: none;
        }
        .status-panel.show {
            display: block;
        }
        .status-panel .panel-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--primary-light);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.08);
            padding-bottom: 8px;
        }
        .status-panel .stat-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .status-panel .stat-row .stat-label {
            min-width: 36px;
            color: var(--text-tertiary);
            font-size: 1.0rem;
            flex-shrink: 0;
        }
        .status-panel .stat-row .stat-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            min-width: 80px;
        }
        .status-panel .stat-row .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .status-panel .stat-row .stat-value {
            min-width: 36px;
            text-align: right;
            font-size: 0.95rem;
            color: var(--text-tertiary);
        }
        .fill-health {
            background: linear-gradient(90deg, #f58b7a, #f6b07c);
        }
        .fill-energy {
            background: linear-gradient(90deg, #eab676, #f5cba0);
        }
        .fill-mood {
            background: linear-gradient(90deg, #7ec8c8, #a8e0e0);
        }
        .fill-hunger {
            background: linear-gradient(90deg, #eab676, #f6b07c);
        }

        /* ===== 右下角图标 ===== */
        .right-actions {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 14px;
            pointer-events: none;
        }
        .right-actions .action-btn {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 1px solid rgba(246, 176, 124, 0.25);
            background: rgba(14, 11, 10, 0.7);
            backdrop-filter: blur(8px);
            color: var(--text-secondary);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            user-select: none;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .right-actions .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
            box-shadow: 0 0 20px rgba(246, 176, 124, 0.08);
            transform: scale(1.05);
        }
        .right-actions .action-btn .icon {
            font-size: 22px;
            line-height: 1;
        }
        .right-actions .action-btn .label {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .right-actions .action-btn.active-btn {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
        }

        .minimap {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 180px;
            height: 150px;
            border: 1px solid rgba(246, 176, 124, 0.3);
            border-radius: 6px;
            background: rgba(14, 11, 10, 0.8);
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }

        .control-cursor {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            font-size: 36px;
            transform: translate(-50%, -50%);
            display: none;
            text-shadow: 0 0 20px rgba(255, 152, 0, 0.6);
        }
        .control-cursor.show {
            display: block;
        }

        /* ===== 弹窗 ===== */
        .float-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border: 1px solid rgba(246, 176, 124, 0.25);
            border-radius: 12px;
            padding: 32px 36px 28px 36px;
            min-width: 420px;
            max-width: 600px;
            width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(246, 176, 124, 0.05);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            pointer-events: auto;
            animation: modalFadeIn 0.2s ease;
        }
        .float-modal.show {
            display: block;
        }
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .float-modal .modal-title {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--primary-light);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.1);
            padding-bottom: 14px;
            text-align: center;
        }
        .float-modal .modal-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 22px;
        }
        .float-modal .modal-body .option-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .float-modal .modal-body .option-group label {
            min-width: 80px;
            color: var(--text-tertiary);
            font-size: 1.0rem;
            flex-shrink: 0;
        }
        .float-modal .modal-body .option-group select,
        .float-modal .modal-body .option-group input,
        .float-modal .modal-body .option-group textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(246, 176, 124, 0.2);
            border-radius: 4px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 1.0rem;
            outline: none;
            font-family: inherit;
            flex: 1;
            min-width: 100px;
        }
        .float-modal .modal-body .option-group textarea {
            resize: vertical;
            min-height: 60px;
            line-height: 1.4;
        }
        .float-modal .modal-body .option-group select:focus,
        .float-modal .modal-body .option-group input:focus,
        .float-modal .modal-body .option-group textarea:focus {
            border-color: var(--primary);
        }
        .float-modal .modal-body .option-group select option {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .float-modal .modal-body .option-group .coord-display {
            font-size: 0.95rem;
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
            padding: 4px 14px;
            border-radius: 4px;
            border: 1px dashed rgba(246, 176, 124, 0.2);
            min-width: 100px;
            text-align: center;
        }
        .float-modal .modal-body .option-group .hint-text {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            font-style: italic;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 10px;
            border-radius: 3px;
            user-select: none;
        }
        .float-modal .modal-body .option-group .hint-text:hover {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
        }
        .float-modal .modal-body .option-group .hint-text.active {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
        }
        .float-modal .modal-body .instance-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .float-modal .modal-body .instance-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid rgba(246, 176, 124, 0.08);
            border-radius: 6px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }
        .float-modal .modal-body .instance-item:hover {
            border-color: rgba(246, 176, 124, 0.2);
        }
        .float-modal .modal-body .instance-item .inst-name {
            color: var(--text-primary);
            font-weight: 400;
        }
        .float-modal .modal-body .instance-item .inst-status {
            font-size: 0.8rem;
            padding: 2px 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-tertiary);
        }
        .float-modal .modal-body .instance-item .inst-status.running {
            color: #7cdf7c;
            background: rgba(124, 223, 124, 0.12);
        }
        .float-modal .modal-body .instance-item .inst-status.created {
            color: #f5cba0;
            background: rgba(245, 203, 160, 0.08);
        }
        .float-modal .modal-body .instance-item .inst-status.stopped {
            color: #f58b7a;
            background: rgba(245, 139, 122, 0.08);
        }
        .float-modal .modal-body .instance-item .inst-actions {
            display: flex;
            gap: 6px;
        }
        .float-modal .modal-body .instance-item .inst-actions button {
            background: transparent;
            border: 1px solid rgba(246, 176, 124, 0.15);
            color: var(--text-tertiary);
            padding: 2px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .float-modal .modal-body .instance-item .inst-actions button:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: var(--primary-transparent);
        }
        .float-modal .modal-body .instance-item .inst-actions button.btn-connect {
            border-color: var(--primary);
            color: var(--primary-light);
        }
        .float-modal .modal-body .instance-item .inst-actions button.btn-connect:hover {
            background: rgba(246, 176, 124, 0.15);
        }

        .float-modal .modal-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            border-top: 1px solid rgba(246, 176, 124, 0.08);
            padding-top: 18px;
        }
        .float-modal .modal-actions button {
            background: transparent;
            border: 1px solid rgba(246, 176, 124, 0.25);
            color: var(--text-secondary);
            padding: 8px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.0rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .float-modal .modal-actions button:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: var(--primary-transparent);
        }
        .float-modal .modal-actions .btn-confirm {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
        }
        .float-modal .modal-actions .btn-confirm:hover {
            background: rgba(246, 176, 124, 0.15);
        }

        .func-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.08);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }
        .func-tabs .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            padding: 8px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .func-tabs .tab-btn:hover {
            color: var(--text-secondary);
            background: rgba(246, 176, 124, 0.05);
        }
        .func-tabs .tab-btn.active {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.1);
        }
        .func-panel-content {
            min-height: 140px;
        }
        .func-panel-content .option-group {
            margin: 12px 0;
        }

        /* ===== 日志面板 ===== */
        .log-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 33.33%;
            height: 280px;
            background: rgba(10, 8, 7, 0.55);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(246, 176, 124, 0.08);
            border-right: 1px solid rgba(246, 176, 124, 0.08);
            z-index: 15;
            display: none;
            flex-direction: column;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            pointer-events: auto;
            padding: 12px 18px 14px 18px;
        }
        .log-panel.show {
            display: flex;
        }
        .log-panel .log-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .log-panel .log-header .close-log {
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 24px;
            line-height: 1;
            transition: 0.2s;
            padding: 0 4px;
        }
        .log-panel .log-header .close-log:hover {
            color: var(--primary-light);
        }
        .log-panel .log-body {
            flex: 1;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.9;
            color: var(--text-secondary);
            padding-right: 4px;
        }
        .log-panel .log-body .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(246, 176, 124, 0.03);
            display: flex;
            gap: 14px;
            align-items: baseline;
        }
        .log-panel .log-body .log-entry .log-time {
            color: var(--primary-light);
            font-weight: 400;
            flex-shrink: 0;
            font-size: 0.85rem;
            min-width: 56px;
            opacity: 0.8;
        }
        .log-panel .log-body .log-entry .log-msg {
            color: var(--text-secondary);
            word-break: break-word;
            font-weight: 300;
            opacity: 0.9;
        }

        .map-container.pick-coord {
            cursor: crosshair !important;
        }
        .map-container.pick-coord canvas {
            cursor: crosshair !important;
        }

        /* ===== 气泡 ===== */
        .bubble-container {
            position: absolute;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.35s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bubble-container.show {
            opacity: 1;
        }
        .bubble-container.fading {
            opacity: 0;
        }

        .bubble-body {
            padding: 16px 24px;
            border-radius: 22px;
            min-width: 100px;
            max-width: 360px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 400;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
            scrollbar-width: thin;
            word-break: break-word;
            position: relative;
            z-index: 2;
            border-width: 2px;
            border-style: solid;
        }
        .bubble-body::-webkit-scrollbar {
            width: 3px;
        }
        .bubble-body::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }

        .bubble-thought .bubble-body {
            background: #fdf6ee;
            border-color: #3d2b1f;
            color: #2d1f14;
        }
        .bubble-speech .bubble-body {
            background: #e8f4f8;
            border-color: #4a7c8c;
            color: #1a3a44;
        }

        #weatherCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: block;
        }

        .weather-indicator {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            background: rgba(14, 11, 10, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(246, 176, 124, 0.12);
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            pointer-events: none;
            user-select: none;
            letter-spacing: 0.5px;
            font-weight: 400;
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        .weather-indicator.show {
            opacity: 0.7;
        }
        .weather-indicator .env-icon {
            margin-right: 6px;
        }

        .status-badge {
            position: absolute;
            top: 76px;
            right: 16px;
            z-index: 14;
            background: rgba(14, 11, 10, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(246, 176, 124, 0.1);
            border-radius: 16px;
            padding: 4px 14px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            pointer-events: none;
            user-select: none;
            display: none;
        }
        .status-badge.show {
            display: block;
        }
        .status-badge .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-badge .dot.running {
            background: #7cdf7c;
        }
        .status-badge .dot.created {
            background: #f5cba0;
        }
        .status-badge .dot.stopped {
            background: #f58b7a;
        }

        @media (max-width: 800px) {
            .main {
                flex-direction: column;
            }
            .map-container {
                min-width: auto;
                height: 100vh;
            }
            .minimap {
                width: 140px;
                height: 110px;
                top: 8px;
                right: 8px;
            }
            .title-block h1 {
                font-size: 1.6rem;
            }
            .status-panel {
                top: 64px;
                left: 10px;
                padding: 14px 18px 14px 18px;
                min-width: 180px;
            }
            .status-panel .panel-name {
                font-size: 1.0rem;
            }
            .status-panel .stat-row .stat-label {
                font-size: 0.9rem;
                min-width: 30px;
            }
            .status-panel .stat-row .stat-value {
                font-size: 0.9rem;
                min-width: 30px;
            }
            .right-actions {
                bottom: 14px;
                right: 8px;
                gap: 10px;
            }
            .right-actions .action-btn {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }
            .right-actions .action-btn .label {
                font-size: 0.6rem;
            }
            .log-panel {
                width: 50%;
                height: 220px;
                padding: 8px 14px 10px 14px;
            }
            .log-panel .log-body {
                font-size: 0.85rem;
            }
            .float-modal {
                min-width: 300px;
                padding: 22px 24px;
                max-width: 95vw;
            }

    <script>
        // ============================================================
        // 🎯 纯 UI 模板 - 无任何硬编码数据
        // 所有数据通过 JSBridge 从后端接收
        // ============================================================

        // ============================================================
        // 全局状态 (运行时数据)
        // ============================================================

        const state = {
            // 配置 (从后端接收)
            config: null, // { field, terrains, items }
            sego: null, // { characters, defaultCharacter }

            // 运行时状态 (从后端接收)
            world: {
                timeOfDay: 'day',
                weather: 'clear',
                intensity: 0,
                items: new Map(),
                trees: new Map(),
                buildings: new Map(),
            },
            characters: new Map(),

            // 当前实例信息
            currentInstanceId: null,
            currentInstanceName: null,
            currentInstanceStatus: 'created',

            // UI 状态
            isConnected: false,
            mainCharacterId: 'robinson',
            mainCharacterStats: { health: 85, energy: 70, mood: 60, hunger: 50 },

            // 视角
            viewX: 0,
            viewY: 0,
            zoom: 1.8,
            followCharacter: true,

            // 交互
            isDragging: false,
            dragStartX: 0,
            dragStartY: 0,
            dragViewX: 0,
            dragViewY: 0,
            selectedCoord: null,
            coordPickMode: false,
            clickControlActive: false,
            clickControlTarget: 'robinson',
            isClickControlling: false,
            clickTargetX: 0,
            clickTargetY: 0,
            clickControlInterval: null,

            // 日志
            logEntries: [{ time: '系统', msg: '页面加载完成，等待连接...' }],
        };

        // ============================================================
        // 工具函数
        // ============================================================

        const WORLD_W = 1000; // 默认，会被 config 覆盖
        const WORLD_H = 800;

        function getWorldSize() {
            if (state.config && state.config.field) {
                return { w: state.config.field.width || 1000, h: state.config.field.height || 800 };
            }
            return { w: 1000, h: 800 };
        }

        function wx2sx(wx) {
            const { w, h } = getWorldSize();
            return (wx - state.viewX) * state.zoom;
        }

        function wy2sy(wy) {
            const { w, h } = getWorldSize();
            return (wy - state.viewY) * state.zoom;
        }

        function clampView() {
            const { w, h } = getWorldSize();
            const vw = w / state.zoom;
            const vh = h / state.zoom;
            state.viewX = Math.max(0, Math.min(w - vw, state.viewX));
            state.viewY = Math.max(0, Math.min(h - vh, state.viewY));
        }

        function updateViewFollow() {
            if (!state.followCharacter) return;
            const mainChar = state.characters.get(state.mainCharacterId);
            if (!mainChar) return;
            const { w, h } = getWorldSize();
            const vw = w / state.zoom;
            const vh = h / state.zoom;
            state.viewX = mainChar.x - vw / 2;
            state.viewY = mainChar.y - vh / 2;
            clampView();
        }

        function pointInPolygon(px, py, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x,
                    yi = polygon[i].y;
                const xj = polygon[j].x,
                    yj = polygon[j].y;
                if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
            }
            return inside;
        }

        function getTerrainZ(wx, wy) {
            const terrains = state.config ? state.config.terrains : [];
            for (const t of terrains) {
                if (pointInPolygon(wx, wy, t.points)) {
                    let minDist = Infinity,
                        closestZ = 0;
                    for (const p of t.points) {
                        const dx = p.x - wx,
                            dy = p.y - wy;
                        const dist = dx * dx + dy * dy;
                        if (dist < minDist) { minDist = dist;
                            closestZ = p.z; }
                    }
                    return closestZ;
                }
            }
            return 0;
        }

        // ============================================================
        // JSBridge - 与原生通信
        // ============================================================

        const Bridge = {
            available: typeof window.NativeBridge !== 'undefined',

            send(action, params) {
                if (!this.available) {
                    console.warn('[Bridge] 原生不可用:', action, params);
                    return;
                }
                try {
                    window.NativeBridge.handle(action, JSON.stringify(params || {}));
                } catch (e) {
                    console.error('[Bridge] 调用失败:', e);
                }
            },

            // 原生调用前端的方法
            receive(payload) {
                if (!payload || !payload.type) return;
                switch (payload.type) {
                    case 'full_state':
                        receiveFullState(payload.data);
                        break;
                    case 'world':
                        receiveWorldUpdate(payload.data);
                        break;
                    case 'character':
                        receiveCharacterUpdate(payload.data);
                        break;
                    case 'instance_list':
                        receiveInstanceList(payload.data);
                        break;
                    case 'instance_status':
                        receiveInstanceStatus(payload.data);
                        break;
                    default:
                        console.warn('[Bridge] 未知类型:', payload.type);
                }
            }
        };

        // ============================================================
        // 原生 → 前端 接口
        // ============================================================

        // 1. 接收全量状态 (初始化/连接实例)
        function receiveFullState(data) {
            if (!data) return;

            // 配置
            if (data.config) {
                state.config = data.config;
                document.getElementById('mapTitle').textContent = data.config.field?.name || '未知世界';
            }

            if (data.sego) {
                state.sego = data.sego;
                state.mainCharacterId = data.sego.defaultCharacter || 'robinson';
                // 填充人物下拉框
                populateCharacterSelects();
            }

            // 运行时状态
            if (data.state) {
                const s = data.state;
                state.world.timeOfDay = s.timeOfDay || 'day';
                state.world.weather = s.weather || 'clear';
                state.world.intensity = s.intensity || 0;

                // 物品
                state.world.items.clear();
                if (s.items) {
                    Object.keys(s.items).forEach(id => {
                        state.world.items.set(id, s.items[id]);
                    });
                }

                // 树木
                state.world.trees.clear();
                if (s.trees) {
                    Object.keys(s.trees).forEach(id => {
                        state.world.trees.set(id, s.trees[id]);
                    });
                }

                // 建筑
                state.world.buildings.clear();
                if (s.buildings) {
                    Object.keys(s.buildings).forEach(id => {
                        state.world.buildings.set(id, s.buildings[id]);
                    });
                }

                // 人物
                state.characters.clear();
                if (s.characters) {
                    Object.keys(s.characters).forEach(id => {
                        state.characters.set(id, s.characters[id]);
                    });
                }

                // 同步主控人物
                const mainChar = state.characters.get(state.mainCharacterId);
                if (mainChar) {
                    syncMainCharacter(mainChar);
                }
            }

            state.isConnected = true;
            updateViewFollow();
            updateWeatherIndicator();
            updateStatusBadge();
            updateStatusPanel();
            drawMap();
            addLogEntry('系统', `✅ 已连接实例: ${state.currentInstanceName || '未知'}`);
        }

        // 2. 接收世界增量更新
        function receiveWorldUpdate(data) {
            if (!data) return;

            if (data.timeOfDay !== undefined) state.world.timeOfDay = data.timeOfDay;
            if (data.weather !== undefined) state.world.weather = data.weather;
            if (data.intensity !== undefined) state.world.intensity = data.intensity;

            if (data.items) {
                Object.keys(data.items).forEach(id => {
                    if (data.items[id] === null || data.items[id]._delete === true) {
                        state.world.items.delete(id);
                    } else {
                        const existing = state.world.items.get(id) || {};
                        state.world.items.set(id, { ...existing, ...data.items[id] });
                    }
                });
            }

            if (data.trees) {
                Object.keys(data.trees).forEach(id => {
                    if (data.trees[id] === null || data.trees[id]._delete === true) {
                        state.world.trees.delete(id);
                    } else {
                        const existing = state.world.trees.get(id) || {};
                        state.world.trees.set(id, { ...existing, ...data.trees[id] });
                    }
                });
            }

            if (data.buildings) {
                Object.keys(data.buildings).forEach(id => {
                    if (data.buildings[id] === null || data.buildings[id]._delete === true) {
                        state.world.buildings.delete(id);
                    } else {
                        const existing = state.world.buildings.get(id) || {};
                        state.world.buildings.set(id, { ...existing, ...data.buildings[id] });
                    }
                });
            }

            // 人物更新 (世界更新里可能包含人物)
            if (data.characters) {
                Object.keys(data.characters).forEach(id => {
                    if (data.characters[id] === null || data.characters[id]._delete === true) {
                        state.characters.delete(id);
                    } else {
                        const existing = state.characters.get(id) || {};
                        state.characters.set(id, { ...existing, ...data.characters[id] });
                    }
                });
                const mainChar = state.characters.get(state.mainCharacterId);
                if (mainChar) syncMainCharacter(mainChar);
            }

            updateWeatherIndicator();
            updateStatusPanel();
            drawMap();
        }

        // 3. 接收人物增量更新
        function receiveCharacterUpdate(data) {
            if (!data || !data.id) return;

            if (data._delete === true) {
                state.characters.delete(data.id);
                if (data.id === state.mainCharacterId) {
                    // 如果删除了主控，找第一个可用人物
                    const first = state.characters.values().next();
                    if (!first.done) {
                        state.mainCharacterId = first.value.id;
                        syncMainCharacter(first.value);
                    }
                }
                drawMap();
                return;
            }

            const existing = state.characters.get(data.id) || {};
            state.characters.set(data.id, { ...existing, ...data });

            if (data.id === state.mainCharacterId) {
                syncMainCharacter(data);
            }

            // 气泡
            if (data.thought) showThought(data.thought);
            if (data.speech) showSpeech(data.speech);

            updateStatusPanel();
            drawMap();
        }

        // 4. 接收实例列表
        function receiveInstanceList(list) {
            if (!list || !Array.isArray(list)) return;
            renderInstanceList(list);
        }

        // 5. 接收实例状态变化
        function receiveInstanceStatus(data) {
            if (!data) return;
            state.currentInstanceStatus = data.status || 'created';
            updateStatusBadge();
            // 更新实例列表中的状态
            if (document.getElementById('instanceList')) {
                Bridge.send('getInstanceList');
            }
        }

        // ============================================================
        // 前端 → 原生 接口
        // ============================================================

        function requestInstanceList() {
            Bridge.send('getInstanceList');
        }

        function connectInstance(instanceId) {
            state.currentInstanceId = instanceId;
            Bridge.send('connectInstance', { instanceId });
        }

        function disconnectInstance() {
            state.currentInstanceId = null;
            state.isConnected = false;
            Bridge.send('disconnectInstance');
            // 清空状态
            state.characters.clear();
            state.world.items.clear();
            state.world.trees.clear();
            state.world.buildings.clear();
            drawMap();
            addLogEntry('系统', '已断开连接');
        }

        function createInstance(name, template) {
            Bridge.send('createInstance', { name, template });
        }

        function startInstance(instanceId) {
            Bridge.send('startInstance', { instanceId });
        }

        function stopInstance(instanceId) {
            Bridge.send('stopInstance', { instanceId });
        }

        function deleteInstance(instanceId) {
            Bridge.send('deleteInstance', { instanceId });
        }

        function moveCharacter(id, x, y) {
            Bridge.send('moveCharacter', { id, x, y });
        }

        function sendUserAction(action, params) {
            Bridge.send('userAction', { action, params });
        }

        // ============================================================
        // 同步主控人物
        // ============================================================

        function syncMainCharacter(data) {
            if (!data) return;
            if (data.x !== undefined) state.mainCharacterStats.x = data.x;
            if (data.y !== undefined) state.mainCharacterStats.y = data.y;
            if (data.z !== undefined) state.mainCharacterStats.z = data.z;
            if (data.health !== undefined) state.mainCharacterStats.health = data.health;
            if (data.energy !== undefined) state.mainCharacterStats.energy = data.energy;
            if (data.mood !== undefined) state.mainCharacterStats.mood = data.mood;
            if (data.hunger !== undefined) state.mainCharacterStats.hunger = data.hunger;
            updateViewFollow();
        }

        // ============================================================
        // 日志
        // ============================================================

        function addLogEntry(time, msg) {
            state.logEntries.push({ time, msg });
            if (state.logEntries.length > 100) state.logEntries.shift();
            renderLogPanel();
        }

        function renderLogPanel() {
            const body = document.getElementById('logBody');
            if (!body) return;
            body.innerHTML = state.logEntries.map(e =>
                `<div class="log-entry"><span class="log-time">[${e.time}]</span><span class="log-msg">${e.msg}</span></div>`
            ).join('');
            body.scrollTop = body.scrollHeight;
        }

        // ============================================================
        // 更新 UI
        // ============================================================

        function updateStatusPanel() {
            const stats = state.mainCharacterStats;
            const health = stats.health || 85;
            const energy = stats.energy || 70;
            const mood = stats.mood || 60;
            const hunger = stats.hunger || 50;

            document.getElementById('pHealth').style.width = Math.min(100, health) + '%';
            document.getElementById('pHealthVal').textContent = Math.round(health);
            document.getElementById('pEnergy').style.width = Math.min(100, energy) + '%';
            document.getElementById('pEnergyVal').textContent = Math.round(energy);
            document.getElementById('pMood').style.width = Math.min(100, mood) + '%';
            document.getElementById('pMoodVal').textContent = Math.round(mood);
            document.getElementById('pHunger').style.width = Math.min(100, hunger) + '%';
            document.getElementById('pHungerVal').textContent = Math.round(hunger);

            const mainChar = state.characters.get(state.mainCharacterId);
            const name = mainChar ? mainChar.name || '鲁滨逊' : '鲁滨逊';
            const icon = mainChar ? mainChar.icon || '🧒' : '🧒';
            document.getElementById('panelName').textContent = icon + ' ' + name;

        function updateWeatherIndicator() {
            const indicator = document.getElementById('weatherIndicator');
            const icon = document.getElementById('weatherIcon');
            const label = document.getElementById('weatherLabel');
            const timeLabel = document.getElementById('timeLabel');

            const isDefault = state.world.weather === 'clear' && state.world.timeOfDay === 'day';
            if (isDefault || !state.isConnected) {
                indicator.classList.remove('show');
                return;
            }

            const icons = { clear: '☀️', rain: '🌧️', snow: '❄️', storm: '⛈️', fog: '🌫️' };
            const labels = { clear: '晴天', rain: '下雨', snow: '下雪', storm: '暴风雨', fog: '起雾' };
            const timeLabels = { day: '白天', night: '夜晚', dawn: '黎明', dusk: '黄昏' };

            icon.textContent = icons[state.world.weather] || '☀️';
            label.textContent = labels[state.world.weather] || '晴天';
            timeLabel.textContent = timeLabels[state.world.timeOfDay] || '白天';
            indicator.classList.add('show');
        }

        function updateStatusBadge() {
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (!state.isConnected) {
                badge.classList.remove('show');
                return;
            }

            badge.classList.add('show');
            const statusMap = {
                'running': { class: 'running', label: '运行中' },
                'created': { class: 'created', label: '已创建' },
                'stopped': { class: 'stopped', label: '已停止' },
            };
            const s = statusMap[state.currentInstanceStatus] || statusMap['created'];
            dot.className = 'dot ' + s.class;
            text.textContent = s.label;

            // 更新实例名称
            document.getElementById('instanceName').textContent = state.currentInstanceName || '未命名';
        }

        function populateCharacterSelects() {
            const chars = state.sego ? state.sego.characters : {};
            const ids = Object.keys(chars);
            ['communicateTarget', 'teachTarget', 'improveTarget', 'controlTarget'].forEach(selectorId => {
                const select = document.getElementById(selectorId);
                if (!select) return;
                select.innerHTML = '';
                ids.forEach(id => {
                    const c = chars[id];
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = `${c.icon || '👤'} ${c.name || id}`;
                    select.appendChild(option);
                });
            });

        // ============================================================
        // 实例列表渲染
        // ============================================================

        function renderInstanceList(list) {
            const container = document.getElementById('instanceList');
            if (!container) return;

            if (!list || list.length === 0) {
                container.innerHTML =
                    `<div style="color:var(--text-tertiary);text-align:center;padding:20px;font-size:0.9rem;">暂无实例，点击「创建实例」新建</div>`;
                return;
            }

            const statusMap = {
                'running': { label: '● 运行中', cls: 'running' },
                'created': { label: '○ 已创建', cls: 'created' },
                'stopped': { label: '○ 已停止', cls: 'stopped' },
            };

            container.innerHTML = list.map(inst => {
                const status = statusMap[inst.status] || statusMap['created'];
                const isConnected = inst.id === state.currentInstanceId && state.isConnected;
                return `
                    <div class="instance-item">
                        <span class="inst-name">${inst.name || inst.id}</span>
                        <span class="inst-status ${status.cls}">${status.label}</span>
                        <div class="inst-actions">
                            ${!isConnected ? `<button class="btn-connect" onclick="window._connectInstance('${inst.id}')">连接</button>` : `<button onclick="window._disconnectInstance()">断开</button>`}
                            ${inst.status === 'created' ? `<button onclick="window._startInstance('${inst.id}')">启动</button>` : ''}
                            ${inst.status === 'running' ? `<button onclick="window._stopInstance('${inst.id}')">停止</button>` : ''}
                            ${inst.status === 'stopped' ? `<button onclick="window._startInstance('${inst.id}')">重启</button>` : ''}
                            <button onclick="window._deleteInstance('${inst.id}')" style="color:var(--error-color);border-color:rgba(245,139,122,0.2);">删除</button>
                        </div>
                    </div>
                `;
            }).join('');

            // 挂载全局函数供 onclick 调用
            window._connectInstance = function(id) {
                const list = document.getElementById('instanceList');
                const insts = list ? JSON.parse(list.dataset.raw || '[]') : [];
                const found = insts.find(i => i.id === id);
                if (found) {
                    state.currentInstanceName = found.name;
                    connectInstance(id);
                }
                document.getElementById('instanceModal').classList.remove('show');
            };
            window._disconnectInstance = function() {
                disconnectInstance();
                document.getElementById('instanceModal').classList.remove('show');
            };
            window._startInstance = function(id) {
                startInstance(id);
                setTimeout(() => requestInstanceList(), 500);
            };
            window._stopInstance = function(id) {
                stopInstance(id);
                setTimeout(() => requestInstanceList(), 500);
            };
            window._deleteInstance = function(id) {
                if (confirm(`确定要删除实例 "${id}" 吗？`)) {
                    deleteInstance(id);
                    setTimeout(() => requestInstanceList(), 500);
                }
            };

            // 存储原始数据
            container.dataset.raw = JSON.stringify(list);
        }

        // ============================================================
        // 天气系统 (纯渲染，无模拟)
        // ============================================================

        let rainParticles = [];
        let snowParticles = [];
        let starParticles = [];
        let flashTimer = 0;
        let isFlashing = false;
        let flashAlpha = 0;

        const MAX_RAIN = 120;
        const MAX_SNOW = 80;
        const MAX_STARS = 60;

        function initRainParticles(count) {
            const { w, h } = getWorldSize();
            rainParticles = [];
            for (let i = 0; i < count; i++) {
                rainParticles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    speed: 4 + Math.random() * 4,
                    length: 8 + Math.random() * 8,
                    opacity: 0.2 + Math.random() * 0.3,
                    windOffset: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function initSnowParticles(count) {
            const { w, h } = getWorldSize();
            snowParticles = [];
            for (let i = 0; i < count; i++) {
                snowParticles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    speed: 0.8 + Math.random() * 1.5,
                    size: 2 + Math.random() * 3,
                    phase: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.01 + Math.random() * 0.02,
                    wobbleAmount: 0.5 + Math.random() * 1.5,
                    opacity: 0.5 + Math.random() * 0.4
                });
            }
        }

        function initStarParticles(count) {
            const { w, h } = getWorldSize();
            starParticles = [];
            for (let i = 0; i < count; i++) {
                starParticles.push({
                    x: Math.random() * w,
                    y: Math.random() * h * 0.7,
                    size: 1 + Math.random() * 2,
                    twinkleSpeed: 0.02 + Math.random() * 0.04,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function updateWeatherParticles() {
            const weather = state.world.weather;
            const intensity = state.world.intensity || 0;

            if (weather === 'rain' || weather === 'storm') {
                const count = weather === 'storm' ? MAX_RAIN : Math.floor(MAX_RAIN * (0.3 + intensity * 0.7));
                if (rainParticles.length !== Math.max(20, count)) {
                    initRainParticles(Math.max(20, count));
                }
            } else {
                rainParticles = [];
            }

            if (weather === 'snow') {
                const count = Math.floor(MAX_SNOW * (0.3 + intensity * 0.7));
                if (snowParticles.length !== Math.max(15, count)) {
                    initSnowParticles(Math.max(15, count));
                }
            } else {
                snowParticles = [];
            }

            if (state.world.timeOfDay === 'night' && weather !== 'storm') {
                if (starParticles.length === 0) initStarParticles(MAX_STARS);
            } else {
                starParticles = [];
            }

            if (weather === 'storm') {
                flashTimer = 0;
                isFlashing = false;
            }
        }

        function drawWeather() {
            const canvas = document.getElementById('weatherCanvas');
            const container = document.getElementById('mapContainer');
            if (!canvas || !container) return;

            const ctx = canvas.getContext('2d');
            const cw = canvas.width = container.clientWidth;
            const ch = canvas.height = container.clientHeight;

            const isDefault = state.world.weather === 'clear' && state.world.timeOfDay === 'day';
            if (isDefault || !state.isConnected) {
                ctx.clearRect(0, 0, cw, ch);
                return;
            }

            ctx.clearRect(0, 0, cw, ch);

            // 更新粒子数量
            updateWeatherParticles();

            // 时间色调
            drawTimeOverlay(ctx, cw, ch);

            // 天气粒子
            if (state.world.weather === 'rain' || state.world.weather === 'storm') {
                drawRain(ctx, cw, ch);
            } else if (state.world.weather === 'snow') {
                drawSnow(ctx, cw, ch);
            } else if (state.world.weather === 'fog') {
                drawFog(ctx, cw, ch);
            }

            // 星星
            if (state.world.timeOfDay === 'night' && state.world.weather !== 'storm') {
                drawStars(ctx, cw, ch);
            }

            // 暴风雨闪电
            if (state.world.weather === 'storm') {
                drawStormFlash(ctx, cw, ch);
            }
        }

        function drawTimeOverlay(ctx, cw, ch) {
            let alpha = 0;
            let color = '';

            switch (state.world.timeOfDay) {
                case 'day':
                    return;
                case 'dawn':
                    alpha = 0.08 + state.world.intensity * 0.08;
                    color = 'rgba(255, 180, 80, ';
                    break;
                case 'dusk':
                    alpha = 0.12 + state.world.intensity * 0.12;
                    color = 'rgba(200, 100, 60, ';
                    break;
                case 'night':
                    alpha = 0.45 + state.world.intensity * 0.25;
                    color = 'rgba(10, 15, 40, ';
                    break;
                default:
                    return;
            }

            if (state.world.timeOfDay === 'night' && state.world.weather === 'storm') {
                alpha = Math.min(0.85, alpha + 0.2);
            }

            ctx.fillStyle = color + alpha + ')';
            ctx.fillRect(0, 0, cw, ch);

            if (state.world.timeOfDay === 'dawn' || state.world.timeOfDay === 'dusk') {
                const grad = ctx.createRadialGradient(
                    cw * (state.world.timeOfDay === 'dawn' ? 0.2 : 0.8), ch * 0.85, 50,
                    cw * (state.world.timeOfDay === 'dawn' ? 0.2 : 0.8), ch * 0.85, cw * 0.8
                );
                if (state.world.timeOfDay === 'dawn') {
                    grad.addColorStop(0, 'rgba(255, 200, 120, 0.12)');
                    grad.addColorStop(1, 'rgba(255, 200, 120, 0)');
                } else {
                    grad.addColorStop(0, 'rgba(200, 100, 60, 0.15)');
                    grad.addColorStop(1, 'rgba(200, 100, 60, 0)');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);
            }
        }

        function drawRain(ctx, cw, ch) {
            const count = rainParticles.length;
            if (count === 0) return;

            const isStorm = state.world.weather === 'storm';
            const intensity = state.world.intensity || 0;
            const wind = isStorm ? 0.6 + intensity * 0.4 : 0.2 + intensity * 0.3;
            const speedMul = isStorm ? 1.4 : 0.8 + intensity * 0.6;
            const alphaMul = isStorm ? 0.8 + intensity * 0.2 : 0.5 + intensity * 0.4;

            ctx.strokeStyle = 'rgba(180, 200, 220, ';
            ctx.lineWidth = isStorm ? 1.5 : 1.2;

            const { w, h } = getWorldSize();

            for (const p of rainParticles) {
                const sx = (p.x - state.viewX) * state.zoom;
                const sy = (p.y - state.viewY) * state.zoom;

                if (sx < -20 || sx > cw + 20 || sy < -20 || sy > ch + 20) {
                    p.y -= 20;
                    p.x = Math.random() * w;
                    continue;
                }

                const len = p.length * (0.8 + intensity * 0.4);
                const alpha = p.opacity * alphaMul;

                ctx.globalAlpha = Math.min(0.7, alpha);
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(
                    sx - wind * len * 0.6,
                    sy + len * speedMul * 0.8
                );
                ctx.stroke();

                p.x -= wind * 0.6;
                p.y += p.speed * speedMul * 0.7;

                if (p.y > h + 20) {
                    p.y = -20;
                    p.x = Math.random() * w;
                }
                if (p.x < -20) p.x = w + 20;
                if (p.x > w + 20) p.x = -20;
            }

            ctx.globalAlpha = 1;
        }

        function drawSnow(ctx, cw, ch) {
            const count = snowParticles.length;
            if (count === 0) return;

            const time = Date.now() / 1000;
            const intensity = state.world.intensity || 0;
            const wind = 0.1 + intensity * 0.3;
            const { w, h } = getWorldSize();

            for (const p of snowParticles) {
                const sx = (p.x - state.viewX) * state.zoom;
                const sy = (p.y - state.viewY) * state.zoom;

                if (sx < -20 || sx > cw + 20 || sy < -20 || sy > ch + 20) {
                    p.y = -10;
                    p.x = Math.random() * w;
                    continue;
                }

                const size = p.size * (0.8 + intensity * 0.4);
                const alpha = p.opacity * (0.6 + intensity * 0.3);

                ctx.globalAlpha = Math.min(0.8, alpha);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(1, size), 0, Math.PI * 2);
                ctx.fill();

                p.x += Math.sin(time * p.wobbleSpeed + p.phase) * p.wobbleAmount * 0.15 + wind * 0.2;
                p.y += p.speed * (0.6 + intensity * 0.4);

                if (p.y > h + 20) {
                    p.y = -10;
                    p.x = Math.random() * w;
                }
                if (p.x < -20) p.x = w + 20;
                if (p.x > w + 20) p.x = -20;
            }

            ctx.globalAlpha = 1;
        }

        function drawFog(ctx, cw, ch) {
            const intensity = state.world.intensity || 0;
            const alpha = 0.08 + intensity * 0.25;
            const time = Date.now() / 10000;

            for (let layer = 0; layer < 3; layer++) {
                const offset = layer * 0.3 + time * (0.2 + layer * 0.1);
                const cx = cw * (0.3 + Math.sin(offset) * 0.3);
                const cy = ch * (0.4 + Math.cos(offset * 0.7) * 0.3);
                const radius = Math.max(cw, ch) * (0.6 + layer * 0.2);

                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, `rgba(200, 210, 220, ${alpha * (0.6 + layer * 0.2)})`);
                grad.addColorStop(0.5, `rgba(180, 190, 200, ${alpha * (0.3 + layer * 0.15)})`);
                grad.addColorStop(1, 'rgba(180, 190, 200, 0)');

                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, cw, ch);
            }
        }

        function drawStars(ctx, cw, ch) {
            const time = Date.now() / 1000;

            for (const star of starParticles) {
                const sx = (star.x - state.viewX) * state.zoom;
                const sy = (star.y - state.viewY) * state.zoom;

                if (sx < -5 || sx > cw + 5 || sy < -5 || sy > ch + 5) continue;

                const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.phase);
                const size = star.size * (0.5 + twinkle * 0.5);
                const alpha = 0.4 + twinkle * 0.5;

                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(255, 255, 240, 0.9)';
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(0.5, size), 0, Math.PI * 2);
                ctx.fill();

                if (star.size > 1.8 && twinkle > 0.7) {
                    ctx.globalAlpha = alpha * 0.3;
                    ctx.fillStyle = 'rgba(255, 255, 240, 0.8)';
                    ctx.fillRect(sx - 1, sy - 4, 2, 8);
                    ctx.fillRect(sx - 4, sy - 1, 8, 2);
                }
            }

            ctx.globalAlpha = 1;
        }

        function drawStormFlash(ctx, cw, ch) {
            flashTimer += 0.016;

            if (!isFlashing) {
                if (flashTimer > 3 + Math.random() * 5) {
                    isFlashing = true;
                    flashAlpha = 0.6 + Math.random() * 0.3;
                    flashTimer = 0;
                    const flashX = (Math.random() - 0.5) * cw * 0.4 + cw * 0.5;
                    const flashY = (Math.random() - 0.5) * ch * 0.3 + ch * 0.2;

                    ctx.save();
                    ctx.globalAlpha = flashAlpha * 0.9;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(flashX, flashY, 8 + Math.random() * 12, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.globalAlpha = flashAlpha * 0.6;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2 + Math.random() * 2;
                    ctx.shadowBlur = 20;
                    for (let i = 0; i < 3 + Math.random() * 4; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const len = 20 + Math.random() * 50;
                        ctx.beginPath();
                        ctx.moveTo(flashX, flashY);
                        ctx.lineTo(
                            flashX + Math.cos(angle) * len,
                            flashY + Math.sin(angle) * len * (0.5 + Math.random() * 0.5)
                        );
                        ctx.stroke();
                    }

                    ctx.restore();

                    setTimeout(() => {
                        isFlashing = false;
                        flashAlpha = 0;
                    }, 80 + Math.random() * 120);
                }
            } else {
                flashAlpha *= 0.95;
                if (flashAlpha < 0.01) {
                    isFlashing = false;
                    flashAlpha = 0;
                }
            }

            if (isFlashing && flashAlpha > 0.3) {
                ctx.globalAlpha = flashAlpha * 0.15;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(0, 0, cw, ch);
                ctx.globalAlpha = 1;
            }
        }

        // ============================================================
        // 地图绘制
        // ============================================================

        function drawMap() {
            const canvas = document.getElementById('mapCanvas');
            const container = document.getElementById('mapContainer');
            if (!canvas || !container) return;

            const ctx = canvas.getContext('2d');
            const cw = canvas.width = container.clientWidth;
            const ch = canvas.height = container.clientHeight;

            // 清空
            ctx.fillStyle = '#1a1412';
            ctx.fillRect(0, 0, cw, ch);

            // 如果没有连接或者没有配置，只显示提示
            if (!state.isConnected || !state.config) {
                ctx.fillStyle = 'rgba(228,215,207,0.3)';
                ctx.font = '20px "Inter","Segoe UI",sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🌐 请连接实例', cw/2, ch/2 - 10);
                ctx.font = '14px "Inter","Segoe UI",sans-serif';
                ctx.fillStyle = 'rgba(228,215,207,0.15)';
                ctx.fillText('点击右下角 🌐 按钮管理实例', cw/2, ch/2 + 30);
                drawMinimap();
                return;
            }

            const terrains = state.config.terrains || [];

            // 绘制地形
            terrains.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.globalAlpha = 0.35;
                ctx.beginPath();
                t.points.forEach((p, i) => {
                    const sx = wx2sx(p.x),
                        sy = wy2sy(p.y);
                    if (i === 0) ctx.moveTo(sx, sy);
                    else ctx.lineTo(sx, sy);
                });
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1;

                const avgZ = t.points.reduce((sum, p) => sum + (p.z || 0), 0) / t.points.length;
                ctx.strokeStyle = avgZ < 0 ? 'rgba(52,152,219,0.4)' : 'rgba(246,176,124,0.25)';
                ctx.lineWidth = avgZ < 0 ? 2 : 1;
                ctx.setLineDash(avgZ < 0 ? [4, 3] : []);
                ctx.stroke();
                ctx.setLineDash([]);

                const cx = t.points.reduce((s, p) => s + p.x, 0) / t.points.length;
                const cy = t.points.reduce((s, p) => s + p.y, 0) / t.points.length;
                const lsx = wx2sx(cx),
                    lsy = wy2sy(cy);
                if (lsx > -100 && lsx < cw + 100 && lsy > -100 && lsy < ch + 100) {
                    const fs = Math.max(14, Math.min(19, state.zoom * 8));
                    ctx.font = `500 ${fs}px "Inter","Segoe UI",monospace`;
                    const label = t.name + ' z:' + Math.round(avgZ);
                    const lw = ctx.measureText(label).width;
                    ctx.fillStyle = 'rgba(14,11,10,0.7)';
                    ctx.fillRect(lsx - lw / 2 - 8, lsy - fs - 4, lw + 16, fs + 8);
                    ctx.fillStyle = '#d4c4b8';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(label, lsx, lsy - fs / 2);
                }
            });

            // 绘制静态物品 (来自 config)
            const configItems = state.config.items || [];
            configItems.forEach(item => {
                const sx = wx2sx(item.x),
                    sy = wy2sy(item.y);
                if (sx < -30 || sx > cw + 30 || sy < -30 || sy > ch + 30) return;
                const isz = Math.max(16, Math.min(26, state.zoom * 14));
                ctx.font = `${isz}px "Segoe UI",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.icon || '📦', sx, sy);
            });

            // 绘制动态物品 (来自 world.items)
            state.world.items.forEach((item, id) => {
                const sx = wx2sx(item.x),
                    sy = wy2sy(item.y);
                if (sx < -30 || sx > cw + 30 || sy < -30 || sy > ch + 30) return;
                const isz = Math.max(16, Math.min(26, state.zoom * 14));
                ctx.font = `${isz}px "Segoe UI",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.icon || '📦', sx, sy);
            });

            // 绘制树木
            state.world.trees.forEach((tree, id) => {
                if (tree.status === 'cut') return;
                const sx = wx2sx(tree.x),
                    sy = wy2sy(tree.y);
                if (sx < -30 || sx > cw + 30 || sy < -30 || sy > ch + 30) return;
                const isz = Math.max(16, Math.min(26, state.zoom * 14));
                ctx.font = `${isz}px "Segoe UI",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🌲', sx, sy);
            });

            // 绘制建筑
            state.world.buildings.forEach((b, id) => {
                const sx = wx2sx(b.x),
                    sy = wy2sy(b.y);
                if (sx < -30 || sx > cw + 30 || sy < -30 || sy > ch + 30) return;
                const isz = Math.max(20, Math.min(32, state.zoom * 16));
                ctx.font = `${isz}px "Segoe UI",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.icon || '🏠', sx, sy);
            });

            // 绘制人物
            state.characters.forEach((char, id) => {
                const sx = wx2sx(char.x),
                    sy = wy2sy(char.y);
                const isMain = (id === state.mainCharacterId);
                const rSize = isMain ? Math.max(10, state.zoom * 6.5) : Math.max(8, state.zoom * 5);

                ctx.fillStyle = isMain ? '#E57324' : '#C28A5C';
                ctx.beginPath();
                ctx.arc(sx, sy, rSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const icon = char.icon || '🧒';
                ctx.font = `bold ${rSize * 1.5}px "Segoe UI",monospace`;
                ctx.fillStyle = isMain ? '#2D2E1C' : '#2C221A';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, sx, sy - rSize * 2.2);

                const nameSize = isMain ? Math.max(14, rSize * 0.9) : Math.max(12, rSize * 0.8);
                ctx.font = `500 ${nameSize}px "Inter","Segoe UI",monospace`;
                ctx.fillStyle = isMain ? 'rgba(228,215,207,0.9)' : 'rgba(228,215,207,0.7)';
                ctx.textAlign = 'center';
                ctx.fillText(char.name || id, sx, sy - rSize * 4.2);
            });

            drawMinimap();
            updateBubblePositions();
        }

        function drawMinimap() {
            const mm = document.getElementById('minimapCanvas');
            if (!mm) return;
            const ctx = mm.getContext('2d');
            const mw = 180,
                mh = 150;
            mm.width = mw;
            mm.height = mh;
            ctx.fillStyle = 'rgba(14,11,10,0.9)';
            ctx.fillRect(0, 0, mw, mh);

            const terrains = state.config ? state.config.terrains : [];
            const { w, h } = getWorldSize();

            terrains.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                t.points.forEach((p, i) => {
                    const sx = p.x / w * mw;
                    const sy = p.y / h * mh;
                    if (i === 0) ctx.moveTo(sx, sy);
                    else ctx.lineTo(sx, sy);
                });
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            state.characters.forEach((char) => {
                const sx = char.x / w * mw;
                const sy = char.y / h * mh;
                const isMain = (char.id === state.mainCharacterId);
                ctx.fillStyle = isMain ? '#E57324' : '#C28A5C';
                ctx.beginPath();
                ctx.arc(sx, sy, isMain ? 6 : 5, 0, Math.PI * 2);
                ctx.fill();
            });

            const vw = w / state.zoom,
                vh = h / state.zoom;
            ctx.strokeStyle = 'rgba(246,176,124,0.4)';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(state.viewX / w * mw, state.viewY / h * mh, vw / w * mw, vh / h * mh);
        }

        // 气泡系统
