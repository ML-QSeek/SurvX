<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SurvX · 生存世界</title>
    <style>
        /* ===== 全局暖色调 ===== */
        :root {
            --primary: #f6b07c;
            --primary-dark: #d4845a;
            --primary-light: #f5cba0;
            --primary-transparent: rgba(246, 176, 124, 0.15);
            --bg-primary: #0e0b0a;
            --bg-secondary: #1a1412;
            --bg-tertiary: #221c19;
            --text-primary: #e4d7cf;
            --text-secondary: #d4c4b8;
            --text-tertiary: #a28c7c;
            --border-color: #3a2c24;
            --error-color: #f58b7a;
            --success-color: #eab676;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 18px;
            font-weight: 300;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(246, 176, 124, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(212, 132, 90, 0.04) 0%, transparent 45%);
            z-index: 0;
            pointer-events: none;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 6px;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .map-container {
            flex: 1;
            min-width: 420px;
            position: relative;
            background: #0a0807;
            overflow: hidden;
        }
        .map-container.controlling {
            cursor: none;
        }
        .map-container:not(.controlling) {
            cursor: grab;
        }
        .map-container:not(.controlling):active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .title-block {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 15;
            pointer-events: none;
            user-select: none;
        }
        .title-block h1 {
            font-size: 2.0rem;
            font-weight: 500;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f5cba0 0%, #f6b07c 40%, #d4845a 80%, #c07a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(246, 176, 124, 0.15);
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .title-block .instance-name {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* ===== 状态面板 ===== */
        .status-panel {
            position: absolute;
            top: 76px;
            left: 16px;
            z-index: 14;
            background: rgba(14, 11, 10, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(246, 176, 124, 0.15);
            border-radius: 10px;
            padding: 18px 24px 16px 24px;
            min-width: 220px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            display: none;
            pointer-events: none;
            user-select: none;
        }
        .status-panel.show {
            display: block;
        }
        .status-panel .panel-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--primary-light);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.08);
            padding-bottom: 8px;
        }
        .status-panel .stat-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .status-panel .stat-row .stat-label {
            min-width: 36px;
            color: var(--text-tertiary);
            font-size: 1.0rem;
            flex-shrink: 0;
        }
        .status-panel .stat-row .stat-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            min-width: 80px;
        }
        .status-panel .stat-row .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .status-panel .stat-row .stat-value {
            min-width: 36px;
            text-align: right;
            font-size: 0.95rem;
            color: var(--text-tertiary);
        }
        .fill-health {
            background: linear-gradient(90deg, #f58b7a, #f6b07c);
        }
        .fill-energy {
            background: linear-gradient(90deg, #eab676, #f5cba0);
        }
        .fill-mood {
            background: linear-gradient(90deg, #7ec8c8, #a8e0e0);
        }
        .fill-hunger {
            background: linear-gradient(90deg, #eab676, #f6b07c);
        }

        /* ===== 右下角图标 ===== */
        .right-actions {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 14px;
            pointer-events: none;
        }
        .right-actions .action-btn {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 1px solid rgba(246, 176, 124, 0.25);
            background: rgba(14, 11, 10, 0.7);
            backdrop-filter: blur(8px);
            color: var(--text-secondary);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            user-select: none;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        .right-actions .action-btn:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
            box-shadow: 0 0 20px rgba(246, 176, 124, 0.08);
            transform: scale(1.05);
        }
        .right-actions .action-btn .icon {
            font-size: 22px;
            line-height: 1;
        }
        .right-actions .action-btn .label {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .right-actions .action-btn.active-btn {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
        }

        .minimap {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 180px;
            height: 150px;
            border: 1px solid rgba(246, 176, 124, 0.3);
            border-radius: 6px;
            background: rgba(14, 11, 10, 0.8);
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }

        .control-cursor {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            font-size: 36px;
            transform: translate(-50%, -50%);
            display: none;
            text-shadow: 0 0 20px rgba(255, 152, 0, 0.6);
        }
        .control-cursor.show {
            display: block;
        }

        /* ===== 弹窗 ===== */
        .float-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border: 1px solid rgba(246, 176, 124, 0.25);
            border-radius: 12px;
            padding: 32px 36px 28px 36px;
            min-width: 420px;
            max-width: 600px;
            width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(246, 176, 124, 0.05);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            pointer-events: auto;
            animation: modalFadeIn 0.2s ease;
        }
        .float-modal.show {
            display: block;
        }
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .float-modal .modal-title {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--primary-light);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.1);
            padding-bottom: 14px;
            text-align: center;
        }
        .float-modal .modal-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 22px;
        }
        .float-modal .modal-body .option-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .float-modal .modal-body .option-group label {
            min-width: 80px;
            color: var(--text-tertiary);
            font-size: 1.0rem;
            flex-shrink: 0;
        }
        .float-modal .modal-body .option-group select,
        .float-modal .modal-body .option-group input,
        .float-modal .modal-body .option-group textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(246, 176, 124, 0.2);
            border-radius: 4px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 1.0rem;
            outline: none;
            font-family: inherit;
            flex: 1;
            min-width: 100px;
        }
        .float-modal .modal-body .option-group textarea {
            resize: vertical;
            min-height: 60px;
            line-height: 1.4;
        }
        .float-modal .modal-body .option-group select:focus,
        .float-modal .modal-body .option-group input:focus,
        .float-modal .modal-body .option-group textarea:focus {
            border-color: var(--primary);
        }
        .float-modal .modal-body .option-group select option {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .float-modal .modal-body .option-group .coord-display {
            font-size: 0.95rem;
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
            padding: 4px 14px;
            border-radius: 4px;
            border: 1px dashed rgba(246, 176, 124, 0.2);
            min-width: 100px;
            text-align: center;
        }
        .float-modal .modal-body .option-group .hint-text {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            font-style: italic;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 10px;
            border-radius: 3px;
            user-select: none;
        }
        .float-modal .modal-body .option-group .hint-text:hover {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
        }
        .float-modal .modal-body .option-group .hint-text.active {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.12);
        }
        .float-modal .modal-body .instance-list {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .float-modal .modal-body .instance-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid rgba(246, 176, 124, 0.08);
            border-radius: 6px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }
        .float-modal .modal-body .instance-item:hover {
            border-color: rgba(246, 176, 124, 0.2);
        }
        .float-modal .modal-body .instance-item .inst-name {
            color: var(--text-primary);
            font-weight: 400;
        }
        .float-modal .modal-body .instance-item .inst-status {
            font-size: 0.8rem;
            padding: 2px 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-tertiary);
        }
        .float-modal .modal-body .instance-item .inst-status.running {
            color: #7cdf7c;
            background: rgba(124, 223, 124, 0.12);
        }
        .float-modal .modal-body .instance-item .inst-status.created {
            color: #f5cba0;
            background: rgba(245, 203, 160, 0.08);
        }
        .float-modal .modal-body .instance-item .inst-status.stopped {
            color: #f58b7a;
            background: rgba(245, 139, 122, 0.08);
        }
        .float-modal .modal-body .instance-item .inst-actions {
            display: flex;
            gap: 6px;
        }
        .float-modal .modal-body .instance-item .inst-actions button {
            background: transparent;
            border: 1px solid rgba(246, 176, 124, 0.15);
            color: var(--text-tertiary);
            padding: 2px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .float-modal .modal-body .instance-item .inst-actions button:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: var(--primary-transparent);
        }
        .float-modal .modal-body .instance-item .inst-actions button.btn-connect {
            border-color: var(--primary);
            color: var(--primary-light);
        }
        .float-modal .modal-body .instance-item .inst-actions button.btn-connect:hover {
            background: rgba(246, 176, 124, 0.15);
        }

        .float-modal .modal-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            border-top: 1px solid rgba(246, 176, 124, 0.08);
            padding-top: 18px;
        }
        .float-modal .modal-actions button {
            background: transparent;
            border: 1px solid rgba(246, 176, 124, 0.25);
            color: var(--text-secondary);
            padding: 8px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.0rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .float-modal .modal-actions button:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            background: var(--primary-transparent);
        }
        .float-modal .modal-actions .btn-confirm {
            border-color: var(--primary);
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.06);
        }
        .float-modal .modal-actions .btn-confirm:hover {
            background: rgba(246, 176, 124, 0.15);
        }

        .func-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(246, 176, 124, 0.08);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }
        .func-tabs .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            padding: 8px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .func-tabs .tab-btn:hover {
            color: var(--text-secondary);
            background: rgba(246, 176, 124, 0.05);
        }
        .func-tabs .tab-btn.active {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.1);
        }
        .func-panel-content {
            min-height: 140px;
        }
        .func-panel-content .option-group {
            margin: 12px 0;
        }

        /* ===== 日志面板 ===== */
        .log-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 33.33%;
            height: 280px;
            background: rgba(10, 8, 7, 0.55);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(246, 176, 124, 0.08);
            border-right: 1px solid rgba(246, 176, 124, 0.08);
            z-index: 15;
            display: none;
            flex-direction: column;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            pointer-events: auto;
            padding: 12px 18px 14px 18px;
        }
        .log-panel.show {
            display: flex;
        }
        .log-panel .log-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .log-panel .log-header .close-log {
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 24px;
            line-height: 1;
            transition: 0.2s;
            padding: 0 4px;
        }
        .log-panel .log-header .close-log:hover {
            color: var(--primary-light);
        }
        .log-panel .log-body {
            flex: 1;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.9;
            color: var(--text-secondary);
            padding-right: 4px;
        }
        .log-panel .log-body .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(246, 176, 124, 0.03);
            display: flex;
            gap: 14px;
            align-items: baseline;
        }
        .log-panel .log-body .log-entry .log-time {
            color: var(--primary-light);
            font-weight: 400;
            flex-shrink: 0;
            font-size: 0.85rem;
            min-width: 56px;
            opacity: 0.8;
        }
        .log-panel .log-body .log-entry .log-msg {
            color: var(--text-secondary);
            word-break: break-word;
            font-weight: 300;
            opacity: 0.9;
        }

        .map-container.pick-coord {
            cursor: crosshair !important;
        }
        .map-container.pick-coord canvas {
            cursor: crosshair !important;
        }

        /* ===== 气泡 ===== */
        .bubble-container {
            position: absolute;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.35s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bubble-container.show {
            opacity: 1;
        }
        .bubble-container.fading {
            opacity: 0;
        }

        .bubble-body {
            padding: 16px 24px;
            border-radius: 22px;
            min-width: 100px;
            max-width: 360px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 400;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
            scrollbar-width: thin;
            word-break: break-word;
            position: relative;
            z-index: 2;
            border-width: 2px;
            border-style: solid;
        }
        .bubble-body::-webkit-scrollbar {
            width: 3px;
        }
        .bubble-body::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }

        .bubble-thought .bubble-body {
            background: #fdf6ee;
            border-color: #3d2b1f;
            color: #2d1f14;
        }
        .bubble-speech .bubble-body {
            background: #e8f4f8;
            border-color: #4a7c8c;
            color: #1a3a44;
        }

        #weatherCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: block;
        }

        .weather-indicator {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            background: rgba(14, 11, 10, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(246, 176, 124, 0.12);
            border-radius: 20px;
            padding: 4px 16px;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            pointer-events: none;
            user-select: none;
            letter-spacing: 0.5px;
            font-weight: 400;
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        .weather-indicator.show {
            opacity: 0.7;
        }
        .weather-indicator .env-icon {
            margin-right: 6px;
        }

        @media (max-width: 800px) {
            .main {
                flex-direction: column;
            }
            .map-container {
                min-width: auto;
                height: 100vh;
            }
            .minimap {
                width: 140px;
                height: 110px;
                top: 8px;
                right: 8px;
            }
            .title-block h1 {
                font-size: 1.6rem;
            }
            .status-panel {
                top: 64px;
                left: 10px;
                padding: 14px 18px 14px 18px;
                min-width: 180px;
            }
            .status-panel .panel-name {
                font-size: 1.0rem;
            }
            .status-panel .stat-row .stat-label {
                font-size: 0.9rem;
                min-width: 30px;
            }
            .status-panel .stat-row .stat-value {
                font-size: 0.9rem;
                min-width: 30px;
            }
            .right-actions {
                bottom: 14px;
                right: 8px;
                gap: 10px;
            }
            .right-actions .action-btn {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }
            .right-actions .action-btn .label {
                font-size: 0.6rem;
            }
            .log-panel {
                width: 50%;
                height: 220px;
                padding: 8px 14px 10px 14px;
            }
            .log-panel .log-body {
                font-size: 0.85rem;
            }
            .float-modal {
                min-width: 300px;
                padding: 22px 24px;
                max-width: 95vw;
            }
            .func-tabs .tab-btn {
                font-size: 0.85rem;
                padding: 6px 14px;
            }
            .float-modal .modal-body .option-group label {
                min-width: 70px;
                font-size: 0.9rem;
            }
            .bubble-body {
                max-width: 220px !important;
                max-height: 120px !important;
                font-size: 1.0rem !important;
                padding: 12px 18px !important;
            }
            .weather-indicator {
                font-size: 0.65rem;
                padding: 3px 12px;
                top: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="main">
        <div class="map-container" id="mapContainer">
            <!-- 地图 -->
            <canvas id="mapCanvas"></canvas>
            <!-- 天气层 -->
            <canvas id="weatherCanvas"></canvas>

            <div class="title-block">
                <h1 id="mapTitle">加载中...</h1>
                <div class="instance-name" id="instanceName">未连接</div>
