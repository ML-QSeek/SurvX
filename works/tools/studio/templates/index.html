<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 代码调试器</title>

    <!-- CodeMirror CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 8px 12px 8px 12px;
            gap: 6px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 0.85fr;
            gap: 6px;
            flex: 1;
            min-height: 0;
        }

        /* ============================================================
           左侧：代码面板
           ============================================================ */
        .left-panel {
            display: flex;
            flex-direction: column;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 0;
            overflow: hidden;
            min-height: 0;
        }

        .left-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
            gap: 8px;
            min-height: 32px;
        }

        .left-header .title {
            font-size: 12px;
            color: #8b949e;
            white-space: nowrap;
        }

        .left-header .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .left-header .nav-group button {
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 6px;
            font-family: inherit;
            transition: color 0.2s;
        }
        .left-header .nav-group button:hover:not(:disabled) {
            color: #58a6ff;
        }
        .left-header .nav-group button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .left-header .nav-group .version-info {
            font-size: 12px;
            color: #8b949e;
            min-width: 90px;
            text-align: center;
        }

        .left-header .btn-run-code {
            background: #1f6feb;
            color: #fff;
            border: none;
            border-radius: 0;
            padding: 3px 14px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .left-header .btn-run-code:hover {
            background: #388bfd;
        }
        .left-header .btn-run-code:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }

        /* CodeMirror 容器 */
        .code-editor-wrapper {
            flex: 1;
            background: #0d1117;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .code-editor-wrapper .CodeMirror {
            height: 100% !important;
            font-size: 13px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #0d1117;
            color: #e6edf3;
        }

        .code-editor-wrapper .CodeMirror-gutters {
            background: #0d1117;
            border-right: 1px solid #1e2630;
        }

        .code-editor-wrapper .CodeMirror-linenumber {
            color: #484f58;
        }

        .code-editor-wrapper .CodeMirror-cursor {
            border-left: 2px solid #e6edf3;
        }

        .code-editor-wrapper .CodeMirror-selected {
            background: #1f6feb33;
        }

        /* ============================================================
           右侧：Grid 四行
           ============================================================ */
        .right-panel {
            display: grid;
            grid-template-rows: 1fr 1fr 2fr 56px;
            gap: 6px;
            min-height: 0;
        }

        .right-panel .right-row {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .right-row .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 10px;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
            font-size: 11px;
            color: #8b949e;
            min-height: 26px;
        }

        .right-row .row-header .btn-save-context {
            background: #21262d;
            color: #c9d1d9;
            border: none;
            border-radius: 0;
            padding: 2px 12px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .right-row .row-header .btn-save-context:hover {
            background: #30363d;
        }

        /* 项目切换 - 点击标题切换 */
        .right-row .row-header .project-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 11px;
            color: #8b949e;
            transition: color 0.2s;
            user-select: none;
        }
        .right-row .row-header .project-selector:hover {
            color: #58a6ff;
        }
        .right-row .row-header .project-selector .project-name {
            color: #e6edf3;
            font-weight: 500;
        }
        .right-row .row-header .project-selector .arrow {
            font-size: 10px;
            transition: transform 0.2s;
        }
        .right-row .row-header .project-selector .arrow.open {
            transform: rotate(180deg);
        }

        /* 项目下拉菜单 */
        .right-row .row-header .project-dropdown {
           display: none;
				   position: absolute;
				   top: 100%;
				   left: 0;              /* ← 从 right:0 改成 left:0 */
				   background: #161b22;
				   border: 1px solid #30363d;
				   border-radius: 0;
				   min-width: 180px;     /* ← 加宽一点，显示完整项目名 */
				   max-height: 200px;
				   overflow-y: auto;
				   z-index: 100;
				   padding: 4px 0;
        }
        .right-row .row-header .project-dropdown.open {
            display: block;
        }
        .right-row .row-header .project-dropdown .dropdown-item {
            padding: 4px 14px;
            font-size: 12px;
            color: #c9d1d9;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }
        .right-row .row-header .project-dropdown .dropdown-item:hover {
            background: #1c2333;
            color: #58a6ff;
        }
        .right-row .row-header .project-dropdown .dropdown-item.active {
            color: #58a6ff;
            background: #1c2a3d;
        }
        .right-row .row-header .project-dropdown .dropdown-divider {
            height: 1px;
            background: #30363d;
            margin: 4px 10px;
        }
        .right-row .row-header .project-dropdown .dropdown-item.create-new {
            color: #3fb950;
        }
        .right-row .row-header .project-dropdown .dropdown-item.create-new:hover {
            background: #1a2a1a;
        }

        .right-row .row-header .project-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .right-row .row-body {
            flex: 1;
            background: #0d1117;
            border: none;
            color: #e6edf3;
            padding: 6px 10px;
            font-size: 12px;
            font-family: inherit;
            resize: none;
            outline: none;
            line-height: 1.5;
            min-height: 0;
        }
        .right-row .row-body:focus {
            outline: 1px solid #30363d;
        }

        .right-row.context-row .row-body {
            font-family: inherit;
            font-size: 12px;
        }

        /* 文件浏览器 */
        .right-row.files-row .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 2px 4px;
            background: #0d1117;
        }

        .right-row.files-row .file-list .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 8px;
            border-radius: 0;
            cursor: pointer;
            font-size: 12px;
            color: #8b949e;
            transition: background 0.15s;
            font-family: inherit;
        }
        .right-row.files-row .file-list .file-item:hover {
            background: #1c2333;
        }
        .right-row.files-row .file-list .file-item.active-code {
            background: #1c2a3d;
            color: #58a6ff;
        }
        .right-row.files-row .file-list .file-item.active-log {
            background: #1f1a0e;
            color: #d29922;
        }
        .right-row.files-row .file-list .file-item .file-icon {
            margin-right: 6px;
        }
        .right-row.files-row .file-list .file-item .file-size {
            color: #484f58;
            font-size: 10px;
        }
        .right-row.files-row .file-list .file-empty {
            color: #484f58;
            font-size: 12px;
            padding: 10px 8px;
            text-align: center;
        }

        /* 日志 */
        .right-row.log-row .row-body {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
        }

        /* ============================================================
           右侧底部：输入区
           ============================================================ */
        .input-row {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 0;
            display: flex;
            align-items: stretch;
            overflow: hidden;
            min-height: 0;
            height: 56px;
        }

        .input-row .input-field {
            flex: 1;
            background: #0d1117;
            border: none;
            color: #e6edf3;
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            min-width: 0;
        }
        .input-row .input-field:focus {
            outline: 1px solid #30363d;
        }

        .input-row .btn-send-bar {
            width: 8px;
            background: #30363d;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
            padding: 0;
        }
        .input-row .btn-send-bar:hover {
            background: #58a6ff;
        }
        .input-row .btn-send-bar:active {
            background: #1f6feb;
        }
        .input-row .btn-send-bar:disabled {
            background: #21262d;
            cursor: not-allowed;
        }

        .input-row .btn-stack {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            width: 32px;
            height: 100%;
        }

        .input-row .btn-stack button {
            flex: 1;
            background: #0d1117;
            border: none;
            color: #8b949e;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            min-height: 0;
            line-height: 1;
        }
        .input-row .btn-stack button:hover {
            background: #1c2333;
            color: #e6edf3;
        }
        .input-row .btn-stack button:active {
            background: #0d1a2b;
        }

        .input-row .btn-stack .btn-mode {
            border-bottom: 1px solid #21262d;
        }
        .input-row .btn-stack .btn-mode.active-chat {
            color: #58a6ff;
        }
        .input-row .btn-stack .btn-mode.active-code {
            color: #3fb950;
        }

        .input-row .btn-stack .btn-submit.active-submit {
            color: #d29922;
        }
        .input-row .btn-stack .btn-submit.active-normal {
            color: #8b949e;
        }

        /* ============================================================
           滚动条
           ============================================================ */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 0;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* ============================================================
           状态指示灯
           ============================================================ */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #8b949e;
        }
        .status-indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 0;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-indicator .dot.success {
            background: #3fb950;
        }
        .status-indicator .dot.error {
            background: #f85149;
        }
        .status-indicator .dot.timeout {
            background: #d29922;
        }
        .status-indicator .dot.idle {
            background: #484f58;
        }
        .status-indicator .dot.chat {
            background: #58a6ff;
        }
        .status-indicator .elapsed {
            color: #484f58;
            font-size: 10px;
        }

        /* ============================================================
           创建项目弹窗
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-overlay .modal-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 0;
            padding: 24px 32px;
            min-width: 320px;
            max-width: 400px;
        }
        .modal-overlay .modal-box .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #e6edf3;
        }
        .modal-overlay .modal-box .modal-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0;
            color: #e6edf3;
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 12px;
        }
        .modal-overlay .modal-box .modal-input:focus {
            outline: 1px solid #58a6ff;
        }
        .modal-overlay .modal-box .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-overlay .modal-box .modal-actions button {
            padding: 6px 20px;
            border: none;
            border-radius: 0;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .modal-overlay .modal-box .modal-actions .btn-cancel {
            background: #21262d;
            color: #c9d1d9;
        }
        .modal-overlay .modal-box .modal-actions .btn-cancel:hover {
            background: #30363d;
        }
        .modal-overlay .modal-box .modal-actions .btn-confirm {
            background: #1f6feb;
            color: #fff;
        }
        .modal-overlay .modal-box .modal-actions .btn-confirm:hover {
            background: #388bfd;
        }
    </style>
</head>
<body>

    <div class="app">

        <div class="main-grid">

            <!-- ==========================================================
            左侧：代码面板（CodeMirror）
            ========================================================== -->
            <div class="left-panel">

                <div class="left-header">
                    <span class="title" id="panelTitle">💻 代码</span>

                    <div class="nav-group">
                        <button id="btnPrev" onclick="prevVersion()" disabled>◀</button>
                        <span class="version-info" id="versionInfo">V0 / 共 0 版</span>
                        <button id="btnNext" onclick="nextVersion()" disabled>▶</button>
                    </div>

                    <div style="display:flex;align-items:center;gap:8px;">
                        <div class="status-indicator">
                            <span class="dot idle" id="statusDot"></span>
                            <span id="statusText">就绪</span>
                            <span class="elapsed" id="elapsedText"></span>
                        </div>
                        <button class="btn-run-code" id="btnRunCode" onclick="handleRunCode()" disabled>▶ 运行</button>
                    </div>
                </div>

                <!-- CodeMirror 容器 -->
                <div class="code-editor-wrapper" id="codeEditorWrapper"></div>
            </div>

            <!-- ==========================================================
            右侧：Grid 四行
            ========================================================== -->
            <div class="right-panel">

                <!-- 背景要求 -->
                <div class="right-row context-row">
                    <div class="row-header">
                        <span>📋 背景要求</span>
                        <button class="btn-save-context" onclick="saveContext()">💾 保存</button>
                    </div>
                    <textarea class="row-body" id="contextEditor" placeholder="项目背景、约束条件等（可选）..." spellcheck="false"></textarea>
                </div>

                <!-- 文件浏览器（带项目切换） -->
                <div class="right-row files-row">
                    <div class="row-header">
                        <div class="project-wrapper">
                            <span style="font-size:11px;color:#484f58;">📁</span>
                            <div class="project-selector" id="projectSelector" onclick="toggleProjectDropdown()">
                                <span class="project-name" id="currentProjectName">workspace/</span>
                                <span class="arrow" id="dropdownArrow">▼</span>
                            </div>
                            <div class="project-dropdown" id="projectDropdown">
                                <!-- 动态由 JS 渲染 -->
                            </div>
                        </div>
                        <span style="font-size:10px;color:#484f58;" id="fileCount"></span>
                    </div>
                    <div class="file-list" id="fileList">
                        <div class="file-empty">暂无文件</div>
                    </div>
                </div>

                <!-- 日志 -->
                <div class="right-row log-row">
                    <div class="row-header">
                        <span>📋 日志</span>
                        <span style="font-size:10px;color:#484f58;">可编辑</span>
                    </div>
                    <textarea class="row-body" id="logEditor" spellcheck="false"></textarea>
                </div>

                <!-- 输入区 -->
                <div class="input-row">
                    <input class="input-field" id="instructionInput" type="text" placeholder="输入内容..." spellcheck="false">

                    <button class="btn-send-bar" id="btnSendBar" onclick="handleSend()" title="发送"></button>

                    <div class="btn-stack">
                        <button class="btn-mode active-code" id="btnMode" onclick="toggleMode()" title="切换模式">📦</button>
                        <button class="btn-submit active-normal" id="btnSubmit" onclick="toggleSubmit()" title="切换提交状态">📋</button>
                    </div>
                </div>

            </div>
            <!-- /right-panel -->

        </div>
        <!-- /main-grid -->

    </div>
    <!-- /app -->

    <!-- 创建项目弹窗 -->
    <div class="modal-overlay" id="createProjectModal">
        <div class="modal-box">
            <div class="modal-title">📁 创建新项目</div>
            <input class="modal-input" id="newProjectNameInput" type="text" placeholder="项目名称 (字母/数字/下划线)" spellcheck="false">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCreateProjectModal()">取消</button>
                <button class="btn-confirm" onclick="confirmCreateProject()">创建</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 初始化 CodeMirror
        // ============================================================
        const codeEditorWrapper = document.getElementById('codeEditorWrapper');

        const cmEditor = CodeMirror(codeEditorWrapper, {
            value: '',
            mode: 'python',
            theme: 'dracula',
            lineNumbers: true,
            tabSize: 4,
            indentUnit: 4,
            smartIndent: true,
            indentWithTabs: false,
            matchBrackets: true,
            autoCloseBrackets: true,
            foldGutter: true,
            gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
            extraKeys: {
                "Ctrl-/": "toggleComment",
                "Cmd-/": "toggleComment",
            }
        });

        function refreshEditor() { cmEditor.refresh(); }
        setTimeout(refreshEditor, 100);
        window.addEventListener('resize', refreshEditor);

        // ============================================================
        // 状态
        // ============================================================
        let currentVersion = 0;
        let totalVersions = 0;
        let isRunning = false;
        let currentMode = 'code';
        let submitState = 'normal';
        let currentProject = 'default';
        let projects = [];

        // ============================================================
        // DOM 引用
        // ============================================================
        const logEditor = document.getElementById('logEditor');
        const contextEditor = document.getElementById('contextEditor');
        const instructionInput = document.getElementById('instructionInput');
        const btnSendBar = document.getElementById('btnSendBar');
        const btnMode = document.getElementById('btnMode');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnRunCode = document.getElementById('btnRunCode');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const elapsedText = document.getElementById('elapsedText');
        const versionInfo = document.getElementById('versionInfo');
        const panelTitle = document.getElementById('panelTitle');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const currentProjectName = document.getElementById('currentProjectName');
        const projectDropdown = document.getElementById('projectDropdown');
        const dropdownArrow = document.getElementById('dropdownArrow');
        const createProjectModal = document.getElementById('createProjectModal');
        const newProjectNameInput = document.getElementById('newProjectNameInput');

        // ============================================================
        // 工具函数（使用 CodeMirror 的 getValue/setValue）
        // ============================================================
        function getInstruction() { return instructionInput.value.trim(); }
        function getCode() { return cmEditor.getValue(); }
        function getLog() { return logEditor.value; }
        function getContext() { return contextEditor.value; }

        function setCode(code) {
            cmEditor.setValue(code || '');
            setTimeout(refreshEditor, 50);
        }

        function setLog(log) { logEditor.value = log || ''; }

        function setStatus(text, type = 'idle') {
            statusDot.className = 'dot ' + type;
            statusText.textContent = text;
        }

        function setElapsed(ms) {
            elapsedText.textContent = ms > 0 ? `⏱ ${ms}ms` : '';
        }

        function updateVersionDisplay() {
            const text = `V${currentVersion} / 共 ${totalVersions} 版`;
            versionInfo.textContent = text;
            btnPrev.disabled = (currentVersion <= 1 || totalVersions === 0);
            btnNext.disabled = (currentVersion >= totalVersions || totalVersions === 0);
            btnRunCode.disabled = (totalVersions === 0 && !getCode());
        }

        function setPanelTitle(mode) {
            panelTitle.textContent = mode === 'chat' ? '💬 对话回复' : '💻 代码';
        }

        function clearInstruction() { instructionInput.value = ''; }

        function showToast(msg) {
            const old = statusText.textContent;
            statusText.textContent = msg;
            setTimeout(() => {
                if (statusText.textContent === msg) statusText.textContent = old;
            }, 1500);
        }

        function renderEmpty() {
            setCode('');
            setLog('');
            setStatus('就绪', 'idle');
            setElapsed(0);
            setPanelTitle(currentMode);
            btnRunCode.disabled = true;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        }

        // ============================================================
        // 项目管理
        // ============================================================
        async function loadProjects() {
            try {
                const resp = await fetch('/api/projects');
                const data = await resp.json();
                if (data.success) {
                    projects = data.projects || [];
                    currentProject = data.current || 'default';
                    currentProjectName.textContent = currentProject + '/';
                    renderProjectDropdown();
                }
            } catch (e) {
                console.error('加载项目列表失败:', e);
            }
        }

        function renderProjectDropdown() {
            projectDropdown.innerHTML = '';
            projects.forEach(p => {
                const item = document.createElement('button');
                item.className = 'dropdown-item' + (p === currentProject ? ' active' : '');
                item.textContent = p;
                item.onclick = () => switchProject(p);
                projectDropdown.appendChild(item);
            });
            // 分割线
            const divider = document.createElement('div');
            divider.className = 'dropdown-divider';
            projectDropdown.appendChild(divider);
            // 创建新项目
            const createItem = document.createElement('button');
            createItem.className = 'dropdown-item create-new';
            createItem.textContent = '+ 创建新项目';
            createItem.onclick = () => { toggleProjectDropdown();
                openCreateProjectModal(); };
            projectDropdown.appendChild(createItem);
        }

        function toggleProjectDropdown() {
            const isOpen = projectDropdown.classList.contains('open');
            projectDropdown.classList.toggle('open');
            dropdownArrow.classList.toggle('open');
            if (!isOpen) {
                // 重新加载项目列表，保证最新
                loadProjects();
            }
        }

        async function switchProject(projectName) {
            if (projectName === currentProject) {
                toggleProjectDropdown();
                return;
            }

            try {
                const resp = await fetch('/api/projects/switch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project: projectName })
                });
                const data = await resp.json();
                if (data.success) {
                    currentProject = projectName;
                    currentProjectName.textContent = projectName + '/';
                    // 重新加载状态
                    await loadStatus();
                    await loadFileList();
                    showToast(`📁 切换到项目: ${projectName}`);
                } else {
                    alert('切换失败: ' + data.error);
                }
            } catch (e) {
                alert('切换失败: ' + e.message);
            }
            toggleProjectDropdown();
        }

        function openCreateProjectModal() {
            createProjectModal.classList.add('open');
            newProjectNameInput.value = '';
            newProjectNameInput.focus();
        }

        function closeCreateProjectModal() {
            createProjectModal.classList.remove('open');
        }

        async function confirmCreateProject() {
            const name = newProjectNameInput.value.trim();
            if (!name) {
                alert('请输入项目名称');
                return;
            }
            if (!/^[a-zA-Z0-9_\-.]+$/.test(name)) {
                alert('项目名只能包含字母、数字、下划线、中划线、点');
                return;
            }
            try {
                const resp = await fetch('/api/projects/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project: name })
                });
                const data = await resp.json();
                if (data.success) {
                    closeCreateProjectModal();
                    // 自动切换到新项目
                    await switchProject(name);
                    showToast(`✅ 项目 "${name}" 已创建`);
                } else {
                    alert('创建失败: ' + data.error);
                }
            } catch (e) {
                alert('创建失败: ' + e.message);
            }
        }

        // 回车创建项目
        newProjectNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                confirmCreateProject(); }
            if (e.key === 'Escape') { closeCreateProjectModal(); }
        });

        // 点击弹窗外关闭
        createProjectModal.addEventListener('click', (e) => {
            if (e.target === createProjectModal) closeCreateProjectModal();
        });

        // ============================================================
        // 模式切换
        // ============================================================
        function toggleMode() {
            if (currentMode === 'code') {
                currentMode = 'chat';
                btnMode.textContent = '💬';
                btnMode.className = 'btn-mode active-chat';
                setPanelTitle('chat');
                btnRunCode.disabled = true;
            } else {
                currentMode = 'code';
                btnMode.textContent = '📦';
                btnMode.className = 'btn-mode active-code';
                setPanelTitle('code');
                btnRunCode.disabled = (totalVersions === 0 && !getCode());
            }
        }

        // ============================================================
        // 提交状态切换
        // ============================================================
        function toggleSubmit() {
            if (submitState === 'normal') {
                submitState = 'submit';
                btnSubmit.textContent = '✅';
                btnSubmit.className = 'btn-submit active-submit';
                showToast('📌 已标记为"待提交"');
            } else {
                submitState = 'normal';
                btnSubmit.textContent = '📋';
                btnSubmit.className = 'btn-submit active-normal';
                showToast('📤 已切换为"普通发送"');
            }
        }

        // ============================================================
        // 发送核心逻辑
        // ============================================================
        async function handleSend() {
            if (isRunning) return;

            const content = getInstruction();
            if (!content) {
                showToast('⚠️ 请输入内容');
                return;
            }

            const mode = currentMode;
            const isSubmit = (submitState === 'submit');

            isRunning = true;
            btnSendBar.disabled = true;
            btnRunCode.disabled = true;
            setStatus('处理中...', 'idle');
            setElapsed(0);

            try {
                let resp, data;

                if (isSubmit) {
                    const code = getCode();
                    const log = getLog();

                    if (mode === 'chat') {
                        resp = await fetch('/api/fix', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                code: code,
                                log: log,
                                instruction: content,
                                mode: 'chat'
                            })
                        });
                        data = await resp.json();
                        if (data.success) {
                            setCode(data.content || '');
                            setLog('');
                            setStatus('💬 已回复', 'chat');
                            setElapsed(0);
                            setPanelTitle('chat');
                            btnRunCode.disabled = true;
                        }
                    } else {
                        if (!code) {
                            alert('代码不能为空');
                            isRunning = false;
                            btnSendBar.disabled = false;
                            btnRunCode.disabled = false;
                            return;
                        }
                        resp = await fetch('/api/fix', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                code: code,
                                log: log,
                                instruction: content,
                                mode: 'code'
                            })
                        });
                        data = await resp.json();
                        if (data.success) {
                            currentVersion = data.version;
                            totalVersions = data.total_versions;
                            setCode(data.code || '');
                            setLog(data.log || '');
                            setStatus(getStatusText(data.status), data.status);
                            setElapsed(data.elapsed_ms);
                            setPanelTitle('code');
                            updateVersionDisplay();
                            btnRunCode.disabled = false;
                            loadFileList();
                        }
                    }
                } else {
                    resp = await fetch('/api/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: mode, content: content })
                    });
                    data = await resp.json();

                    if (data.success) {
                        if (data.mode === 'chat') {
                            setCode(data.content || '');
                            setLog('');
                            setStatus('💬 已回复', 'chat');
                            setElapsed(0);
                            setPanelTitle('chat');
                            btnRunCode.disabled = true;
                        } else {
                            currentVersion = data.version;
                            totalVersions = data.total_versions;
                            setCode(data.code || '');
                            setLog(data.log || '');
                            setStatus(getStatusText(data.status), data.status);
                            setElapsed(data.elapsed_ms);
                            setPanelTitle('code');
                            updateVersionDisplay();
                            btnRunCode.disabled = false;
                            loadFileList();
                        }
                    }
                }

                if (!data || !data.success) {
                    alert('请求失败: ' + (data?.error || '未知错误'));
                } else {
                    clearInstruction();
                    if (submitState === 'submit') {
                        submitState = 'normal';
                        btnSubmit.textContent = '📋';
                        btnSubmit.className = 'btn-submit active-normal';
                    }
                }

            } catch (e) {
                alert('请求失败: ' + e.message);
            } finally {
                isRunning = false;
                btnSendBar.disabled = false;
                btnRunCode.disabled = (currentMode === 'chat' || (totalVersions === 0 && !getCode()));
            }
        }

        // ============================================================
        // 代码框「运行」按钮
        // ============================================================
        async function handleRunCode() {
            if (isRunning) return;
            if (currentMode === 'chat') {
                showToast('⚠️ 聊天模式不支持运行代码');
                return;
            }

            const code = getCode();
            if (!code) {
                alert('代码不能为空');
                return;
            }

            isRunning = true;
            btnSendBar.disabled = true;
            btnRunCode.disabled = true;
            btnRunCode.textContent = '⏳...';
            setStatus('运行中...', 'idle');
            setElapsed(0);

            try {
                const resp = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await resp.json();

                if (data.success) {
                    currentVersion = data.version;
                    totalVersions = data.total_versions;
                    setCode(data.code || '');
                    setLog(data.log || '');
                    setStatus(getStatusText(data.status), data.status);
                    setElapsed(data.elapsed_ms);
                    setPanelTitle('code');
                    updateVersionDisplay();
                    btnRunCode.disabled = false;
                    loadFileList();
                } else {
                    alert('运行失败: ' + data.error);
                }
            } catch (e) {
                alert('请求失败: ' + e.message);
            } finally {
                isRunning = false;
                btnSendBar.disabled = false;
                btnRunCode.textContent = '▶ 运行';
                btnRunCode.disabled = (currentMode === 'chat' || (totalVersions === 0 && !getCode()));
            }
        }

        // ============================================================
        // 状态文本
        // ============================================================
        function getStatusText(status) {
            const map = {
                'success': '✅ 成功',
                'error': '❌ 报错',
                'timeout': '⏰ 超时',
                'idle': '就绪',
                'chat': '💬 聊天',
                'unknown': '未知'
            };
            return map[status] || status;
        }

        // ============================================================
        // 背景要求
        // ============================================================
        async function loadContext() {
            try {
                const resp = await fetch('/api/context');
                const data = await resp.json();
                if (data.success) contextEditor.value = data.content || '';
            } catch (e) { console.error(e); }
        }

        async function saveContext() {
            try {
                const resp = await fetch('/api/context', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: getContext() })
                });
                const data = await resp.json();
                if (data.success) showToast('💾 背景要求已保存');
            } catch (e) { alert('保存失败: ' + e.message); }
        }

        // ============================================================
        // 文件列表
        // ============================================================
        async function loadFileList() {
            try {
                const resp = await fetch('/api/files');
                const data = await resp.json();
                if (data.success) renderFileList(data.files || []);
            } catch (e) { console.error(e); }
        }

        function renderFileList(files) {
            fileList.innerHTML = '';
            fileCount.textContent = files.length > 0 ? `${files.length} 个文件` : '';
            if (files.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'file-empty';
                empty.textContent = '暂无文件';
                fileList.appendChild(empty);
                return;
            }
            files.forEach(name => {
                const item = document.createElement('div');
                item.className = 'file-item';
                const isCode = name.startsWith('main_v');
                const isLog = name.startsWith('log_v');
                const icon = isCode ? '📄' : isLog ? '📋' : '📎';
                const size = name.length * 2;
                const leftSpan = document.createElement('span');
                leftSpan.innerHTML = `<span class="file-icon">${icon}</span> ${name}`;
                const rightSpan = document.createElement('span');
                rightSpan.className = 'file-size';
                rightSpan.textContent = formatFileSize(size);
                item.appendChild(leftSpan);
                item.appendChild(rightSpan);
                if (isCode && name === `main_v${currentVersion}.py`) item.classList.add('active-code');
                if (isLog && name === `log_v${currentVersion}.txt`) item.classList.add('active-log');
                item.onclick = () => handleFileClick(name);
                fileList.appendChild(item);
            });
        }

        async function handleFileClick(filename) {
            try {
                const resp = await fetch(`/api/file/${filename}`);
                const data = await resp.json();
                if (!data.success) { showToast('⚠️ ' + data.error); return; }
                const content = data.content || '';
                if (filename.startsWith('main_v')) {
                    setCode(content);
                    const match = filename.match(/_v(\d+)\.py$/);
                    if (match) {
                        const v = parseInt(match[1]);
                        if (v >= 1 && v <= totalVersions) {
                            currentVersion = v;
                            setPanelTitle('code');
                            updateVersionDisplay();
                            try {
                                const logResp = await fetch(`/api/file/log_v${v}.txt`);
                                const logData = await logResp.json();
                                if (logData.success) setLog(logData.content || '');
                            } catch (e) {}
                        }
                    }
                    loadFileList();
                } else if (filename.startsWith('log_v')) {
                    setLog(content);
                    loadFileList();
                } else {
                    setCode(content);
                }
            } catch (e) { showToast('⚠️ 加载文件失败'); }
        }

        // ============================================================
        // 加载状态和版本
        // ============================================================
        async function loadStatus() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();
                if (data.success) {
                    totalVersions = data.total_versions;
                    if (data.project) {
                        currentProject = data.project;
                        currentProjectName.textContent = currentProject + '/';
                    }
                    if (totalVersions > 0) {
                        currentVersion = totalVersions;
                        await loadVersion(currentVersion);
                    } else {
                        currentVersion = 0;
                        renderEmpty();
                    }
                    updateVersionDisplay();
                }
            } catch (e) { console.error(e); }
        }

        async function loadVersion(v) {
            try {
                const resp = await fetch(`/api/version/${v}`);
                const data = await resp.json();
                if (data.success) {
                    currentVersion = data.version;
                    setCode(data.code || '');
                    setLog(data.log || '');
                    setStatus(getStatusText(data.status), data.status);
                    setPanelTitle('code');
                    updateVersionDisplay();
                    btnRunCode.disabled = false;
                    loadFileList();
                } else {
                    showToast('⚠️ ' + data.error);
                }
            } catch (e) { showToast('⚠️ 加载版本失败'); }
        }

        // ============================================================
        // 翻页
        // ============================================================
        async function prevVersion() {
            if (currentVersion <= 1) { showToast('已是最早版本'); return; }
            await loadVersion(currentVersion - 1);
        }

        async function nextVersion() {
            if (currentVersion >= totalVersions) { showToast('已是最新版本'); return; }
            await loadVersion(currentVersion + 1);
        }

        // ============================================================
        // 键盘
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.target.id === 'instructionInput' && e.key === 'Enter') {
                e.preventDefault();
                if (!btnSendBar.disabled) handleSend();
                return;
            }
            if (e.target.closest('.CodeMirror')) return;
            if (['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') { e.preventDefault();
                prevVersion(); }
            if (e.key === 'ArrowRight') { e.preventDefault();
                nextVersion(); }
            if (e.key === 'Escape') {
                if (projectDropdown.classList.contains('open')) {
                    toggleProjectDropdown();
                }
                if (createProjectModal.classList.contains('open')) {
                    closeCreateProjectModal();
                }
            }
        });

        // ============================================================
        // 启动
        // ============================================================
        async function init() {
            await loadProjects();
            await loadContext();
            await loadStatus();
            await loadFileList();
            setStatus('就绪', 'idle');
            btnMode.textContent = '📦';
            btnMode.className = 'btn-mode active-code';
            btnSubmit.textContent = '📋';
            btnSubmit.className = 'btn-submit active-normal';
            setPanelTitle('code');
            setTimeout(refreshEditor, 200);
        }
        init();
    </script>

</body>
</html>
