<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humans · Multi-Field · 多重场域心智网络</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary: #f6b07c;
            --primary-dark: #d4845a;
            --primary-light: #f5cba0;
            --primary-transparent: rgba(246, 176, 124, 0.1);
            --bg-primary: #0e0b0a;
            --bg-secondary: #1a1412;
            --bg-tertiary: #221c19;
            --text-primary: #e4d7cf;
            --text-secondary: #c4b4a8;
            --text-tertiary: #a28c7c;
            --border-color: #3a2c24;
            --error-color: #f58b7a;
            --success-color: #eab676;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        html,body {
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(246, 176, 124, 0.06) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(212, 132, 90, 0.04) 0%, transparent 40%);
            z-index: 0;
        }
        
        .login-container {
            display: flex;
            width: 800px;
            height: 480px;
            background: var(--bg-secondary);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(246, 176, 124, 0.15);
            box-shadow: 
                0 0 0 1px rgba(246, 176, 124, 0.08),
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(246, 176, 124, 0.06);
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            background: transparent;
            pointer-events: none;
            z-index: 2;
        }
        
        .logo-section {
            flex: 0 0 61.8%;
            background: linear-gradient(135deg, rgba(14, 11, 10, 0.97), rgba(26, 20, 18, 0.97));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(246, 176, 124, 0.1);
        }
        
        .logo-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(246, 176, 124, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212, 132, 90, 0.04) 0%, transparent 50%);
            z-index: 0;
        }
        
        .logo-section::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(246, 176, 124, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -70px;
            z-index: 0;
        }
        
        .logo-container {
            position: relative;
            margin-bottom: 20px;
            z-index: 1;
        }
        
        .logo-outer-ring {
            width: 120px;
            height: 120px;
            border: 2px solid rgba(246, 176, 124, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: rotateSlow 20s linear infinite;
        }
        
        .logo-outer-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }
        
        .logo-inner-ring {
            width: 90px;
            height: 90px;
            border: 2px solid rgba(246, 176, 124, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .logo-inner-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-bottom: 2px solid var(--primary);
            border-radius: 50%;
            animation: rotateReverse 2s linear infinite;
        }
        
        .logo-core {
            width: 60px;
            height: 60px;
            background: rgba(246, 176, 124, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 0 0 15px rgba(246, 176, 124, 0.18),
                0 0 35px rgba(246, 176, 124, 0.2);
            border: 1px solid rgba(246, 176, 124, 0.25);
            position: relative;
        }
        
        .clock-center {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            z-index: 4;
            box-shadow: 0 0 10px rgba(246, 176, 124, 0.9);
        }
        
        .hour-hand {
            position: absolute;
            width: 4px;
            height: 16px;
            background: var(--primary);
            top: 14px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 2;
            animation: rotateHour 8s linear infinite;
            box-shadow: 0 0 8px rgba(246, 176, 124, 0.7);
        }
        
        .minute-hand {
            position: absolute;
            width: 3px;
            height: 24px;
            background: var(--primary-light);
            top: 8px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 3;
            animation: rotateMinute 4s linear infinite;
            box-shadow: 0 0 8px rgba(245, 203, 160, 0.7);
        }
        
        .second-hand {
            position: absolute;
            width: 2px;
            height: 26px;
            background: #e4d7cf;
            top: 6px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 1px;
            z-index: 1;
            animation: rotateSecond 2s linear infinite;
            opacity: 0.8;
        }
        
        .logo-core i {
            display: none;
        }
        
        .logo-text {
            font-size: 42px;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 2px;
            z-index: 1;
            text-shadow: 
                0 0 20px rgba(246, 176, 124, 0.25),
                0 0 40px rgba(246, 176, 124, 0.1);
            display: flex;
            align-items: baseline;
            justify-content: center;
            position: relative;
        }
        
        .logo-text .ml-part {
            background: linear-gradient(135deg, #e4d7cf 0%, #f5cba0 30%, #f6b07c 70%, #d4845a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 42px;
            font-weight: 400;
            letter-spacing: -1px;
            position: relative;
            top: 0;
            text-shadow: 
                0 0 15px rgba(246, 176, 124, 0.6),
                0 0 30px rgba(246, 176, 124, 0.25),
                0 0 45px rgba(246, 176, 124, 0.1);
            filter: brightness(1.1);
        }
        
        .logo-text .survx-part {
            background: linear-gradient(135deg, #f5cba0 0%, #f6b07c 30%, #d4845a 70%, #c07a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 42px;
            font-weight: 400;
            position: relative;
            top: 0;
            letter-spacing: 0;
            text-shadow: 
                0 0 12px rgba(246, 176, 124, 0.4),
                0 0 25px rgba(246, 176, 124, 0.15);
        }
        
        .logo-subtext {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.6;
            max-width: 320px;
            z-index: 1;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .left-footer {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 12px;
            z-index: 2;
            font-weight: 300;
        }
        
        .login-section {
            flex: 0 0 38.2%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 25px;
            background: var(--bg-tertiary);
            z-index: 1;
            position: relative;
        }
        
        .close-btn-login {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            background: transparent;
            border: none;
            border-radius: 50%;
            color: var(--text-tertiary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .close-btn-login:hover {
            background: rgba(245, 139, 122, 0.15);
            color: #f58b7a;
            transform: scale(1.1);
        }
        
        .close-btn-login:active {
            transform: scale(0.95);
        }
        
        .login-header {
            margin-bottom: 20px;
            padding-top: 5px;
            text-align: center;
        }
        
        .login-title {
            font-size: 26px;
            font-weight: 300;
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .login-title-welcome {
            color: var(--text-primary);
            font-size: 20px;
            margin-right: 6px;
            position: relative;
            top: 2px;
            font-weight: 300;
        }
        
        .login-title-q {
            color: var(--text-primary);
            font-size: 22px;
            position: relative;
            top: 2px;
            font-weight: 300;
            letter-spacing: 0px;
        }
        
        .login-title-rest {
            color: var(--text-primary);
            font-size: 22px;
            position: relative;
            top: 2px;
            font-weight: 300;
            letter-spacing: 0px;
        }
        
        .login-header p {
            color: var(--text-tertiary);
            font-size: 12px;
            line-height: 1.4;
            font-weight: 300;
            text-align: center;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        
        .input-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 14px;
            z-index: 2;
        }
        
        .input-group input {
            width: 100%;
            padding: 11px 11px 11px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            position: relative;
            z-index: 1;
            font-weight: 300;
        }
        
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 
                0 0 0 2px rgba(246, 176, 124, 0.15),
                inset 0 0 8px rgba(246, 176, 124, 0.08);
            outline: none;
            background: rgba(255, 255, 255, 0.06);
        }
        
        .input-group input::placeholder {
            color: var(--text-tertiary);
            font-weight: 300;
        }
        
        .options-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-weight: 300;
        }
        
        .option-item input {
            accent-color: var(--primary);
            width: 14px;
            height: 14px;
        }
        
        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 300;
            transition: all 0.3s;
            font-size: 13px;
        }
        
        .forgot-password:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }
        
        .login-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #1a1412;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 18px;
            box-shadow: 
                0 4px 15px rgba(246, 176, 124, 0.25),
                0 0 25px rgba(246, 176, 124, 0.08);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            width: 100%;
        }
        
        .login-btn:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            transform: translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(246, 176, 124, 0.35),
                0 0 30px rgba(246, 176, 124, 0.15);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.7s;
        }
        
        .login-btn:hover::after {
            left: 100%;
        }
        
        .bottom-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .bottom-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 300;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        .bottom-link:hover {
            color: var(--primary-light);
            background: rgba(246, 176, 124, 0.08);
            text-decoration: underline;
        }
        
        .link-separator {
            color: var(--text-tertiary);
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
            font-weight: 300;
        }
        
        .status-message {
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
            text-align: center;
            font-weight: 300;
        }
        
        .status-success {
            background: rgba(234, 182, 118, 0.08);
            color: var(--success-color);
            border: 1px solid rgba(234, 182, 118, 0.2);
        }
        
        .status-error {
            background: rgba(245, 139, 122, 0.08);
            color: var(--error-color);
            border: 1px solid rgba(245, 139, 122, 0.2);
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes rotateReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes rotateHour {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        @keyframes rotateMinute {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        @keyframes rotateSecond {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(26, 20, 18, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-right: 6px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-outer-ring">
                    <div class="logo-inner-ring">
                        <div class="logo-core">
                            <div class="hour-hand"></div>
                            <div class="minute-hand"></div>
                            <div class="second-hand"></div>
                            <div class="clock-center"></div>
                            <i class="fas fa-chart-line" style="display: none;"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="logo-text">
                <span class="ml-part">Hu</span>
                <span class="survx-part">mans</span>
            </div>
            <div class="logo-subtext">
                智能体生存仿真
            </div>
            
            <div class="left-footer">
                &copy; 2026 Humans · Multi-Field | v1.0
            </div>
        </div>
        
        <div class="login-section">
            <button class="close-btn-login" id="closeWindowBtn" title="关闭窗口">
                <i class="fas fa-times"></i>
            </button>
            
            <div class="login-header">
                <div class="login-title">
                    <span class="login-title-welcome">欢迎登录</span>
                    <span class="login-title-q">Hu</span>
                    <span class="login-title-rest">mans</span>
                </div>
                <p>请输入凭据进入心智网络</p>
            </div>
            
            <div class="status-message" id="statusMessage"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="用户名 / 邮箱" required>
                    <div class="error-message" id="username-error"></div>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="登录密码" required>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <div class="options-container">
                    <div class="option-item">
                        <input type="checkbox" id="rememberPassword">
                        <label for="rememberPassword">记住密码</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="autoLogin">
                        <label for="autoLogin">自动登录</label>
                    </div>
                    <a href="#" class="forgot-password">忘记密码</a>
                </div>
                
                <button type="submit" class="login-btn" id="loginButton">
                    <div class="btn-content">
                        <div class="loader" id="loader"></div>
                        <span id="buttonText">登录系统</span>
                    </div>
                </button>
                
                <div class="bottom-links">
                    <a href="#" class="bottom-link" id="applyAccount">申请账号</a>
                    <span class="link-separator">|</span>
                    <a href="#" class="bottom-link" id="contactUs">联系我们</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            window.addEventListener('pywebviewready', function() {
                        console.log('PyWebView API 现在可用');
                        checkSavedCredentials();
                        });
            
            const applyAccountLink = document.getElementById('applyAccount');
            const contactUsLink = document.getElementById('contactUs');
            
            applyAccountLink.addEventListener('click', function(e) {
                e.preventDefault();
                showStatusMessage('正在打开账号申请页面...', 'success');
                setTimeout(() => {
                    alert('账号申请\n\n请访问 Humans 官方网站填写申请表格。\n邮箱: hello@humans.io');
                }, 500);
            });
            
            contactUsLink.addEventListener('click', function(e) {
                e.preventDefault();
                showStatusMessage('正在加载联系方式...', 'success');
                setTimeout(() => {
                    alert('联系我们\n\n技术支持: dev@humans.io\n官方网站: www.humans.io');
                }, 500);
            });
            
            const forgotPasswordLink = document.querySelector('.forgot-password');
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                const email = prompt('请输入您的注册邮箱以重置密码：');
                if (email && validateEmail(email)) {
                    showStatusMessage(`密码重置链接已发送到 ${email}`, 'success');
                } else if (email) {
                    showStatusMessage('请输入有效的邮箱地址', 'error');
                }
            });
            
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loader = document.getElementById('loader');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            const statusMessage = document.getElementById('statusMessage');
            const rememberPassword = document.getElementById('rememberPassword');
            const autoLogin = document.getElementById('autoLogin');
            
            autoLogin.addEventListener('change', function() {
                if (this.checked) {
                    rememberPassword.checked = true;
                }
            });
            
            rememberPassword.addEventListener('change', function() {
                if (!this.checked) {
                    autoLogin.checked = false;
                }
            });
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberPwd = rememberPassword.checked;
                const autoLoginChecked = autoLogin.checked;
                
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
                
                let isValid = true;
                
                if (!username) {
                    usernameError.textContent = '请输入用户名或邮箱地址';
                    usernameError.style.display = 'block';
                    isValid = false;
                } else if (!validateEmail(username) && username.length < 3) {
                    usernameError.textContent = '用户名至少3个字符或使用有效邮箱';
                    usernameError.style.display = 'block';
                    isValid = false;
                }
                
                if (!password) {
                    passwordError.textContent = '请输入登录密码';
                    passwordError.style.display = 'block';
                    isValid = false;
                } else if (password.length < 6) {
                    passwordError.textContent = '密码长度至少6个字符';
                    passwordError.style.display = 'block';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                buttonText.textContent = '正在验证身份...';
                loader.style.display = 'block';
                loginButton.disabled = true;
                
                if (window.pywebview && window.pywebview.api) {
                    const userData = {
                        username: username,
                        password: password,
                        rememberPassword: rememberPwd,
                        autoLogin: autoLoginChecked
                    };
                    
                    pywebview.api.login(userData)
                        .then(response => {
                            if (response.success) {
                                buttonText.textContent = '验证通过！';
                                loginButton.style.background = 'linear-gradient(135deg, #f6b07c, #d4845a)';
                                showStatusMessage('登录成功！正在进入心智网络...', 'success');
                                
                                setTimeout(() => {
                                    if (window.pywebview && window.pywebview.api.load_main_page) {                                        
                                        pywebview.api.load_main_page().then(function(response) {
                                            console.log("API响应:", response);
                                        }).catch(function(error) {
                                            console.error("API调用错误:", error);
                                        });
                                    }
                                }, 1500);
                            } else {
                                buttonText.textContent = '身份验证失败';
                                passwordError.textContent = response.message || '用户名或密码错误，请重试';
                                passwordError.style.display = 'block';
                                loginButton.style.background = 'linear-gradient(135deg, #f58b7a, #cc6a5a)';
                                showStatusMessage(response.message || '身份验证失败，请检查您的凭据', 'error');
                                setTimeout(() => {
                                    resetLoginButton();
                                }, 2000);
                            }
                        })
                        .catch(error => {
                            console.error('登录请求失败:', error);
                            buttonText.textContent = '连接失败';
                            showStatusMessage('无法连接到心智网络，请检查网络', 'error');
                            loginButton.style.background = 'linear-gradient(135deg, #f58b7a, #cc6a5a)';
                            setTimeout(() => {
                                resetLoginButton();
                            }, 2000);
                        });
                } else {
                    setTimeout(() => {
                        const mockUsers = [
                            {username: 'admin', password: 'admin123'},
                            {username: 'humans', password: 'humans2026'},
                            {username: 'hello@humans.io', password: 'welcome123'},
                            {username: 'dev', password: 'dev2026'}
                        ];
                        
                        const user = mockUsers.find(u => 
                            (u.username === username) && u.password === password
                        );
                        
                        if (user) {
                            buttonText.textContent = '验证通过！';
                            loginButton.style.background = 'linear-gradient(135deg, #f6b07c, #d4845a)';
                            showStatusMessage('登录成功！演示模式', 'success');
                            setTimeout(() => {
                                alert(`演示模式：欢迎 ${username}！\n\n即将进入 Humans 心智网络。`);
                                resetLoginForm();
                            }, 1500);
                        } else {
                            buttonText.textContent = '身份验证失败';
                            passwordError.textContent = '用户名或密码错误，请重试';
                            passwordError.style.display = 'block';
                            loginButton.style.background = 'linear-gradient(135deg, #f58b7a, #cc6a5a)';
                            showStatusMessage('身份验证失败，请检查您的凭据', 'error');
                            setTimeout(() => {
                                resetLoginButton();
                            }, 2000);
                        }
                    }, 1500);
                }
            });
            
            function checkSavedCredentials() {
                if (window.pywebview && window.pywebview.api.get_saved_credentials) {
                    pywebview.api.get_saved_credentials()
                        .then(credentials => {
                            if (credentials.has_saved) {
                                document.getElementById('username').value = credentials.username || '';
                                document.getElementById('password').value = credentials.password || '';
                                if (credentials.rememberPassword) rememberPassword.checked = true;
                                if (credentials.autoLogin) autoLogin.checked = true;
                                if (credentials.autoLogin && credentials.password) {
                                    setTimeout(() => {
                                        loginForm.dispatchEvent(new Event('submit'));
                                    }, 3000);
                                } else if (credentials.username) {
                                    showStatusMessage(`欢迎 ${credentials.username}，请点击登录`, 'success');
                                }
                            }
                        })
                        .catch(error => console.error('获取保存的凭证失败:', error));
                }
            }
            
            function clearSavedCredentials() {
                if (confirm('确定要清除所有保存的登录凭证吗？')) {
                    if (window.pywebview && window.pywebview.api.clear_saved_credentials) {
                        pywebview.api.clear_saved_credentials()
                            .then(response => {
                                if (response.success) {
                                    showStatusMessage('已清除所有保存的登录凭证', 'success');
                                    document.getElementById('username').value = '';
                                    document.getElementById('password').value = '';
                                    rememberPassword.checked = false;
                                    autoLogin.checked = false;
                                } else {
                                    showStatusMessage('清除凭证失败', 'error');
                                }
                            })
                            .catch(error => {
                                console.error('清除凭证失败:', error);
                                showStatusMessage('清除凭证失败', 'error');
                            });
                    }
                }
            }
            
            let clearTimer;
            forgotPasswordLink.addEventListener('mousedown', function(e) {
                e.preventDefault();
                clearTimer = setTimeout(() => {
                    clearSavedCredentials();
                }, 3000);
            });
            
            forgotPasswordLink.addEventListener('mouseup', function(e) { clearTimeout(clearTimer); });
            forgotPasswordLink.addEventListener('mouseleave', function(e) { clearTimeout(clearTimer); });
            
            function showStatusMessage(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = 'status-message';
                statusMessage.classList.add(`status-${type}`);
                statusMessage.style.display = 'block';
                setTimeout(() => {
                    if (statusMessage.textContent === message) statusMessage.style.display = 'none';
                }, 5000);
            }
            
            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            function resetLoginButton() {
                buttonText.textContent = '登录系统';
                loader.style.display = 'none';
                loginButton.disabled = false;
                loginButton.style.background = 'linear-gradient(135deg, #f6b07c, #d4845a)';
            }
            
            function resetLoginForm() {
                resetLoginButton();
                document.getElementById('password').value = '';
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
            }
            
            document.getElementById('username').addEventListener('input', function() {
                usernameError.style.display = 'none';
                statusMessage.style.display = 'none';
            });
            
            document.getElementById('password').addEventListener('input', function() {
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
            });
            
            if (window.pywebview && window.pywebview.api) {
                console.log('pywebview API已检测到 - Humans心智网络已就绪');
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') loginButton.click();
                if (e.key === 'F1') {
                    e.preventDefault();
                    alert('Humans 登录帮助:\n\n1. 输入您的凭据\n2. 点击登录或Ctrl+Enter\n3. 长按"忘记密码"3秒清除所有保存的凭证');
                }
                if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                    e.preventDefault();
                    clearSavedCredentials();
                }
            });
            
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() { this.parentElement.style.transform = 'scale(1.02)'; });
                input.addEventListener('blur', function() { this.parentElement.style.transform = 'scale(1)'; });
            });
            
            const mlPart = document.querySelector('.ml-part');
            let breathDirection = 1;
            let breathValue = 0;
            function animateBreath() {
                breathValue += 0.02 * breathDirection;
                if (breathValue >= 0.3) breathDirection = -1;
                if (breathValue <= 0) breathDirection = 1;
                mlPart.style.textShadow = `
                    0 0 ${12 + breathValue * 8}px rgba(246, 176, 124, ${0.5 + breathValue}),
                    0 0 ${25 + breathValue * 15}px rgba(246, 176, 124, ${0.2 + breathValue * 0.5})
                `;
                requestAnimationFrame(animateBreath);
            }
            animateBreath();
            
            document.getElementById('closeWindowBtn').addEventListener('click', () => {
                if (typeof pywebview !== 'undefined') {
                    pywebview.api.close_window();
                } else {
                    console.log('关闭窗口');
                }
            }); 
        });
    </script>
</body>
</html>
