<!DOCTYPE html>
<html lang="zh-CN">
	<head type="text/javascript">
		<meta	http-equiv="Content-Type"	content="text/html;	charset=utf-8">
		<link	type="text/css"	rel="stylesheet"	href="./css/smartMenu.css"/>
		<script	type="text/javascript"	src="./js/jquery.min.js"></script>
		<script	type="text/javascript"	src="./js/jquery-smartMenu.js"></script>
		<script src="js/jsplumb.min.js"></script>
		<style type="text/css">
			:root {
				--primary: #F5A623;
				--primary-dark: #E09515;
				--primary-light: #FFB84D;
				--primary-transparent: rgba(245, 166, 35, 0.12);
				--primary-glow: rgba(245, 166, 35, 0.35);
				--bg-primary: #0B0B0B;
				--bg-secondary: #151515;
				--bg-tertiary: #202020;
				--text-primary: #FFFFFF;
				--text-secondary: #FFD89C;
				--text-tertiary: #A0A0A0;
				--border-color: #2E2E2E;
				--error-color: #FF6B6B;
				--success-color: #F5A623;
				--warning-yellow: #F5A623;
			}

			html,body
			{
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				font-weight:400;
				font-size:14px;
				line-height:1.3em;
				width:100%;
				height:100%;
				color: var(--text-secondary);
				background: var(--bg-primary);
				margin:0;
				padding:0;
				overflow-x:auto;
				position: relative;
			}

			body::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: 
					radial-gradient(circle at 20% 30%, rgba(245, 166, 35, 0.06) 0%, transparent 45%),
					radial-gradient(circle at 85% 70%, rgba(245, 166, 35, 0.04) 0%, transparent 45%);
				z-index: 0;
				pointer-events: none;
			}

			/*定义滚动条高宽及背景 高宽分别对应横竖滚动条的尺寸*/  
			::-webkit-scrollbar  
			{  
			    width: 0px;  
			    height: 0px;  
			    background-color: var(--bg-primary);  
			}  
			/*定义滚动条轨道 内阴影+圆角*/  
			::-webkit-scrollbar-track  
			{  
			    border-radius: 0px;  
			    background-color: #3C3C3C;  
			}  
			/*定义滑块 内阴影+圆角*/  
			::-webkit-scrollbar-thumb  
			{  
			    border-radius: 0px;  
			    background-color: var(--primary);  
			} 
			#mq_main
			{
				width:100%;
				position:absolute;
				top:0px;
				bottom:0px;
				box-sizing:border-box;
				z-index: 1;
			}
			#mq_mainL
			{
				display:flex;
				flex-direction:column;
				float:left;
				height:100%;
				width:50%;
				box-sizing:border-box;
			}
			#mq_mainR
			{
				float:left;
				height:100%;
				width:50%;
				padding-top:45px;
				padding-left:20px;
				padding-right:20px;
				box-sizing:border-box;
			}
			@keyframes changeColor {
  			0% { background-color: #FF4444; }
  			50% { background-color: transparent; }
  			100% { background-color: #FF4444; }
			}
			#mq_notes
			{
				height:100%;
				width:100%;
				padding:20px;
				background: rgba(245, 166, 35, 0.08);
				box-sizing:border-box;
				border-radius:15px;
				overflow:auto;
				border: 1px solid rgba(245, 166, 35, 0.2);
			}
			table.altrowstable
			{
				border:1px	var(--primary) solid;
				border-collapse:collapse;
				padding:0;
				width:95%;
				table-layout:fixed;
				box-sizing:border-box;
				background: #111;
			}
			table.altrowstable	th
			{
				border:1px	var(--primary) solid;
				text-align:center;
				background: #222;
				color: #FFD58C;
				font-weight: 550;
				padding: 6px;
			}
			table.altrowstable	td
			{
				border:1px #2b2b2b solid;
				text-align:left;
				white-space:pre-line;
				word-break:keep-all;
				padding:6px;
				word-wrap:break-word;
				color: #C0C0C0;
			}
			.xTar:hover,.xTar_:hover
			{
				cursor:pointer !important;
				background-color: rgba(245, 166, 35, 0.15) !important;
			}
				
			.MList
			{
				width:50px;
				height:38px;
				border:1px solid #FFFF00;
				color:#FFFF00;
				border-radius:5px;
				box-sizing:border-box;
				text-align:center;
				line-height:38px;
				overflow:hidden;
				padding-left:3px;
				padding-right:3px;
				float:left;
				margin-top:6px;
				margin-left:6px;
				margin-bottom:3px;
			}	
						
			.MList:hover
			{
				cursor:pointer !important;
				background-color: rgba(245, 166, 35, 0.2) !important;
			}
				
			#mq_mainLT
			{
				height:40px;
				width:100%;
			}
			#mq_mainLB
			{
				margin-top:5px;
				box-sizing:border-box;
				flex-grow:1;
				overflow-y:auto;
				width:100%;
			}

			.subtitle {
				font-size: 1.2rem;
				color: var(--text-tertiary);
				max-width: 800px;
				margin: 0 auto 30px;
				line-height: 1.6;
				text-align: center;
			}
			
			.node {
				position: absolute;
				width: 80px;
				height: 40px;
				color: white;
				border-radius: 8px;
				display: flex;
				align-items: center;
				justify-content: center;
				text-align: center;
				cursor: move;
				z-index: 10;
				user-select: none;
				padding: 8px;
				flex-direction: column;
				border: 1px solid var(--primary);
				background: rgba(15, 15, 15, 0.9);
				transition: all 0.3s;
				box-shadow: 0 0 10px rgba(245, 166, 35, 0.1);
			}
			
			.node:hover {
				transform: translateY(-5px) scale(1.05);
				box-shadow: 0 10px 25px rgba(245, 166, 35, 0.4);
				z-index: 100;
			}
			
			/* 不同形状的节点 */
			.node.data-prep {
				border-color: var(--primary);
				background: rgba(245, 166, 35, 0.1);
				border-radius: 50% 8px 8px 50%;
			}
			
			.node.factor-calc {
				border-color: #FF6B6B;
				background: rgba(255, 107, 107, 0.1);
				border-radius: 8px 8px 0 0;
				clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
			}
			
			.node.strategy {
				border-color: #4ECDC4;
				background: rgba(78, 205, 196, 0.1);
				border-radius: 50%;
				width: 80px;
				height: 80px;
			}
			
			.node.trading {
				border-color: #FFD166;
				background: rgba(255, 209, 102, 0.1);
				border-radius: 8px;
				transform: rotate(45deg);
				width: 80px;
				height: 80px;
			}
			
			.node.trading .node-title,
			.node.trading .node-subtitle {
				transform: rotate(-45deg);
			}
			
			.node.monitoring {
				border-color: #8A2BE2;
				background: rgba(138, 43, 226, 0.1);
				border-radius: 8px 8px 8px 0;
				transform: skewX(-15deg);
			}
			
			.node.monitoring .node-title,
			.node.monitoring .node-subtitle {
				transform: skewX(15deg);
			}
			
			/* 闪烁动画关键帧 */
			@keyframes blink {
				0% { filter: brightness(1); }
				50% { filter: brightness(1.6); }
				100% { filter: brightness(1); }
			}
			
			.node.blink {
				animation: blink 1.5s infinite;
			}
			
			.node-title {
				font-size: 14px;
				font-weight: 700;
				margin-bottom: 3px;
				letter-spacing: 0.5px;
				color: var(--text-primary);
			}
			
			.node-subtitle {
				font-size: 10px;
				font-weight: normal;
				opacity: 0.85;
				line-height: 1.2;
				overflow: hidden;
				text-overflow: ellipsis;
				display: -webkit-box;
				-webkit-line-clamp: 2;
				-webkit-box-orient: vertical;
				max-height: 24px;
				color: var(--text-secondary);
			}
			
			.jtk-connector {
				z-index: 5;
				stroke: var(--primary);
				stroke-width: 2;
			}
			
			.jtk-endpoint {
				z-index: 6;
				fill: var(--primary);
			}
			
			.jtk-hover {
				z-index: 7;
			}
					
			/* 自定义箭头样式 */
			.flow-arrow {
				fill: var(--primary);
				animation: flow 2s infinite linear;
			}
			
			@keyframes flow {
				0% {
					opacity: 0;
					transform: translateX(-10px);
				}
				50% {
					opacity: 1;
				}
				100% {
					opacity: 0;
					transform: translateX(10px);
				}
			}
			
			/* 连接线动画 */
			.animated-connector {
				stroke-dasharray: 10 5;
				animation: dash 1s linear infinite;
			}
			
			@keyframes dash {
				to {
					stroke-dashoffset: -15;
				}
			}
			
			/* 脉冲效果 */
			.pulse {
				animation: pulse 2s infinite;
			}
			
			@keyframes pulse {
				0% {
					r: 4;
					opacity: 1;
				}
				50% {
					r: 6;
					opacity: 0.7;
				}
				100% {
					r: 4;
					opacity: 1;
				}
			}
			
			/* 节点详情面板 */
			.node-detail {
				position: absolute;
				top: 20px;
				right: 20px;
				width: 350px;
				background: rgba(18, 18, 20, 0.96);
				border-radius: 12px;
				padding: 25px;
				box-shadow: 0 0 25px rgba(245, 166, 35, 0.3);
				z-index: 1000;
				border: 1px solid rgba(245, 166, 35, 0.25);
				backdrop-filter: blur(10px);
				transform: translateY(-20px);
				opacity: 0;
				transition: all 0.4s ease;
			}
			
			.node-detail.active {
				transform: translateY(0);
				opacity: 1;
			}
			
			.detail-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 20px;
				padding-bottom: 15px;
				border-bottom: 1px solid rgba(245, 166, 35, 0.25);
			}
			
			.detail-title {
				font-size: 22px;
				font-weight: 700;
				color: var(--primary-light);
				text-shadow: 0 0 10px rgba(245, 166, 35, 0.3);
			}
			
			.close-detail {
				background: none;
				border: none;
				color: var(--text-tertiary);
				font-size: 24px;
				cursor: pointer;
				transition: all 0.3s;
				width: 36px;
				height: 36px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 50%;
			}
			
			.close-detail:hover {
				background: rgba(255, 68, 68, 0.15);
				color: #ff6b6b;
			}
			
			.detail-content {
				line-height: 1.7;
			}
			
			.detail-item {
				margin-bottom: 15px;
			}
			
			.detail-label {
				font-weight: 600;
				color: var(--text-tertiary);
				margin-bottom: 5px;
				display: block;
			}
			
			.detail-value {
				color: var(--text-primary);
				font-size: 16px;
			}
		</style>
	</head>
	<body>
		<div id="mq_main">
			<div id="mq_mainL">
				<div id="mq_mainLT">
					<center>
					<div class="MList" style="top:40px;color:#00FF00;"  id="Go">运行</div>
					<div class="MList" style="top:79px;color:#FF0000;"  id="Stop">停止</div>
					<div class="MList" style="top:40px;color:#FFFF00;"  id="Init">初始</div>
					</center>
				</div>
				<div id="mq_mainLB"></div>
			</div>
			<div id="mq_mainR"><div id="mq_notes"></div>
				
				<div class="chart-container" id="chart-container">
					<!-- 节点详情面板 -->
					<div class="node-detail">
						<div class="detail-header">
							<div class="detail-title">节点详情</div>
							<button class="close-detail">&times;</button>
						</div>
						<div class="detail-content"></div>
					</div>
				</div>
			</div>
		</div>
		<script type="text/javascript"></script>
	</body>
	<script type="text/javascript">
		//server
		var MServer = "http://10.10.98.51/test/sys/";
		//屏蔽右键事件
		document.oncontextmenu=function(){return	false;}
		function trim(str){return str.replace(/(^\s*)|(\s*$)/g,"");}
		//定义右键事件
		function oncontextmenu(){//自定义右键上下文
			var obOK={text:"已完成",func:function(){
			var trid =$(this).attr("id");
			//alert(trid);
			$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch004C.php",
				data:{
					qflag:"contents",
					sflag:"_03",
					trid:trid,
					},
				async:false,
				success: function(data){
					//alert(data);
					contents();
				}
				})
			}
			};
			
			var obGO={text:"运行",func:function(){
					var nid =$(this).attr("id").replace('j_','');
					geti0(nid);
		}
		};
			var mailMenuData = [[obOK]];
			var mailMenuData1 = [[obGO]];
			$(".xTar_").smartMenu(mailMenuData, {
				name: "mail",
				beforeShow: function() {
				$.smartMenu.remove();
				}
			});
			$(".xTar").smartMenu(mailMenuData1, {
				name: "mail",
				beforeShow: function() {
				$.smartMenu.remove();
				}
			});
			}
		//获取目录
		function contents() {
				$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch004C.php",
				data:{
					qflag:"contents",
					sflag:"_04",
					},
				async:false,
				success: function(data){
					$("#mq_mainLB").html(data);
					oncontextmenu();
				}
				})
			}
			
			

		//查询是否完成和是否运行
		function get0 (params) {
				$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch004C.php",
				data:{
					qflag:"contents",
					sflag:"_04_02",
					trid:params,
					},
				async:false,
				success: function(result){
					if(result){
						var result=eval(trim(result));
						si0= parseInt(result[0].si0);
						si1= parseInt(result[0].si1);
					}
				}
			})	
			return [si0,si1];
		}
		
		
		//查询是否完成和是否运行
		function up1 (params) {
					$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch004C.php",
				data:{
					qflag:"contents",
					sflag:"_03_01",
					trid:params,
					},
				async:false,
				//success: function(data){}
				})
				
		}

		nidlist=[];




		let timer0;
		function geti0(nid){
			//alert(nid);
			//alert(nidlist.includes(nid) );
			clearTimeout(timer0);
			console.log(nid);
			$('#j_'+nid).css('animation','changeColor 0.5s infinite');
			if (nid>0){
				var si = get0(nid);
				var si0 =si[0];
				var si1 =si[1];
				var zhxfs_ = $("#zhxfs_"+nid).html();
				if (si0==0){
					if(si1==0 && zhxfs_=="自动"){
							//调用程序
							$.ajax({
								type: "POST",
								url: MServer+"qq/channel/ch004C.php",
								data:{
									qflag:"contents",
									sflag:"_01",
									sid:nid,
									},
								async:true,
								success: function(result){
									//alert(result);
									//if(result){
										//console.log('调用程序');
										//up1(nid);
									//}
								}
							})
      
						}
					else if(si1==1){
						//正在执行
						console.log('正在执行！');	
							}
					timer0 = setTimeout("geti0("+nid+")",10000);//每隔1秒重新调用一次该函数
					}
				else if(si0==1){
					$('#j_'+nid+'_3').css('color','#00FF00').html(1);
					clearTimeout(timer0);
					$('#j_'+nid).css('animation','transparent');
					console.log('已完成！');
					}
			}
		}


		let timer;
		function geti(nid){
			//alert(nid);
			//alert(nidlist.includes(nid) );
			clearTimeout(timer);
			if(nidlist.includes(nid) ){
				console.log(nid);
				$('#j_'+nid).css('animation','changeColor 0.5s infinite');
				if (nid>0){
					var _nid=nid-1;
					$('#j_'+_nid).css('animation','transparent');
					}
					var si = get0(nid);
					var si0 =si[0];
					var si1 =si[1];
					var zhxfs_ = $("#zhxfs_"+nid).html();
					if (si0==0){
						if(si1==0 && zhxfs_=="自动"){
								//调用程序
								$.ajax({
									type: "POST",
									url: MServer+"qq/channel/ch004C.php",
									data:{
										qflag:"contents",
										sflag:"_01",
										sid:nid,
										},
									async:true,
									success: function(result){
										//alert(result);
										//if(result){
											//console.log('调用程序');
											//up1(nid);
										//}
									}
								})

							}
						else if(si1==1){
							//正在执行
							console.log('正在执行！');	
								}
						timer = setTimeout("geti("+nid+")",10000);//每隔1秒重新调用一次该函数
						}
					else if(si0==1){
						$('#j_'+nid+'_3').css('color','#00FF00').html(1);
						var item=nid+1;	
						timer = setTimeout("geti("+item+")",1000);//每隔1秒重新调用一次该函数
						}
			
				}
			else{
				console.log("完成");
			}
		}
		$(document).off('click','#Go').on('click','#Go',function(){
			$(this).prop('disabled', true);
			geti(0);})
		$(document).off('click','#Init').on('click','#Init',function(){
				clearTimeout(timer);
				$.ajax({
					type: "POST",
					url: MServer+"qq/channel/ch004C.php",
					data:{
						qflag:"contents",
						sflag:"_03_02",
						},
					async:false,
					success: function(result){
						if(result){
							location.reload();
						}
					}
				})
			})
		
		$(document).off('click','.xTar').on('click','.xTar',function(){

			var trid =$(this).attr("id");
			//alert(trid);
			$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch004C.php",
				data:{
					qflag:"contents",
					sflag:"_04_03",
					trid:trid,
					},
				async:false,
				success: function(data){
					$("#mq_notes").html(data);
				}
				})
			
			})








				
		// 初始化jsPlumb实例
		const jsPlumbInstance = jsPlumb.getInstance({
			Connector: ["Straight"],
			Anchors: ['Left','Right'],
			Endpoint: ["Dot", { radius: 3 }],
			EndpointStyle: { fill: "#F5A623" },
			PaintStyle: { 
				stroke: "#F5A623", 
				strokeWidth: 1,
				strokeDasharray: "10 5"
			},
			HoverPaintStyle: { stroke: "#FFB84D", strokeWidth: 4 },
			Container: "mq_notes"
		});
		const bias = ($('#chart-container').width()-700-150)*0.5;
		// 节点数据 - 基于您提供的33个量化投资流程节点
		const nodes = [
			{ id: "point0", name: "point0", type: "data-prep", x: bias+10, y: 10, description: "分析前一天估值和策略差异" },
			{ id: "point1", name: "point1", type: "data-prep", x: bias+250, y: 50, description: "更新xt除权数据" },
			{ id: "point2", name: "point2", type: "data-prep", x: bias+400, y: 50, description: "更新xt股票和期货数据" },
			{ id: "point3", name: "point3", type: "data-prep", x: bias+550, y: 50, description: "更新期货数据" },
			{ id: "point4", name: "point4", type: "data-prep", x: bias+700, y: 50, description: "更新股票数据" },
			{ id: "point5", name: "point5", type: "data-prep", x: bias+700, y: 150, description: "通过excel在ifind里抓日数据" },
			{ id: "point6", name: "point6", type: "data-prep", x: bias+550, y: 150, description: "更新excel中ifind数据" },

		function createSingleConnection(config, index) {
			const sourceNode = document.getElementById(config.from);
			const targetNode = document.getElementById(config.to);

			if (!sourceNode || !targetNode) return;

			const conn = {
				id: `conn-${index}`,
				source: config.from,
				target: config.to,
				color: config.color || "#F5A623",
				width: config.width || 2,
				style: config.style || "solid",
				animation: config.animation || "dash",
				arrow: config.arrow !== false,
				anchors: config.anchors
			};

			const connection = jsPlumbInstance.connect({
				source: sourceNode,
				target: targetNode,
				anchors: conn.anchors,
				paintStyle: getConnectionStyle(conn),
				overlays: conn.arrow ? [
					["Custom", { 
						create: function(component) {
							// 创建自定义箭头
							const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
							arrow.setAttribute("points", "0,0 10,5 0,10");
							arrow.setAttribute("class", "flow-arrow");
							arrow.style.fill = conn.color;
							return arrow;
						},
						location: 0.5,
						id: "customArrow"
					}]
				] : []
			});

			connectionObjects.push({
				jsPlumbConnection: connection,
				metadata: conn
			});

			applyConnectionAnimation(connection, conn.animation);
		}

		// 获取连接线样式
		function getConnectionStyle(conn) {
			let dashstyle = "";
			if (conn.style === "dashed") {
				dashstyle = "5 5";
			} else if (conn.style === "dotted") {
				dashstyle = "2 2";
			}
			
			return {
				stroke: conn.color,
				strokeWidth: conn.width,
				strokeDasharray: dashstyle
			};
		}
		
		// 应用连接线动画
		function applyConnectionAnimation(connection, animationType) {
			const connector = connection.connector.canvas;
			if (!connector) return;
			
			// 移除所有动画类
			connector.classList.remove("animated-connector", "pulse");
			
			if (animationType === "dash") {
				connector.classList.add("animated-connector");
			} else if (animationType === "pulse") {
				connector.classList.add("pulse");
			}
		}
