<!DOCTYPE html>
<html lang="zh-CN">
	<head type="text/javascript">
		<meta	http-equiv="Content-Type"	content="text/html;	charset=utf-8">
		<link	type="text/css"	rel="stylesheet"	href="./css/smartMenu.css"/>
		<script	type="text/javascript"	src="./js/jquery.min.js"></script>
		<script	type="text/javascript"	src="./js/jquery-smartMenu.js"></script>
		<style type="text/css">
			:root {
				--primary: #F5A623;
				--primary-dark: #E09515;
				--primary-light: #FFB84D;
				--primary-transparent: rgba(245, 166, 35, 0.12);
				--primary-glow: rgba(245, 166, 35, 0.35);
				--bg-primary: #0B0B0B;
				--bg-secondary: #151515;
				--bg-tertiary: #202020;
				--text-primary: #FFFFFF;
				--text-secondary: #FFD89C;
				--text-tertiary: #A0A0A0;
				--border-color: #2E2E2E;
				--error-color: #FF6B6B;
				--success-color: #F5A623;
				--warning-yellow: #F5A623;
			}

			html,body
			{
				font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
				font-weight:400;
				font-size:14px;
				line-height:1.3em;
				width:100%;
				height:100%;
				color: var(--text-secondary);
				background: var(--bg-primary);
				margin:0;
				padding:0;
				overflow-x:auto;
				position: relative;
			}

			body::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: 
					radial-gradient(circle at 20% 30%, rgba(245, 166, 35, 0.06) 0%, transparent 45%),
					radial-gradient(circle at 85% 70%, rgba(245, 166, 35, 0.04) 0%, transparent 45%);
				z-index: 0;
				pointer-events: none;
			}

			/*定义滚动条高宽及背景 高宽分别对应横竖滚动条的尺寸*/  
			::-webkit-scrollbar  
			{  
			    width: 0px;  
			    height: 0px;  
			    background-color: var(--bg-primary);  
			}  
			/*定义滚动条轨道 内阴影+圆角*/  
			::-webkit-scrollbar-track  
			{  
			    border-radius: 0px;  
			    background-color: #3C3C3C;  
			}  
			/*定义滑块 内阴影+圆角*/  
			::-webkit-scrollbar-thumb  
			{  
			    border-radius: 0px;  
			    background-color: var(--primary);  
			} 
			#mq_main
			{
				width:100%;
				position:absolute;
				top:0px;
				bottom:0px;
				box-sizing:border-box;
				z-index: 1;
			}
			#mq_mainL
			{
				display:flex;
				flex-direction:column;
				float:left;
				height:100%;
				width:50%;
				box-sizing:border-box;
			}
			#mq_mainR
			{
				float:left;
				height:100%;
				width:50%;
				padding-top:45px;
				padding-left:20px;
				padding-right:20px;
				box-sizing:border-box;
			}
			@keyframes changeColor {
  			0% { background-color: #FF4444; }
  			50% { background-color: transparent; }
  			100% { background-color: #FF4444; }
			}
			#mq_notes
			{
				height:100%;
				width:100%;
				padding:20px;
				background: rgba(245, 166, 35, 0.08);
				box-sizing:border-box;
				border-radius:15px;
				overflow:auto;
				border: 1px solid rgba(245, 166, 35, 0.2);
				color: var(--text-secondary);
			}
			table.altrowstable
			{
				border:1px	var(--primary) solid;
				border-collapse:collapse;
				padding:0;
				width:95%;
				table-layout:fixed;
				box-sizing:border-box;
				background: #111;
			}
			table.altrowstable	th
			{
				border:1px	var(--primary) solid;
				text-align:center;
				background: #222;
				color: #FFD58C;
				font-weight: 550;
				padding: 6px;
			}
			table.altrowstable	td
			{
				border:1px #2b2b2b solid;
				text-align:left;
				white-space:pre-line;
				word-break:keep-all;
				padding:6px;
				word-wrap:break-word;
				color: #C0C0C0;
			}
			.xTar:hover,.xTar_:hover
			{
				cursor:pointer !important;
				background-color: rgba(245, 166, 35, 0.15) !important;
			}
				
			.MList
			{
				width:50px;
				height:38px;
				border:1px solid #FFFF00;
				color:#FFFF00;
				border-radius:5px;
				box-sizing:border-box;
				text-align:center;
				line-height:38px;
				overflow:hidden;
				padding-left:3px;
				padding-right:3px;
				float:left;
				margin-top:6px;
				margin-left:6px;
				margin-bottom:3px;
			}	
						
			.MList:hover
			{
				cursor:pointer !important;
				background-color: rgba(245, 166, 35, 0.2) !important;
			}
				
			#mq_mainLT
			{
				height:40px;
				width:100%;
			}
			#mq_mainLB
			{
				margin-top:5px;
				box-sizing:border-box;
				flex-grow:1;
				overflow-y:auto;
				width:100%;
			}
		</style>
	</head>
	<body>
		<div id="mq_main">
			<div id="mq_mainL">
				<div id="mq_mainLT">
					<center>
					<div class="MList" style="top:40px;color:#FFFF00;"  id="Init">初始</div>
					</center>
				</div>
				<div id="mq_mainLB"></div>
			</div>
			<div id="mq_mainR"><div id="mq_notes"></div></div>
		</div>
		<script type="text/javascript"></script>
	</body>
	<script type="text/javascript">
		//server
		var MServer = "http://10.10.98.51/test/sys/";
		//屏蔽右键事件
		document.oncontextmenu=function(){return	false;}
		function trim(str){return str.replace(/(^\s*)|(\s*$)/g,"");}
		//定义右键事件
		function oncontextmenu(){//自定义右键上下文
			var obOK={text:"已完成",func:function(){
			var trid =$(this).attr("id");
			//alert(trid);
			$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch013C.php",
				data:{
					qflag:"contents",
					sflag:"_03",
					trid:trid,
					},
				async:false,
				success: function(data){
					//alert(data);
					contents();
				}
				})
			}
			};
			
			var obGO={text:"运行",func:function(){
					var nid =$(this).attr("id").replace('j_','');
					geti0(nid);
		}
		};
			var mailMenuData = [[obOK]];
			var mailMenuData1 = [[obGO]];
			$(".xTar_").smartMenu(mailMenuData, {
				name: "mail",
				beforeShow: function() {
				$.smartMenu.remove();
				}
			});
			$(".xTar").smartMenu(mailMenuData1, {
				name: "mail",
				beforeShow: function() {
				$.smartMenu.remove();
				}
			});
			}
		//获取目录
		function contents() {
				$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch013C.php",
				data:{
					qflag:"contents",
					sflag:"_04",
					},
				async:false,
				success: function(data){
					$("#mq_mainLB").html(data);
					oncontextmenu();
				}
				})
			}
			
			

		//查询是否完成和是否运行
		function get0 (params) {
				$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch013C.php",
				data:{
					qflag:"contents",
					sflag:"_04_02",
					trid:params,
					},
				async:false,
				success: function(result){
					if(result){
						var result=eval(trim(result));
						si0= parseInt(result[0].si0);
						si1= parseInt(result[0].si1);
					}
				}
			})	
			return [si0,si1];
		}
		
		
		//查询是否完成和是否运行
		function up1 (params) {
					$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch013C.php",
				data:{
					qflag:"contents",
					sflag:"_03_01",
					trid:params,
					},
				async:false,
				//success: function(data){}
				})
				
		}

		nidlist=[];
		//页面加载完成后，导入流程
		$(document).ready(function(){
			contents();
			$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch013C.php",
				data:{
					qflag:"contents",
					sflag:"_04_01",
					},
				async:false,
				success: function(result){
					if(result){
						var result=eval(trim(result));
						for(var i=0;i<result.length;i++){
							nidlist.push(parseInt(result[i].index0));
						}
					}

				}
			})
			
			})

		let timer0;
		function geti0(nid){
			//alert(nid);
			//alert(nidlist.includes(nid) );
			clearTimeout(timer0);
			console.log(nid);
			$('#j_'+nid).css('animation','changeColor 0.5s infinite');
			if (nid>=0){
				var si = get0(nid);
				var si0 =si[0];
				var si1 =si[1];
				var zhxfs_ = $("#zhxfs_"+nid).html();
				if (si0==0){
					if(si1==0 && zhxfs_=="自动"){
							//调用程序
							$.ajax({
								type: "POST",
								url: MServer+"qq/channel/ch013C.php",
								data:{
									qflag:"contents",
									sflag:"_01",
									sid:nid,
									},
								async:true,
								success: function(result){
									//alert(result);
									//if(result){
										//console.log('调用程序');
										//up1(nid);
									//}
								}
							})
      
						}
					else if(si1==1){
						//正在执行
						console.log('正在执行！');	
							}
					timer0 = setTimeout("geti0("+nid+")",10000);//每隔1秒重新调用一次该函数
					}
				else if(si0==1){
					$('#j_'+nid+'_3').css('color','#00FF00').html(1);
					clearTimeout(timer0);
					$('#j_'+nid).css('animation','transparent');
					console.log('已完成！');
					}
			}
		}
		$(document).off('click','#Init').on('click','#Init',function(){
				$.ajax({
					type: "POST",
					url: MServer+"qq/channel/ch013C.php",
					data:{
						qflag:"contents",
						sflag:"_03_02",
						},
					async:false,
					success: function(result){
						if(result){
							location.reload();
						}
					}
				})
			})
		
		$(document).off('click','.xTar').on('click','.xTar',function(){
			var trid =$(this).attr("id");
			//alert(trid);
			$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch013C.php",
				data:{
					qflag:"contents",
					sflag:"_04_03",
					trid:trid,
					},
				async:false,
				success: function(data){
					$("#mq_notes").html(data);
				}
				})
			
			})










		</script>
</html>
