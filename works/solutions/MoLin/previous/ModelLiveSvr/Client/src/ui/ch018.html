<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据驱动的投资研究流程图</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <script type="text/javascript" src="./js/jquery.min.js"></script>
    <style>
        :root {
            --primary: #F5A623;
            --primary-dark: #E09515;
            --primary-light: #FFB84D;
            --primary-transparent: rgba(245, 166, 35, 0.1);
            --primary-glow: rgba(245, 166, 35, 0.35);
            --bg-primary: #0B0B0B;
            --bg-secondary: #151515;
            --bg-tertiary: #202020;
            --bg-transparent: rgba(18, 18, 20, 0.8);
            --text-primary: #FFFFFF;
            --text-secondary: #FFD89C;
            --text-gray: #D0D0D0;
            --text-muted: #808080;
            --border-color: rgba(245, 166, 35, 0.3);
            --error-color: #FF6B6B;
            --success-color: #06D6A0;
            --data-source-blue: #16C0FF;
            --data-processing-red: #FF6B6B;
            --storage-teal: #4ECDC4;
            --calculation-yellow: #FFD166;
            --strategy-purple: #8A2BE2;
            --trading-green: #06D6A0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            font-weight: 300;
            font-size: 13px;
            line-height: 1.4em;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-secondary);
            position: relative;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        /* 背景装饰 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(245, 166, 35, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(245, 166, 35, 0.04) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }
        
        body > * {
            position: relative;
            z-index: 1;
        }
        
        ::-webkit-scrollbar {  
            width: 0px;  
            height: 0px;  
            background-color: var(--bg-primary);  
        }
        
        /* 图例 */
        .legend {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(245, 166, 35, 0.25);
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 0 18px rgba(245, 166, 35, 0.08);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }
        
        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            margin-right: 6px;
            border: 1px solid;
        }
        
        .legend-text {
            font-size: 13px;
            color: var(--text-gray);
            font-weight: 500;
        }
        
        .dashboard {
            display: flex;
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        .chart-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
            transform-origin: center;
            transition: transform 0.3s;
            overflow-y: auto !important;
            background: var(--bg-transparent);
        }
        
        .metrics-panel {
            width: 300px;
            padding: 3px;
            border-left: 1px solid rgba(245, 166, 35, 0.25);
            overflow-y: auto !important;
            background: var(--bg-transparent);
        }
           
        .metric-item {
            margin-bottom: 3px;
            padding: 12px;
            background: var(--primary-transparent);
            border-left: 2px solid var(--primary);
        }
        
        .metric-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-gray);
            font-size: 14px;
        }
        
        .metric-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-light);
            text-shadow: 0 0 8px rgba(245, 166, 35, 0.3);
        }
        
        .metric-trend {
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        .trend-up {
            color: var(--success-color);
        }
        
        .trend-down {
            color: var(--error-color);
        }
        
        .node {
            position: absolute;
            width: 160px;
            height: 90px;
            color: var(--text-primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: move;
            z-index: 10;
            user-select: none;
            padding: 6px;
            flex-direction: column;
            border: 1px solid var(--primary);
            background: rgba(18, 18, 20, 0.9);
            transition: all 0.3s;
        }
        
        .node:hover {
            transform: translateY(-3px);
            z-index: 100;
            border-color: var(--primary-light);
            box-shadow: 0 10px 25px rgba(245, 166, 35, 0.4);
        }
        
        /* 节点类型专用样式 - 保留各类型标志色 */
        .node.data-source {
            border-color: var(--data-source-blue);
            background: rgba(22, 192, 255, 0.08);
            border-radius: 12px;
        }
        
        .node.data-processing {
            border-color: var(--data-processing-red);
            background: rgba(255, 107, 107, 0.08);
            border-radius: 12px;
        }
        
        .node.storage {
            border-color: var(--storage-teal);
            background: rgba(78, 205, 196, 0.08);
            border-radius: 12px;
        }
        
        .node.calculation {
            border-color: var(--calculation-yellow);
            background: rgba(255, 209, 102, 0.08);
            border-radius: 12px;
        }
        
        .node.strategy {
            border-color: var(--strategy-purple);
            background: rgba(138, 43, 226, 0.08);
            border-radius: 12px;
        }
        
        .node.trading {
            border-color: var(--trading-green);
            background: rgba(6, 214, 160, 0.08);
            border-radius: 12px;
        }
        
        /* 关键节点样式 */
        .node.critical {
            border-width: 2px;
            border-color: gold;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
        }
        
        /* 闪烁动画关键帧 */
        @keyframes blink {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.6); }
            100% { filter: brightness(1); }
        }
        
        .node.blink {
            animation: blink 1.5s infinite;
        }
        
        .node-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }
        
        .node-subtitle {
            font-size: 13px;
            font-weight: normal;
            opacity: 0.85;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            max-height: 30px;
            color: var(--text-gray);
        }
        
        .jtk-connector {
            z-index: 5;
            stroke: var(--primary);
            stroke-width: 2;
        }
        
        .jtk-endpoint {
            z-index: 6;
            fill: var(--primary);
        }
        
        .jtk-hover {
            z-index: 7;
        }
                
        /* 自定义箭头样式 */
        .flow-arrow {
            fill: var(--primary);
            animation: flow 2s infinite linear;
        }
        
        @keyframes flow {
            0% {
                opacity: 0;
                transform: translateX(-10px);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(10px);
            }
        }
        
        /* 连接线动画 */
        .animated-connector {
            stroke-dasharray: 10 5;
            animation: dash 1s linear infinite;
        }
        
        @keyframes dash {
            to {
                stroke-dashoffset: -15;
            }
        }
        
        /* 脉冲效果 */
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                r: 4;
                opacity: 1;
            }
            50% {
                r: 6;
                opacity: 0.7;
            }
            100% {
                r: 4;
                opacity: 1;
            }
        }
        
        /* 节点详情面板 */
        .node-detail {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 350px;
            background: rgba(18, 18, 20, 0.96);
            padding: 10px;
            z-index: 1000;
            border: 1px solid var(--primary);
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.4s ease;
            box-shadow: 0 0 25px rgba(245, 166, 35, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .node-detail.active {
            transform: translateY(0);
            opacity: 1;
        }
        
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(245, 166, 35, 0.25);
        }
        
        .detail-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-light);
            text-shadow: 0 0 10px rgba(245, 166, 35, 0.3);
        }
        
        .close-detail {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .close-detail:hover {
            background: rgba(255, 68, 68, 0.15);
            color: var(--error-color);
        }
        
        .detail-content {
            line-height: 1.7;
        }
        
        .detail-item {
            margin-bottom: 15px;
        }
        
        .detail-label {
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 5px;
            display: block;
            font-size: 14px;
        }
        
        .detail-value {
            color: var(--text-primary);
            font-size: 16px;
        }
        
        /* 关键节点标记 */
        .critical-mark {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: gold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
            z-index: 11;
        }
        
        /* 层次标题 */
        .layer-title {
            position: absolute;
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-light);
            text-align: center;
            width: 100%;
            z-index: 1;
            padding: 6px 0;
            border-bottom: 1px solid rgba(245, 166, 35, 0.25);
            text-shadow: 0 0 10px rgba(245, 166, 35, 0.3);
        }
        
        /* 控制面板 */
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        
        .btn {
            background: var(--primary-transparent);
            border: 1px solid var(--primary);
            color: var(--text-gray);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: rgba(245, 166, 35, 0.2);
            color: var(--primary-light);
        }
    </style>
</head>
<body>

    <!-- 引入jsPlumb库 -->
    <script src="js/jsplumb.min.js"></script>
    <script>
        // 初始化jsPlumb实例
        const jsPlumbInstance = jsPlumb.getInstance({
            Connector: ["Flowchart", {cornerRadius: 10}],
            Anchors: ['Right', 'Left', 'Top', 'Bottom'],
            Endpoint: ["Dot", { radius: 2 }],
            EndpointStyle: { fill: "#F5A623" },
            PaintStyle: { 
                stroke: "#F5A623", 
                strokeWidth: 1,
                strokeDasharray: "10 5"
            },
            HoverPaintStyle: { stroke: "#FFB84D", strokeWidth: 4 },
            Container: "chart-container"
        });
        
        
        const bias = ($('#chart-container').width()-900-50-150)*0.5;
        // 投资数据流程节点数据 - 保持原有坐标不变
        const nodes = [
            // 数据源层
            { id: "wind-data", name: "Wind数据源", type: "data-source", x: bias+50, y: 50, 
              description: "从Wind获取宏观、行业、量价数据", critical: true },
            { id: "ifind-data", name: "iFind数据源", type: "data-source", x: bias+50, y: 200, 
              description: "从iFind获取基本面、财务数据", critical: true },
            { id: "alternative-data", name: "另类数据源", type: "data-source", x: bias+50, y: 350, 
              description: "新闻、社交媒体、卫星数据等" },
            { id: "real-time-data", name: "实时数据源", type: "data-source", x: bias+50, y: 500, 
              description: "实时行情、新闻推送", critical: true },

            // 数据处理层
            { id: "data-extraction", name: "数据提取", type: "data-processing", x: bias+300, y: 50, 
              description: "API调用、文件读取、数据抓取" },
            { id: "data-cleaning", name: "数据清洗", type: "data-processing", x: bias+600, y: 50, 
              description: "缺失值处理、异常值检测、数据标准化", critical: true },
            { id: "data-validation", name: "数据验证", type: "data-processing", x: bias+900, y: 50, 
              description: "数据质量检查、一致性验证" },

            // 数据存储层
            { id: "raw-data-storage", name: "原始数据存储", type: "storage", x: bias+300, y: 200, 
              description: "CSV文件、原始数据库存储" },
            { id: "processed-data-storage", name: "处理数据存储", type: "storage", x: bias+600, y: 200, 
              description: "MySQL数据库、数据仓库", critical: true },
            { id: "real-time-storage", name: "实时数据存储", type: "storage", x: bias+900, y: 200, 
              description: "Redis、内存数据库" },

            // 计算引擎层
            { id: "derived-variables", name: "衍生变量计算", type: "calculation", x: bias+300, y: 350, 
              description: "技术指标、因子计算、特征工程", critical: true },
            { id: "model-training", name: "模型训练", type: "calculation", x: bias+600, y: 350, 
              description: "机器学习模型、统计模型训练" },
            { id: "real-time-calculation", name: "实时计算", type: "calculation", x: bias+900, y: 350, 
              description: "实时信号生成、风险监控" },

            // 策略层
            { id: "strategy-development", name: "策略开发", type: "strategy", x: bias+450, y: 500, 
              description: "策略逻辑设计、参数优化" },
            { id: "backtesting", name: "回测验证", type: "strategy", x: bias+750, y: 500, 
              description: "历史数据回测、策略评估", critical: true },

            // 交易执行层
            { id: "signal-generation", name: "信号生成", type: "trading", x: bias+300, y: 650,

        // 定义连接配置数组 - 保留各类型标志色
        const connectionConfigs = [
            // 数据源到数据处理
            {from: "wind-data", to: "data-extraction", anchors: ["Right", "Left"], color: "#F5A623", width: 2, style: "solid"},

            {from: "real-time-storage", to: "real-time-calculation", anchors: ["Bottom", "Top"], color: "#FFD166", width: 2, style: "solid"},
            // 策略开发
            {from: "model-training", to: "strategy-development", anchors: ["Bottom", "Top"], color: "#8A2BE2", width: 2, style: "solid"},
            {from: "strategy-development", to: "backtesting", anchors: ["Right","Left"], color: "#8A2BE2", width: 2, style: "solid"},
            // 交易执行
            {from: "backtesting", to: "signal-generation", anchors: ["Bottom", "Top"], color: "#06D6A0", width: 2, style: "solid"},
            {from: "real-time-calculation", to: "signal-generation", anchors: ["Right", "Bottom"], color: "#06D6A0", width: 2, style: "solid"},
            {from: "signal-generation", to: "order-execution", anchors: ["Right", "Left"], color: "#06D6A0", width: 2, style: "solid"},
            {from: "order-execution", to: "performance-monitoring", anchors: ["Right", "Left"], color: "#06D6A0", width: 2, style: "solid"},
            // 反馈循环
            {from: "performance-monitoring", to: "strategy-development", anchors: ["Top", "Bottom"], color: "#FF6B6B", width: 2, style: "dotted"},
            {from: "backtesting", to: "model-training", anchors: ["Top", "Right"], color: "#FF6B6B", width: 2, style: "dotted"}
        ];
        
        // 存储所有连接对象
        let connectionObjects = [];
        let animationsEnabled = true;
        let blinkingEnabled = false;
        let criticalHighlighted = false;
        
        // 添加节点函数
        function addNode(node) {
            const nodeElement = document.createElement("div");
            nodeElement.id = node.id;
            nodeElement.className = `node ${node.type}`;
            
            // 如果是关键节点，添加标记
            if (node.critical) {
                nodeElement.classList.add('critical');
                nodeElement.innerHTML = `
                    <div class="critical-mark">!</div>
                    <div class="node-title">${node.name}</div>
                    <div class="node-subtitle">${node.description}</div>
                `;
            } else {
                nodeElement.innerHTML = `
                    <div class="node-title">${node.name}</div>
                    <div class="node-subtitle">${node.description}</div>
                `;
            }
            
            // 设置位置
            nodeElement.style.left = `${node.x}px`;
            nodeElement.style.top = `${node.y}px`;
            
            // 添加到容器
            document.getElementById("chart-container").appendChild(nodeElement);
            
            // 使节点可拖拽
            jsPlumbInstance.draggable(nodeElement, {containment: "parent"});
            
            // 双击编辑节点名称
            nodeElement.addEventListener("dblclick", function() {
                const currentName = this.querySelector(".node-title").textContent;
                const newName = prompt("请输入节点名称:", currentName);
                if (newName !== null && newName.trim() !== "") {
                    this.querySelector(".node-title").textContent = newName;
                    
                    // 更新数据
                    const nodeData = nodes.find(n => n.id === this.id);
                    if (nodeData) nodeData.name = newName;
                }
            });
            
            // 右键查看节点详情
            nodeElement.addEventListener("contextmenu", function(e) {
                e.preventDefault();
                e.stopPropagation();
                showNodeDetail(this.id);
            });
            
            return nodeElement;
        }
        
        function createSingleConnection(config, index) {
            const sourceNode = document.getElementById(config.from);
            const targetNode = document.getElementById(config.to);

            if (!sourceNode || !targetNode) return;

            const conn = {
                id: `conn-${index}`,
                source: config.from,
                target: config.to,
                color: config.color || "#F5A623",
                width: config.width || 2,
                style: config.style || "solid",
                animation: config.animation || "dash",
                arrow: config.arrow !== false,
                anchors: config.anchors
            };

            const connection = jsPlumbInstance.connect({
                source: sourceNode,
                target: targetNode,
                anchors: conn.anchors,
                paintStyle: getConnectionStyle(conn),
                overlays: conn.arrow ? [
                    ["Custom", { 
                        create: function(component) {
                            // 创建自定义箭头
                            const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                            arrow.setAttribute("points", "0,0 10,5 0,10");
                            arrow.setAttribute("class", "flow-arrow");
                            arrow.style.fill = conn.color;
                            return arrow;
                        },
                        location: 0.5,
                        id: "customArrow"
                    }]
                ] : []
            });

            connectionObjects.push({
                jsPlumbConnection: connection,
                metadata: conn
            });

            applyConnectionAnimation(connection, conn.animation);
        }

        // 获取连接线样式
        function getConnectionStyle(conn) {
            let dashstyle = "";
            if (conn.style === "dashed") {
                dashstyle = "5 5";
            } else if (conn.style === "dotted") {
                dashstyle = "2 2";
            }
            
            return {
                stroke: conn.color,
                strokeWidth: conn.width,
                strokeDasharray: dashstyle
            };
        }
        
        // 应用连接线动画
        function applyConnectionAnimation(connection, animationType) {
            const connector = connection.connector.canvas;
            if (!connector) return;
            
            // 移除所有动画类
            connector.classList.remove("animated-connector", "pulse");
            
            if (animationType === "dash") {
                connector.classList.add("animated-connector");
            } else if (animationType === "pulse") {
                connector.classList.add("pulse");
            }
        }
        
        // 显示节点详情
        function showNodeDetail(nodeId) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return;
            
            const detailPanel = document.querySelector(".node-detail");
            const detailContent = detailPanel.querySelector(".detail-content");
            
            const criticalText = node.critical ? "是" : "否";
            
            detailContent.innerHTML = `
                <div class="detail-item">
                    <span class="detail-label">节点ID:</span>
                    <span class="detail-value">${node.id}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">节点名称:</span>
                    <span class="detail-value">${node.name}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">节点类型:</span>
                    <span class="detail-value">${getNodeTypeName(node.type)}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">关键节点:</span>
                    <span class="detail-value">${criticalText}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">节点描述:</span>
                    <span class="detail-value">${node.description}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">位置坐标:</span>
                    <span class="detail-value">(${node.x}, ${node.y})</span>
                </div>
            `;
            
            // 显示面板
            detailPanel.classList.add("active");
        }

        // 获取节点类型名称
        function getNodeTypeName(type) {
            const typeNames = {
                "data-source": "数据源",
                "data-processing": "数据处理",
                "storage": "数据存储",
                "calculation": "计算引擎",
                "strategy": "策略层",
                "trading": "交易执行"
            };
            return typeNames[type] || "其他";
        }
                
        // 切换动画
        function toggleAnimations() {
            animationsEnabled = !animationsEnabled;
            
            connectionObjects.forEach(conn => {
                const connector = conn.jsPlumbConnection.connector.canvas;
                if (connector) {
                    if (animationsEnabled) {
                        applyConnectionAnimation(conn.jsPlumbConnection, conn.metadata.animation);
                    } else {
                        connector.classList.remove("animated-connector", "pulse");
                    }
                }
            });
        }
        
        // 切换闪烁
        function toggleBlinking() {
            blinkingEnabled = !blinkingEnabled;
            const nodes = document.querySelectorAll('.node');
            
            nodes.forEach(node => {
                if (blinkingEnabled) {
                    node.classList.add('blink');
                } else {
                    node.classList.remove('blink');
                }
            });
        }
        
        // 重置节点位置
        function resetPositions() {
            nodes.forEach(node => {
                const nodeElement = document.getElementById(node.id);
                if (nodeElement) {
                    nodeElement.style.left = `${node.x}px`;
                    nodeElement.style.top = `${node.y}px`;
                    jsPlumbInstance.revalidate(nodeElement);
                }
            });
        }
        
        // 高亮关键节点
        function highlightCritical() {
            criticalHighlighted = !criticalHighlighted;
            const criticalNodes = document.querySelectorAll('.node.critical');
            
            criticalNodes.forEach(node => {
                if (criticalHighlighted) {
                    node.style.borderColor = 'gold';
                    node.style.zIndex = '100';
                } else {
                    node.style.borderColor = '';
                }
            });
        }
        
        // 关闭详情面板
        document.querySelector(".close-detail").addEventListener("click", function() {
            document.querySelector(".node-detail").classList.remove("active");
        });
        
        // 点击空白处关闭详情面板
        document.addEventListener("click", function(e) {
            if (!e.target.closest('.node-detail') && !e.target.closest('.node')) {
                document.querySelector(".node-detail").classList.remove("active");
            }
        });
        
        // 初始化架构图
        function initializeChart() {
            nodes.forEach(node => {addNode(node);});
            setTimeout(() => {               
              for (let i1=0;i1<connectionConfigs.length;i1++){
                createSingleConnection(connectionConfigs[i1], i1);
              }
            }, 100);
        }
        
        // 页面加载完成后初始化
        window.onload = function(){
            initializeChart();
        };
    </script>
</body>
</html>
