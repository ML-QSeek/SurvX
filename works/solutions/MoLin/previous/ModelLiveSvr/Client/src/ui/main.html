<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>ModelLiveSvr · 服务器监控中枢</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/smartMenu.css">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        /* 全局黄色调色板 — 服务器监控版 */
        :root {
            --primary: #F5A623;
            --primary-dark: #E09515;
            --primary-light: #FFB84D;
            --primary-transparent: rgba(245, 166, 35, 0.12);
            --primary-glow: rgba(245, 166, 35, 0.35);
            --bg-primary: #0B0B0B;
            --bg-secondary: #151515;
            --bg-tertiary: #202020;
            --text-primary: #FFFFFF;
            --text-secondary: #FFD89C;
            --text-tertiary: #A0A0A0;
            --border-color: #2E2E2E;
            --error-color: #FF6B6B;
            --success-color: #F5A623;
            --warning-yellow: #F5A623;
            --card-hover: rgba(245, 166, 35, 0.05);
        }
        
        * {
            margin: 0;
            padding: 0;
            /*box-sizing: border-box;*/
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-weight: 300;
            font-size: 13px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
        }
        
        /* 暖色径向光晕 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(245, 166, 35, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 85% 70%, rgba(245, 166, 35, 0.04) 0%, transparent 45%);
            z-index: 0;
            pointer-events: none;
        }
        
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }
        
        [contenteditable="true"] {
            outline: none;
            background-color: transparent;
            border: none;
            color: var(--text-tertiary);
        }
        
        [contenteditable="true"]:focus {
            background-color: var(--primary-transparent);
        }
        
        a:link, a:visited, a:hover {
            text-decoration: none;
        }
        
        a {
            color: var(--warning-yellow);
            transition: color 0.3s;
        }
        
        a:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }
        
        #mq_top {
            height: 36px;
            display: flex;
            flex-shrink: 0;
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(245, 166, 35, 0.25);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 0 18px rgba(245, 166, 35, 0.08);
        }
        
        /* M 字符 - 金色渐变 */
        .logo-q-char {
            background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B5 25%, #FFC477 60%, #F5A623 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
            text-shadow: 0 0 12px rgba(245, 166, 35, 0.5);
            font-weight: 600;
            letter-spacing: -1px;
            cursor: pointer;
        }
        
        /* odelLiveSvr 文字暖金 */
        .logo-text {
            background: linear-gradient(135deg, #FFE0B5 0%, #FFCD7A 30%, #F5A623 70%, #E09515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 18px;
            position: relative;
            top: 6px;
            font-weight: 500;
            letter-spacing: 0px;
            cursor: pointer;
        }
        
        input, select {
            vertical-align: middle;
            background: rgba(0,0,0,0.4);
            color: var(--primary-light);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
        }
        
        .label {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-secondary);
        }
        
        li {
            list-style-type: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .main_topic {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90px;
            font-weight: 450;
            cursor: pointer;
            color: #DDDDDD;
            box-sizing: border-box;
            font-size: 13px;
            transition: all 0.3s ease;
            position: relative;
            height: 36px;
        }
        
        .main_topic:hover {
            color: var(--primary-light);
            background-color: var(--primary-transparent);
            text-shadow: 0 0 6px rgba(245,166,35,0.4);
        }
        
        .main_topic::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        
        .main_topic:hover::after {
            width: 70%;
        }
        
        #mq_top_ul_li_06 {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 36px;
            height: 100%;
        }
        
        #mq_top_ul_li_user {
            width: 150px;
            height: 70px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-tertiary);
            position: absolute;
            font-weight: 450;
            top: 36px;
            right: 30px;
            margin-top: 2px;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), 0 0 18px rgba(245,166,35,0.15);
            backdrop-filter: blur(12px);
        }
        
        .window-control {
            width: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #B0B0B0;
            font-size: 16px;
            -webkit-app-region: no-drag;
            transition: all 0.3s ease;
            user-select: none;
            font-weight: 350;
            position: relative;
        }
        
        .window-control:hover {
            background-color: rgba(245, 166, 35, 0.12);
            color: var(--primary-light);
        }
        
        .window-control.close:hover {
            background-color: rgba(232, 17, 35, 0.9);
            color: white;
        }
        
        /* 状态指示器 β / α 黄色风格 */
        #pet, #mq_top_ul_li_15 {
            color: var(--warning-yellow) !important;
            font-size: 15px;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(245, 166, 35, 0.5);
        }
        
        /* 警报图标 + 购物篮 金黄色系 */
        .warning-icon {
            width: 18px;
            height: 18px;
            fill: var(--warning-yellow);
            filter: drop-shadow(0 0 6px rgba(245, 166, 35, 0.7));
            transition: all 0.3s ease;
        }
        
        #mq_top_ul_li_War:hover .warning-icon {
            fill: #FFD966;
            filter: drop-shadow(0 0 10px #F5A623);
            transform: scale(1.1);
        }
        
        .basket-icon {
            width: 20px;
            height: 20px;
            fill: var(--primary);
            filter: drop-shadow(0 0 5px rgba(245, 166, 35, 0.5));
            transition: all 0.3s ease;
        }
        
        #mq_top_ul_li_07:hover .basket-icon {
            fill: var(--primary-light);
            filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.8));
            transform: scale(1.1);
        }
        
        @keyframes warningPulse {
            0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 4px #F5A623); }
            50% { opacity: 1; filter: drop-shadow(0 0 10px #FFC107); }
        }
        
        .warning-icon {
            animation: warningPulse 2s ease-in-out infinite;
        }
        
        /*** 侧边栏 暖黑风格 ***/
        #mq_main_r {
            width: 220px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid rgba(245, 166, 35, 0.2);
            box-sizing: border-box;
            background: rgba(18, 18, 20, 0.9);
        }
        
        #mq_main_m {
            width: 100px;
            height: 100%;
            overflow-y: hidden;
            border-right: 1px solid var(--border-color);
            display: none;
        }
        
        #mq_main_l {
            height: 100%;
            flex: 1;
            overflow-y: auto;
            box-sizing: border-box;
            background: var(--bg-primary);
        }
        
        #mq_main_r1 {
            width: 160px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: hidden;
            border-right: 1px solid rgba(245, 166, 35, 0.15);
            background: rgba(18, 18, 20, 0.9);
        }
        
        #mq_main_l1 {
            height: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-sizing: border-box;
            background: var(--bg-primary);
        }
        
        .jkbtj, .jkzbj, .PRIT, .jkzb, .jkbt, .divselect, .xRep, .reportdiv, .mq_main_lT {
            border-bottom: 1px solid rgba(245, 166, 35, 0.2);
            width: 100%;
            min-height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 300;
            transition: all 0.2s;
            color: #D0D0D0;
        }
        
        #cqmonthlyreport, #cqweeklyreport, #cqdailyreport {
            width: 60px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 400;
            transition: all 0.3s;
            color: #FFCF8A;
        }
        
        .jkbt, .jkbtj {
            background: rgba(245, 166, 35, 0.2);
            color: #FFE0AF;
        }
        
        .jkbtj:hover, .jkzbj:hover, .jkzb:hover {
            background-color: rgba(245, 166, 35, 0.15);
            color: var(--primary-light);
        }
        
        .divselect {
            height: 30px;
        }
        
        .divinput {
            height: 100%;
            flex: 1;
            padding-left: 3px;
            display: flex;
            border: 1px solid var(--border-color);
            justify-content: left;
            align-items: center;
        }
        
        .divselectsub {
            height: 100%;
            width: 60px;
            display: flex;
            border: 1px solid var(--border-color);
            justify-content: center;
            align-items: center;
        }
        
        .jbaobiao {
            flex: 1;
            overflow: auto;
        }
        
        .xRep {
            justify-content: left;
            height: auto;
        }
        
        .charts_kuang_ll {
            flex: 1;
            height: 100%;
        }
        
        .charts_kuang_lr {
            width: 450px;
            height: 100%;
            border-left: 1px solid var(--border-color);
            box-sizing: border-box;
            overflow: auto;
        }
        
        #mq_main_lT4 {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-bottom: 3px;
            overflow-y: auto;
        }
        
        .charts_kuang_l {
            height: 250px;
            margin: 0;
            padding: 0;
            border: 1px solid rgba(245, 166, 35, 0.4);
            box-sizing: border-box;
            background: #0C0C0C;
            border-radius: 6px;
        }
        
        table.altrowstable {
            border: 1px var(--border-color) solid;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
            margin: 3px 3px 0px 3px;
            box-sizing: border-box;
            overflow: hidden;
            width: calc(100% - 6px);
            background: #111;
        }
        
        table.altrowstable th {
            border: 1px solid #333;
            text-align: center;
            padding: 6px;
            background: #222;
            color: #FFD58C;
            font-weight: 550;
        }
        
        table.altrowstable td {
            border: 1px solid #2b2b2b;
            white-space: pre-line;
            word-break: keep-all;
            padding: 3px;
            word-wrap: break-word;
            text-align: center;
            color: #C0C0C0;
        }
        
        /* 警告弹窗 暖黄边框 */
        .Warn {
            border: 1px solid #F5A623;
            background: rgba(20, 20, 28, 0.98);
            width: 400px;
            height: 160px;
            z-index: 9999;
            position: fixed;
            top: 50%;
            left: 50%;
            margin-top: -80px;
            margin-left: -200px;
            box-sizing: border-box;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(245, 166, 35, 0.3);
            backdrop-filter: blur(4px);
        }
        
        .WarnB {
            width: 100%;
            height: 114px;
            font-size: 13px;
            line-height: 20px;
            padding: 10px;
            word-wrap: break-word;
            white-space: pre-wrap;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFDEAD;
        }
        
        .WarnM {
            width: 100%;
            height: 26px;
            text-align: center;
        }
        
        .WarnMButton {
            background: transparent;
            border: 1px solid #F5A623;
            color: #F5A623;
            width: 50px;
            height: 22px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            margin: 1px;
            border-radius: 4px;
            transition: 0.2s;
        }
        
        .WarnMButton:hover {
            background: rgba(245, 166, 35, 0.2);
            color: #FFE0AF;
        }
        
        /* 列表项 hover 暖色 */
        .list-item-hover:hover {
            background: rgba(245, 166, 35, 0.08);
        }
        
        /* 按钮点缀 */
        button, .btn-like {
            transition: all 0.2s;
        }
        
        .mq_main_lT {
            background: #0F0F0F;
        }
    </style>
    <script src="./js/jquery.min.js"></script>
    <script src="./js/jquery-smartMenu.js"></script>
    <script src="./js/laydate/laydate.js"></script>
    <script src="./js/socket.io.min.js"></script>
</head>
<body>
<div id="mq_top">
    <div style="width:10px;"></div>
    <div class="logo-q-char" id="logo-q-char">M</div>
    <div class="logo-text" id="logo-text">odelLiveSvr</div>
    <div style="flex-grow:1;"></div>
    
    <div style="width:200px;"></div>
    <div id="mq_top_ul_li_War" class="main_topic" style="width:30px;">
        <svg class="warning-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
    </div>
    <div id="ModelLiveSvr0" class="main_topic">每日任务</div>
    <div id="ModelLiveSvr1" class="main_topic">定期任务</div>
    <div id="ModelLiveSvr2" class="main_topic">策略服务</div>
    <div id="ModelLiveSvr3" class="main_topic">智能服务</div>
    <div id="ModelLiveSvr4" class="main_topic">综合服务</div>
    <div id="ModelLiveSvr5" class="main_topic">算力调度</div>
    <div id="ModelLiveSvr7" class="main_topic">应用中心</div>
    <div id="ModelLiveSvr6" class="main_topic">系统管理</div>
    <div id="mq_top_ul_li_06">
        <div style="width:30px;height:30px;">
            <img src="./assets/images/Client.jpg" style="width:100%;height:100%;border-radius:15px;" alt="avatar"/>
        </div>
    </div>
    <!-- 窗口控制按钮 -->
    <div class="window-control" id="window-minimize" title="最小化">−</div>
    <div class="window-control" id="window-maximize" title="最大化">□</div>
    <div class="window-control close" id="window-close" title="关闭">×</div>
</div>
<div style="flex:1;position:relative;">
    <div id="mq_main" style="display:flex;position:absolute;top:0;left:0;right:0;bottom:0;"></div>
</div>

<script>
    // 窗口控制与远程桌面 (保留原有业务逻辑，配色完全适配黄色主题)
    document.getElementById('window-minimize').addEventListener('click', () => {
        if (typeof pywebview !== 'undefined') {
            pywebview.api.minimize_window();
        } else {
            console.log('[ModelLiveSvr] 最小化窗口');
        }
    });
    
    let isMaximized = false;
    const maximizeBtn = document.getElementById('window-maximize');
    
    maximizeBtn.addEventListener('click', () => {
        if (!isMaximized) {
            if (typeof pywebview !== 'undefined') {
                pywebview.api.maximize_window();
            } else {
                console.log('[ModelLiveSvr] 最大化');
            }
            maximizeBtn.innerHTML = '❐';
            maximizeBtn.title = '恢复';
        } else {
            if (typeof pywebview !== 'undefined') {
                pywebview.api.restore_window();
            } else {
                console.log('[ModelLiveSvr] 还原');
            }
            maximizeBtn.innerHTML = '□';
            maximizeBtn.title = '最大化';
        }
        isMaximized = !isMaximized;
    });
    
    function startRemoteDesktop() {
        const hosts = '10.10.98.113';
        const username = 'quruyi';
        const password = 'zc001002';
        if (typeof pywebview !== 'undefined' && pywebview.api.connect_remote_desktop) {
            pywebview.api.connect_remote_desktop(hosts, username, password).then(response => {
                if (response.success) {
                    console.log('远程桌面启动');
                } else {
                    alert('连接失败: ' + response.message);
                }
            });
        } else {
            console.log('模拟远程桌面连接');
        }
    };
    
    document.getElementById('window-close').addEventListener('click', () => {
        if (typeof pywebview !== 'undefined') {
            pywebview.api.close_window();
        } else {
            console.log('关闭窗口');
        }
    });
    
    if (typeof pywebview !== 'undefined' && pywebview.api.on_window_state_changed) {
        pywebview.api.on_window_state_changed((state) => {
            if (state === 'maximized') {
                isMaximized = true;
                maximizeBtn.innerHTML = '❐';
                maximizeBtn.title = '恢复';
            } else {
                isMaximized = false;
                maximizeBtn.innerHTML = '□';
                maximizeBtn.title = '最大化';
            }
        });
    }
    
    window.exposeApiToIframe = function() {
        return {
            download_image: function(base64_data) {
                if (window.pywebview && window.pywebview.api.download_image) {
                    return window.pywebview.api.download_image(base64_data);
                } else {
                    console.log("模拟下载图片");
                    return Promise.resolve({ success: true });
                }
            }
        };
    };
    
    // 可选: 动态修改一些元素的文本强调服务器版
    document.addEventListener('DOMContentLoaded', () => {
        // 修改标题区域细微文案，强化服务器监控感 (但保留原有菜单功能不变)
        const petDiv = document.getElementById('pet');
        if (petDiv) petDiv.title = "服务健康指数 β";
        const alphaDiv = document.getElementById('mq_top_ul_li_15');
        if (alphaDiv) alphaDiv.title = "负载均衡 α指标";
        // 增加控制台暖色调提示
        console.log("ModelLiveSvr 服务器监控界面 | 金色主题已激活");
        
        // 若需要将侧边栏内某些动态加载元素的默认边框微调，利用全局样式已经完成
        // 左侧菜单动态加载部分由 mq.js 接管，配色将继承 :root 黄色调
    });
</script>
<!-- 原有业务脚本 mq, mqcharts, databgroups 保持不变，仅主题色改变 -->
<script src="./js/mq.js"></script>
</body>
</html>
