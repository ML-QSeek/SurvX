<script	type="text/javascript">
	
	
//server
		var MServer = "http://10.10.98.51/test/sys/";
		
//屏蔽右键事件
document.oncontextmenu=function(){return	false;}
function trim(str){return str.replace(/(^\s*)|(\s*$)/g,"");}
myChart0 = echarts.init(document.getElementById('g0'));	
myChart1 = echarts.init(document.getElementById('g1'));	
myChart2 = echarts.init(document.getElementById('g2'));	





function hg3(tl,myChart,df){
	var ddate = ['g0','g1','g2','g3','g4','g5','g6','g7','g8','g9'];
	// 指定图表的配置项和数据
	var hfen = {
		title: {
			text: tl+'规模效应',left: 'left',padding:4,textStyle:{color:'#FFFFFF',fontSize:15,}
			},
			tooltip: {},
			//toolbox: {
			// feature: {
			//dataView: {show: true, readOnly: false},
			//}
			//},
			grid: {left: '2',right: '2',top: '15%',bottom: '3%',containLabel: true},
    	color:['#F2F2F2','#00CCFF','#F34100','#FFC016'],
    	/*
			legend: {
				textStyle:{color:'#16C0FF',fontSize:15},
				icon:'Rect',
				itemHeight:8,
				itemWidth:10,
				data:['短期因素'],
				right:70,
				top:30,
				},
				*/
				animationDuration: 0,
  			animationDurationUpdate: 200,
  			animationEasing: 'linear',
  			animationEasingUpdate: 'linear',
				dataZoom: [
				{
					type: 'inside',
					show: true,
					realtime: true,
					}
				],
				xAxis: {
					axisLine:{onZero: true,show:true,lineStyle:{color:'#16C0FF'}},
					data: (function(){return ddate;})(),
					splitLine:{show:true,lineStyle:{color:'#16C0FF',width:0.5,type:'dotted'}},
					},
            yAxis: {boundaryGap: [0, '50%'],type: 'value',splitNumber:5,scale:true,axisLine:{onZero: true,show:true,lineStyle:{color:'#16C0FF'}},splitLine:{show:true,lineStyle:{color:'#16C0FF',width:0.5,type:'dotted'}},},
            tooltip: {
            trigger: 'axis'
        },

            series: [{
                name: '短期因素',
                type: 'bar',
                data: (function(){return df;})(),
                }               
                ]
        };      
        // 使用刚指定的配置项和数据显示图表。
        eval(myChart+".setOption(hfen);");
}


	i=0

	$(document).off('click',"#submit").on('click',"#submit", function(){
			var sTxt=$("#key").val();
			if(sTxt==''){
				alert("请输入查询周期，格式：#-#");
				}
			else if(sTxt!=''){
				btxt = sTxt.split("_");
				sdate = btxt[0];
				edate = btxt[1];
				$.ajax({
				type: "POST",
				url: MServer+"qq/channel/ch001C.php",
				data:{
					sdate:sdate,
					edate:edate,
					},
				async:false,
				success: function(data){
					var result=eval(trim(data));
					var date = result[i][2][0];
					var data0 = [result[i][2][1],result[i][2][2],result[i][2][3],result[i][2][4],result[i][2][5],result[i][2][6],result[i][2][7],result[i][2][8],result[i][2][9],result[i][2][10]];
					var data1 = [result[i][1][1],result[i][1][2],result[i][1][3],result[i][1][4],result[i][1][5],result[i][1][6],result[i][1][7],result[i][1][8],result[i][1][9],result[i][1][10]];
					var data2 = [result[i][0][1],result[i][0][2],result[i][0][3],result[i][0][4],result[i][0][5],result[i][0][6],result[i][0][7],result[i][0][8],result[i][0][9],result[i][0][10]];
					hg3(date+'当月','myChart0',data0)
					hg3(date+'当周','myChart1',data1)
					hg3(date+'当天','myChart2',data2)
					i+=1
					
					function run() {
					var date = result[i][2][0];
					var data0 = [result[i][2][1],result[i][2][2],result[i][2][3],result[i][2][4],result[i][2][5],result[i][2][6],result[i][2][7],result[i][2][8],result[i][2][9],result[i][2][10]];
					var data1 = [result[i][1][1],result[i][1][2],result[i][1][3],result[i][1][4],result[i][1][5],result[i][1][6],result[i][1][7],result[i][1][8],result[i][1][9],result[i][1][10]];
					var data2 = [result[i][0][1],result[i][0][2],result[i][0][3],result[i][0][4],result[i][0][5],result[i][0][6],result[i][0][7],result[i][0][8],result[i][0][9],result[i][0][10]];
					
  				myChart0.setOption({
  					title: {
								text: date+'当月规模效应',left: 'left',padding:4,textStyle:{color:'#FFFFFF',fontSize:15,}
						},
  				  series: [
  				    {
  				      type: 'bar',
  				      data: (function(){return data0;})(),
  				    }
  				  ]
  				});
  				
  				  myChart1.setOption({
  					title: {
								text: date+'当周规模效应',left: 'left',padding:4,textStyle:{color:'#FFFFFF',fontSize:15,}
						},
  				  series: [
  				    {
  				      type: 'bar',
  				      data: (function(){return data1;})(),
  				    }
  				  ]
  				});
  				  myChart2.setOption({
  					title: {
								text: date+'当天规模效应',left: 'left',padding:4,textStyle:{color:'#FFFFFF',fontSize:15,}
						},
  				  series: [
  				    {
  				      type: 'bar',
  				      data: (function(){return data2;})(),
  				    }
  				  ]
  				});
  				i+=1;
  				if (i==result.length){
  					clearInterval(timer1);
  					i=0;
  					}
			}
		
		timer1 = setInterval(function (){run();},1000);
		
				}
			})	
			}
		});
			
		
	</script>
