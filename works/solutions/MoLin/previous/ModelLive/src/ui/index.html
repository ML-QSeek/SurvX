<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ModelLive</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/all.min.css">
    <style>
        :root {
            --primary: #16C0FF;
            --primary-dark: #0EA8E0;
            --primary-light: #4AD2FF;
            --primary-transparent: rgba(22, 192, 255, 0.1);
            --bg-primary: #101010;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-tertiary: #808080;
            --border-color: #333333;
            --error-color: #FF4D4D;
            --success-color: #00CC66;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        
        html,body {
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            position: relative;
        }
        
        /* 添加背景透明效果 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(22, 192, 255, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(22, 192, 255, 0.03) 0%, transparent 40%);
            z-index: 0;
        }
        
        .login-container {
            display: flex;
            width: 800px;
            height: 480px;
            background: var(--bg-secondary);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(22, 192, 255, 0.15);
            box-shadow: 
                0 0 0 1px rgba(22, 192, 255, 0.1),
                0 15px 40px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(22, 192, 255, 0.08);
        }
        
        /* 圆角透明处理 */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            background: transparent;
            pointer-events: none;
            z-index: 2;
        }
        
        .logo-section {
            flex: 0 0 61.8%;
            background: linear-gradient(135deg, rgba(15, 15, 15, 0.95), rgba(25, 25, 35, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(22, 192, 255, 0.1);
        }
        
        .logo-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(22, 192, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(22, 192, 255, 0.03) 0%, transparent 50%);
            z-index: 0;
        }
        
        .logo-section::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(22, 192, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -70px;
            z-index: 0;
        }
        
        .logo-container {
            position: relative;
            margin-bottom: 20px;
            z-index: 1;
        }
        
        .logo-outer-ring {
            width: 120px;
            height: 120px;
            border: 2px solid rgba(22, 192, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: rotateSlow 20s linear infinite;
        }
        
        .logo-outer-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }
        
        .logo-inner-ring {
            width: 90px;
            height: 90px;
            border: 2px solid rgba(22, 192, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .logo-inner-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-bottom: 2px solid var(--primary);
            border-radius: 50%;
            animation: rotateReverse 2s linear infinite;
        }
        
        /* 修改logo-core部分：移除折线图，改为钟表样式 */
        .logo-core {
            width: 60px;
            height: 60px;
            background: rgba(22, 192, 255, 0.08);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 0 0 15px rgba(22, 192, 255, 0.15),
                0 0 30px rgba(22, 192, 255, 0.2);
            border: 1px solid rgba(22, 192, 255, 0.2);
            position: relative;
        }
        
        /* 钟表中心点 */
        .clock-center {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            z-index: 4;
            box-shadow: 0 0 8px rgba(22, 192, 255, 0.8);
        }
        
        /* 时针 */
        .hour-hand {
            position: absolute;
            width: 4px;
            height: 16px;
            background: var(--primary);
            top: 14px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 2;
            animation: rotateHour 8s linear infinite;
            box-shadow: 0 0 6px rgba(22, 192, 255, 0.6);
        }
        
        /* 分针 */
        .minute-hand {
            position: absolute;
            width: 3px;
            height: 24px;
            background: var(--primary-light);
            top: 8px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 3;
            animation: rotateMinute 4s linear infinite;
            box-shadow: 0 0 6px rgba(74, 210, 255, 0.6);
        }
        
        /* 秒针（可选） */
        .second-hand {
            position: absolute;
            width: 2px;
            height: 26px;
            background: #FF4D4D;
            top: 6px;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%);
            border-radius: 1px;
            z-index: 1;
            animation: rotateSecond 2s linear infinite;
            opacity: 0.7;
        }
        
        /* 移除原有的图表图标 */
        .logo-core i {
            display: none;
        }
        
        .logo-text {
            font-size: 42px;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 2px;
            z-index: 1;
            text-shadow: 
                0 0 20px rgba(22, 192, 255, 0.25),
                0 0 40px rgba(22, 192, 255, 0.1);
            display: flex;
            align-items: baseline;
            justify-content: center;
            position: relative;
        }
        
        .logo-text .q-char {
            background: linear-gradient(135deg, #FFFFFF 0%, #E0F7FF 30%, #4AD2FF 70%, #16C0FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 50px;
            font-weight: 400;
            letter-spacing: -2px;
            margin-right: 6px;
            position: relative;
            top: 1px;
            text-shadow: 
                0 0 15px rgba(22, 192, 255, 0.6),
                0 0 30px rgba(22, 192, 255, 0.25),
                0 0 45px rgba(22, 192, 255, 0.1);
            filter: brightness(1.1);
        }
        
        .logo-text .rest-text {
            background: linear-gradient(135deg, #B3EBFF 0%, #4AD2FF 30%, #16C0FF 70%, #0EA8E0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 36px;
            font-weight: 350;
            position: relative;
            top: -1px;
            letter-spacing: 1px;
            text-shadow: 
                0 0 12px rgba(22, 192, 255, 0.4),
                0 0 25px rgba(22, 192, 255, 0.15);
        }
        
        .logo-subtext {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
            max-width: 320px;
            z-index: 1;
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        /* 左侧底部版权信息 - 放大字号 */
        .left-footer {
            position: absolute;
            bottom: 12px; /* 位置调整 */
            left: 0;
            right: 0;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 12px; /* 放大字号 */
            z-index: 2;
            font-weight: 300;
        }
        
        /* 右侧登录区域 */
        .login-section {
            flex: 0 0 38.2%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 25px;
            background: var(--bg-tertiary);
            z-index: 1;
            position: relative;
        }
        
        /* 关闭按钮 - 简化无边框版本 */
        .close-btn-login {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            background: transparent;
            border: none;
            border-radius: 50%;
            color: var(--text-tertiary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .close-btn-login:hover {
            background: rgba(255, 77, 77, 0.15);
            color: #FF4D4D;
            transform: scale(1.1);
        }
        
        .close-btn-login:active {
            transform: scale(0.95);
        }
        
        .login-header {
            margin-bottom: 20px;
            padding-top: 5px;
            text-align: center;
        }
        
        /* 一行标题 - 全部改为白色 */
        .login-title {
            font-size: 26px;
            font-weight: 300;
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 8px;
            color: var(--text-primary); /* 全部改为白色 */
        }
        
        .login-title-welcome {
            color: var(--text-primary); /* 白色 */
            font-size: 20px;
            margin-right: 6px;
            position: relative;
            top: 2px;
            font-weight: 300;
        }
        
        /* Q字符改为白色 */
        .login-title-q {
            color: var(--text-primary); /* 改为白色 */
            font-size: 22px;
            position: relative;
            top: 2px;
            font-weight: 300;
            letter-spacing: 0px;
        }
        
        /* "的投资笔记"改为白色 */
        .login-title-rest {
            color: var(--text-primary); /* 改为白色 */
            font-size: 22px;
            position: relative;
            top: 2px;
            font-weight: 300;
            letter-spacing: 0px;
        }
        
        .login-header p {
            color: var(--text-tertiary);
            font-size: 12px;
            line-height: 1.4;
            font-weight: 300;
            text-align: center;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        
        .input-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 14px;
            z-index: 2;
        }
        
        .input-group input {
            width: 100%;
            padding: 11px 11px 11px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            position: relative;
            z-index: 1;
            font-weight: 300;
        }
        
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 
                0 0 0 2px rgba(22, 192, 255, 0.15),
                inset 0 0 8px rgba(22, 192, 255, 0.08);
            outline: none;
            background: rgba(255, 255, 255, 0.06);
        }
        
        .input-group input::placeholder {
            color: var(--text-tertiary);
            font-weight: 300;
        }
        
        .options-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-weight: 300;
        }
        
        .option-item input {
            accent-color: var(--primary);
            width: 14px;
            height: 14px;
        }
        
        /* 忘记密码链接，去掉问号 */
        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 300;
            transition: all 0.3s;
            font-size: 13px;
        }
        
        .forgot-password:hover {
            color: var(--primary-light);
            text-decoration: underline;
        }
        
        .login-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--text-primary);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 18px;
            box-shadow: 
                0 4px 15px rgba(22, 192, 255, 0.25),
                0 0 25px rgba(22, 192, 255, 0.08);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            width: 100%;
        }
        
        .login-btn:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            transform: translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(22, 192, 255, 0.35),
                0 0 30px rgba(22, 192, 255, 0.15);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.7s;
        }
        
        .login-btn:hover::after {
            left: 100%;
        }
        
        /* 新增的底部链接 */
        .bottom-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .bottom-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 300;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        .bottom-link:hover {
            color: var(--primary-light);
            background: rgba(22, 192, 255, 0.08);
            text-decoration: underline;
        }
        
        .link-separator {
            color: var(--text-tertiary);
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
            font-weight: 300;
        }
        
        /* 状态消息 */
        .status-message {
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
            text-align: center;
            font-weight: 300;
        }
        
        .status-success {
            background: rgba(0, 204, 102, 0.08);
            color: var(--success-color);
            border: 1px solid rgba(0, 204, 102, 0.2);
        }
        
        .status-error {
            background: rgba(255, 77, 77, 0.08);
            color: var(--error-color);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }
        
        /* 动画 */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes rotateReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 钟表指针动画 - 快速旋转 */
        @keyframes rotateHour {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        @keyframes rotateMinute {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        @keyframes rotateSecond {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }
        
        /* 加载动画 */
        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-right: 6px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 左侧Logo区域 -->
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-outer-ring">
                    <div class="logo-inner-ring">
                        <div class="logo-core">
                            <!-- 时针 -->
                            <div class="hour-hand"></div>
                            <!-- 分针 -->
                            <div class="minute-hand"></div>
                            <!-- 秒针 -->
                            <div class="second-hand"></div>
                            <!-- 钟表中心点 -->
                            <div class="clock-center"></div>
                            <!-- 移除原有的图标 -->
                            <i class="fas fa-chart-line" style="display: none;"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="logo-text">
                <span class="q-char">M</span>
                <span class="rest-text">odelLive</span>
            </div>
            <div class="logo-subtext">
                专业的投资分析与策略记录平台<br>
                记录每一次决策，优化每一分收益
            </div>
            
            <!-- 左侧底部版权信息 - 字号放大 -->
            <div class="left-footer">
                &copy; 2025 ModelLive | v1.0.2
            </div>
        </div>
        
        <!-- 右侧登录区域 -->
        <div class="login-section">
            <!-- 简化无边框关闭按钮 -->
            <button class="close-btn-login" id="closeWindowBtn" title="关闭窗口">
                <i class="fas fa-times"></i>
            </button>
            
            <div class="login-header">
                <!-- 一行标题 - 全部改为白色 -->
                <div class="login-title">
                    <span class="login-title-welcome">欢迎登录</span>
                    <span class="login-title-q">M</span>
                    <span class="login-title-rest">odelLive</span>
                </div>
                <p>请输入您的凭据访问投资分析平台</p>
            </div>
            
            <div class="status-message" id="statusMessage"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="用户名 / 邮箱" required>
                    <div class="error-message" id="username-error"></div>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="登录密码" required>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <div class="options-container">
                    <div class="option-item">
                        <input type="checkbox" id="rememberPassword">
                        <label for="rememberPassword">记住密码</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="autoLogin">
                        <label for="autoLogin">自动登录</label>
                    </div>
                    <a href="#" class="forgot-password">忘记密码</a> <!-- 去掉问号 -->
                </div>
                
                <button type="submit" class="login-btn" id="loginButton">
                    <div class="btn-content">
                        <div class="loader" id="loader"></div>
                        <span id="buttonText">登录系统</span>
                    </div>
                </button>
                
                <!-- 新增的底部链接 -->
                <div class="bottom-links">
                    <a href="#" class="bottom-link" id="applyAccount">申请账号</a>
                    <span class="link-separator">|</span>
                    <a href="#" class="bottom-link" id="contactUs">联系我们</a>
                </div>
                <!-- 右侧底部版权信息已移除 -->
            </form>
        </div>
    </div>

    <script>
    	
    	
    	
        document.addEventListener('DOMContentLoaded', function() {
        	
        	window.addEventListener('pywebviewready', function() {
					    console.log('PyWebView API 现在可用');
					    // 页面加载时检查是否有保存的登录凭证
	            checkSavedCredentials();
						});
            
            // 添加申请账号链接功能
            const applyAccountLink = document.getElementById('applyAccount');
            const contactUsLink = document.getElementById('contactUs');
            
            applyAccountLink.addEventListener('click', function(e) {
                e.preventDefault();
                showStatusMessage('正在打开账号申请页面...', 'success');
                setTimeout(() => {
                    alert('账号申请\n\n请访问我们的官方网站填写申请表格，或联系客服获取更多信息。\n邮箱: apply@q-invest.com\n电话: 400-123-4567');
                }, 500);
            });
            
            contactUsLink.addEventListener('click', function(e) {
                e.preventDefault();
                showStatusMessage('正在加载联系方式...', 'success');
                setTimeout(() => {
                    alert('联系我们\n\n客服邮箱: support@q-invest.com\n客服电话: 400-123-4567\n工作时间: 周一至周五 9:00-18:00\n官方网站: www.q-invest.com');
                }, 500);
            });
            
            // 原来的忘记密码链接事件处理
            const forgotPasswordLink = document.querySelector('.forgot-password');
            forgotPasswordLink.addEventListener('click', function(e) {
                e.preventDefault();
                const email = prompt('请输入您的注册邮箱以重置密码：');
                if (email && validateEmail(email)) {
                    showStatusMessage(`密码重置链接已发送到 ${email}`, 'success');
                } else if (email) {
                    showStatusMessage('请输入有效的邮箱地址', 'error');
                }
            });
            
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loader = document.getElementById('loader');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            const statusMessage = document.getElementById('statusMessage');
            const rememberPassword = document.getElementById('rememberPassword');
            const autoLogin = document.getElementById('autoLogin');
            
            // 自动登录被选中时，自动选中记住密码
            autoLogin.addEventListener('change', function() {
                if (this.checked) {
                    rememberPassword.checked = true;
                }
            });
            
            // 记住密码取消时，取消自动登录
            rememberPassword.addEventListener('change', function() {
                if (!this.checked) {
                    autoLogin.checked = false;
                }
            });
            
            // 登录表单提交处理
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberPwd = rememberPassword.checked;
                const autoLoginChecked = autoLogin.checked;
                
                // 重置错误信息
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
                
                // 简单的验证
                let isValid = true;
                
                if (!username) {
                    usernameError.textContent = '请输入用户名或邮箱地址';
                    usernameError.style.display = 'block';
                    isValid = false;
                } else if (!validateEmail(username) && username.length < 3) {
                    usernameError.textContent = '用户名至少3个字符或使用有效邮箱';
                    usernameError.style.display = 'block';
                    isValid = false;
                }
                
                if (!password) {
                    passwordError.textContent = '请输入登录密码';
                    passwordError.style.display = 'block';
                    isValid = false;
                } else if (password.length < 6) {
                    passwordError.textContent = '密码长度至少6个字符';
                    passwordError.style.display = 'block';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                // 显示加载状态
                buttonText.textContent = '正在验证身份...';
                loader.style.display = 'block';
                loginButton.disabled = true;
                
                // 调用pywebview API进行登录验证
                if (window.pywebview && window.pywebview.api) {
                    // 准备用户数据
                    const userData = {
                        username: username,
                        password: password,
                        rememberPassword: rememberPwd,
                        autoLogin: autoLoginChecked
                    };
                    
                    // 调用Python后端的登录方法
                    pywebview.api.login(userData)
                        .then(response => {
                            console.log('登录响应:', response);
                            
                            if (response.success) {
                                // 登录成功
                                buttonText.textContent = '验证通过！';
                                loginButton.style.background = 'linear-gradient(135deg, #00CC66, #00AA55)';
                                
                                // 显示成功消息
                                let successMsg = '登录成功！正在进入主应用...';
                                /*
                                if (rememberPwd) {
                                    successMsg += ' 密码已保存';
                                }
                                if (autoLoginChecked) {
                                    successMsg += ' 已启用自动登录';
                                }
                                */
                                showStatusMessage(successMsg, 'success');
                                
                                // 成功后自动跳转（Python端会处理页面跳转）
                                console.log('登录成功，等待Python端加载主页面...');
                                
                                // 延迟跳转，让用户看到成功消息
                                setTimeout(() => {
                                    if (window.pywebview && window.pywebview.api.load_main_page) {                                        
                                        // 前端调用方式
																				pywebview.api.load_main_page().then(function(response) {
																				    console.log("API响应:", response);
																				    if (response.success) {
																				        console.log(response.message);
																				    }
																				}).catch(function(error) {
																				    console.error("API调用错误:", error);
																				});
                                    }
                                }, 1500);

                                
                            } else {
                                // 登录失败
                                buttonText.textContent = '身份验证失败';
                                passwordError.textContent = response.message || '用户名或密码错误，请重试';
                                passwordError.style.display = 'block';
                                loginButton.style.background = 'linear-gradient(135deg, #FF4D4D, #CC3333)';
                                
                                showStatusMessage(response.message || '身份验证失败，请检查您的凭据', 'error');
                                
                                setTimeout(() => {
                                    resetLoginButton();
                                }, 2000);
                            }
                        })
                        .catch(error => {
                            console.error('登录请求失败:', error);
                            // 登录失败
                            buttonText.textContent = '连接失败';
                            showStatusMessage('无法连接到服务器，请检查网络连接', 'error');
                            loginButton.style.background = 'linear-gradient(135deg, #FF4D4D, #CC3333)';
                            
                            setTimeout(() => {
                                resetLoginButton();
                            }, 2000);
                        });
                } else {
                    // 如果没有pywebview API，使用模拟验证
                    setTimeout(() => {
                        const mockUsers = [
                            {username: 'admin', password: 'admin123'},
                            {username: 'investor', password: 'invest123'},
                            {username: 'q@invest.com', password: 'qnote2023'},
                            {username: 'demo', password: 'demo456'},
                            {username: 'test', password: 'test123'}
                        ];
                        
                        const user = mockUsers.find(u => 
                            (u.username === username) && u.password === password
                        );
                        
                        if (user) {
                            // 登录成功
                            buttonText.textContent = '验证通过！';
                            loginButton.style.background = 'linear-gradient(135deg, #00CC66, #00AA55)';
                            
                            let successMsg = '登录成功！演示模式';
                            showStatusMessage(successMsg, 'success');
                            
                            setTimeout(() => {
                                alert(`演示模式：欢迎 ${username}！\n\n实际应用中，系统将自动跳转到主页面。`);
                                resetLoginForm();
                            }, 1500);
                        } else {
                            // 登录失败
                            buttonText.textContent = '身份验证失败';
                            passwordError.textContent = '用户名或密码错误，请重试';
                            passwordError.style.display = 'block';
                            loginButton.style.background = 'linear-gradient(135deg, #FF4D4D, #CC3333)';
                            
                            showStatusMessage('身份验证失败，请检查您的凭据', 'error');
                            
                            setTimeout(() => {
                                resetLoginButton();
                            }, 2000);
                        }
                    }, 1500);
                }
            });
            
            // 检查保存的登录凭证
            function checkSavedCredentials() {
            	
                if (window.pywebview && window.pywebview.api.get_saved_credentials) {
                    pywebview.api.get_saved_credentials()
                        .then(credentials => {
                            console.log('获取到的凭证:', credentials);
                            
                            if (credentials.has_saved) {
                                // 如果有保存的凭证，自动填充
                                document.getElementById('username').value = credentials.username || '';
                                document.getElementById('password').value = credentials.password || '';
                                
                                if (credentials.rememberPassword) {
                                    rememberPassword.checked = true;
                                }
                                
                                if (credentials.autoLogin) {
                                    autoLogin.checked = true;
                                }
                                
                                // 如果启用了自动登录且有密码，自动提交表单
                                if (credentials.autoLogin && credentials.password) {
                                    //console.log('检测到自动登录，5秒后自动登录...');
                                    //showStatusMessage('检测到自动登录，正在自动登录...', 'success');
                                    
                                    setTimeout(() => {
                                        loginForm.dispatchEvent(new Event('submit'));
                                    }, 3000);
                                } else if (credentials.username) {
                                    showStatusMessage(`欢迎回来 ${credentials.username}，请点击登录或输入密码`, 'success');
                                }
                            }
                        })
                        .catch(error => {
                            console.error('获取保存的凭证失败:', error);
                        });
                }
            }
            
            // 清除保存的凭证功能
            function clearSavedCredentials() {
                if (confirm('确定要清除所有保存的登录凭证吗？')) {
                    if (window.pywebview && window.pywebview.api.clear_saved_credentials) {
                        pywebview.api.clear_saved_credentials()
                            .then(response => {
                                if (response.success) {
                                    showStatusMessage('已清除所有保存的登录凭证', 'success');
                                    // 清空表单
                                    document.getElementById('username').value = '';
                                    document.getElementById('password').value = '';
                                    rememberPassword.checked = false;
                                    autoLogin.checked = false;
                                } else {
                                    showStatusMessage('清除凭证失败', 'error');
                                }
                            })
                            .catch(error => {
                                console.error('清除凭证失败:', error);
                                showStatusMessage('清除凭证失败', 'error');
                            });
                    }
                }
            }
            
            // 为忘记密码链接添加清除凭证功能（长按3秒）
            let clearTimer;
            forgotPasswordLink.addEventListener('mousedown', function(e) {
                e.preventDefault();
                clearTimer = setTimeout(() => {
                    clearSavedCredentials();
                }, 3000);
            });
            
            forgotPasswordLink.addEventListener('mouseup', function(e) {
                clearTimeout(clearTimer);
            });
            
            forgotPasswordLink.addEventListener('mouseleave', function(e) {
                clearTimeout(clearTimer);
            });
            
            // 显示状态消息
            function showStatusMessage(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = 'status-message';
                statusMessage.classList.add(`status-${type}`);
                statusMessage.style.display = 'block';
                
                // 5秒后自动隐藏
                setTimeout(() => {
                    if (statusMessage.textContent === message) {
                        statusMessage.style.display = 'none';
                    }
                }, 5000);
            }
            
            // 邮箱验证函数
            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            // 重置登录按钮状态
            function resetLoginButton() {
                buttonText.textContent = '登录系统';
                loader.style.display = 'none';
                loginButton.disabled = false;
                loginButton.style.background = 'linear-gradient(135deg, var(--primary), var(--primary-dark))';
            }
            
            // 重置登录表单
            function resetLoginForm() {
                resetLoginButton();
                document.getElementById('password').value = '';
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
            }
            
            // 输入框实时验证
            document.getElementById('username').addEventListener('input', function() {
                usernameError.style.display = 'none';
                statusMessage.style.display = 'none';
            });
            
            document.getElementById('password').addEventListener('input', function() {
                passwordError.style.display = 'none';
                statusMessage.style.display = 'none';
            });
            
            // 与pywebview集成的示例代码
            if (window.pywebview && window.pywebview.api) {
                console.log('pywebview API已检测到 - ModelLive登录界面已就绪');
            }
            
            // 添加键盘快捷键支持
            document.addEventListener('keydown', function(e) {
                // Ctrl+Enter 提交表单
                if (e.ctrlKey && e.key === 'Enter') {
                    loginButton.click();
                }
                
                // F1 显示帮助
                if (e.key === 'F1') {
                    e.preventDefault();
                    alert('登录帮助:\n\n1. 输入用户名/邮箱和密码\n2. 点击"登录系统"或按Ctrl+Enter\n3. 如需帮助请联系系统管理员\n\n高级功能:\n- 记住密码：下次自动填充\n- 自动登录：启动时自动登录\n- 长按"忘记密码"3秒清除所有保存的凭证');
                }
                
                // Ctrl+Shift+C 清除凭证
                if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                    e.preventDefault();
                    clearSavedCredentials();
                }
            });
            
            // 添加输入框焦点效果
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
            
            // 为Q字符添加呼吸效果
            const qChar = document.querySelector('.q-char');
            let breathDirection = 1;
            let breathValue = 0;
            
            function animateBreath() {
                breathValue += 0.02 * breathDirection;
                if (breathValue >= 0.3) breathDirection = -1;
                if (breathValue <= 0) breathDirection = 1;
                
                qChar.style.textShadow = `
                    0 0 ${12 + breathValue * 8}px rgba(22, 192, 255, ${0.5 + breathValue}),
                    0 0 ${25 + breathValue * 15}px rgba(22, 192, 255, ${0.2 + breathValue * 0.5})
                `;
                
                requestAnimationFrame(animateBreath);
            }
            
            animateBreath();
            
           // 关闭窗口
		        document.getElementById('closeWindowBtn').addEventListener('click', () => {
		            // 关闭窗口
		            if (typeof pywebview !== 'undefined') {
		                pywebview.api.close_window();
		            } else {
		                console.log('关闭窗口');
		            }
        	}); 
            
            
        });
        
        
    </script>
</body>
</html>
