	/* ========= 科技感驾驶舱样式 - 无圆角，大字体 ========= */

	/* KPI 网格 - 9个指标 */
	.stats-grid {
		display: grid;
		grid-template-columns: repeat(3, 1fr);
		gap: 10px;
		margin-bottom: 24px;
	}
	.stat-card {
		background: rgba(0,234,255,0.03);
		border: 1px solid #00eaff33;
		padding: 12px 8px;
		text-align: center;
		transition: all 0.2s;
		position: relative;
		overflow: hidden;
	}
	.stat-card::before {
		content: '';
		position: absolute;
		top: 0;
		left: -100%;
		width: 100%;
		height: 1px;
		background: linear-gradient(90deg, transparent, #00eaff, transparent);
		transition: left 0.5s;
	}
	.stat-card:hover::before {
		left: 100%;
	}
	.stat-card:hover {
		border-color: #00eaff;
		background: rgba(0,234,255,0.08);
	}

	<script type="text/javascript">
		document.oncontextmenu=function(){return false;}
		function GenNonDuplicateID(randomLength){
			return Number(Math.random().toString().substr(3,randomLength) + Date.now()).toString(36)
		}
		function trim(str){return str.replace(/(^\s*)|(\s*$)/g,"");}
		
		var MServer = "http://10.10.98.51/test/sys/";
		
		function WarnMessage(content){
			var sid=GenNonDuplicateID(1);	
			$("body").append('<div class="Warn"><div class="WarnB" id="WarnB_'+sid+'"></div><div class="WarnM"><button id="Yes" class="WarnMButton"> 好的 </button></div></div>');
			$("#WarnB_"+sid).html(content);
		}
		function divmove(DivId1,DivId2){
			var _move=false;
			var _x,_y;
			$('#'+DivId1).click(function(){}).mousedown(function(e){
				_move=true;
				_x=e.pageX-parseInt($('#'+DivId2).css("left"));
				_y=e.pageY-parseInt($('#'+DivId2).css("top"));
			});
			$(document).mousemove(function(e){
				if(_move){
					var x=e.pageX-_x;
					var y=e.pageY-_y;
					$('#'+DivId2).css({top:y,left:x});
				}
			}).mouseup(function(){ _move=false; });
		}
		$(document).on("click",".shut",function(){ $(this).parent().parent().remove(); })
		
		function oncontextmenu(){
			var obAdd={text:"新增",func:function(){
				var trNew = '<tr class="FactorTr" id ="x_new"><td style="text-align:center;" id="x_new_0">---</td><td class="xnew" id="x_new_1">...</td><td class="xnew" id="x_new_2">...</td><td class="xnew" id="x_new_3">...</td>';

				$(this).after(trNew);

			var obUp={text:"修改",func:function(){

				$('#'+trid+'_3').attr('contenteditable', 'true');

				$('#'+trid+'_9').attr('contenteditable', 'true');
				$('#'+trid+'_10').attr('contenteditable', 'true');
			}};
			var obSave={text:"保存",func:function(){
				var trid =$(this).attr("id");
				if (trid=="x_new"){
					var ts1 = $('#'+trid+'_1').html(), ts2 = $('#'+trid+'_2').html(), ts3 = $('#'+trid+'_3').html(), ts4 = $('#'+trid+'_4').html(), ts5 = $('#'+trid+'_5').html();
					var ts6 = $('#'+trid+'_6').html(), ts7 = $('#'+trid+'_7').html(), ts8 = $('#'+trid+'_8').html(), ts9 = $('#'+trid+'_9').html(), ts10 = $('#'+trid+'_10').html();
					$.ajax({ type: "POST", url: MServer+"qq/channel/ch011C.php", data: { qflag:"QFCRE", sflag:"_01", s1:ts1,s2:ts2,s3:ts3,s4:ts4,s5:ts5,s6:ts6,s7:ts7,s8:ts8,s9:ts9,s10:ts10 }, async:false,
						success: function(data1){
							data1 = trim(data1);
							if(data1=='0'){ WarnMessage('数据编码已存在！'); $(document).off('click',"#Yes").on('click',"#Yes",function(){ $(this).parent().parent().remove(); })}
							else if(data1=='1'){ WarnMessage("保存失败，请检查数据后重新保存!"); $(document).off('click',"#Yes").on('click',"#Yes",function(){ $(this).parent().parent().remove(); })}
							else{ $("#x_new").after(data1); $("#x_new").remove(); oncontextmenu(); }
						}
					})
				} else {
					var ts1 = $('#'+trid+'_1').html(), ts2 = $('#'+trid+'_2').html(), ts3 = $('#'+trid+'_3').html(), ts4 = $('#'+trid+'_4').html(), ts5 = $('#'+trid+'_5').html();
					var ts6 = $('#'+trid+'_6').html(), ts7 = $('#'+trid+'_7').html(), ts8 = $('#'+trid+'_8').html(), ts9 = $('#'+trid+'_9').html(), ts10 = $('#'+trid+'_10').html();
					$.ajax({ type: "POST", url: MServer+"qq/channel/ch011C.php", data: { qflag:"QFCRE", sflag:"_03", trid:trid, s1:ts1,s2:ts2,s3:ts3,s4:ts4,s5:ts5,s6:ts6,s7:ts7,s8:ts8,s9:ts9,s10:ts10 }, async:false,
						success: function(data1){
							$("#"+trid).css("animation-name","none");

		}

					<div class="stat-card"><div class="stat-number">${avgIC}</div><div class="stat-label">平均IC</div><div class="stat-trend trend-up">同比 +0.023 ▲</div></div>
					<div class="stat-card"><div class="stat-number">${sharpe}</div><div class="stat-label">组合夏普</div><div class="stat-trend trend-up">近30日 +0.31</div></div>
					<div class="stat-card"><div class="stat-number">${recentReturn}%</div><div class="stat-label">多因子收益(YTD)</div><div class="stat-trend trend-up">超额 ${alpha}%</div></div>
					<div class="stat-card"><div class="stat-number">${turnover}%</div><div class="stat-label">换手率(月)</div><div class="stat-trend trend-steady">稳定区间</div></div>
					<div class="stat-card"><div class="stat-number">${maxDrawdown}%</div><div class="stat-label">最大回撤</div><div class="stat-trend trend-up">优于基准3.2%</div></div>
					<div class="stat-card"><div class="stat-number">98.3%</div><div class="stat-label">因子有效性</div><div class="stat-trend trend-up">历史新高</div></div>
				</div>
				<div class="chart-row">
					<div class="chart-box" id="categoryChart" style="height: 200px;"></div>
					<div class="chart-box" id="efficiencyChart" style="height: 200px;"></div>
				</div>
				<div class="signal-panel">
					<div class="signal-box"><h4>⚡ 实时因子信号</h4>
						${signals.map(s => `<div class="signal-item"><span>${s.name}</span><span class="${s.status==='strong'?'signal-good':s.status==='warning'?'signal-warn':'signal-good'}">${s.value}</span></div>`).join('')}
						<div class="progress-bar"><div class="progress-fill" style="width:76%"></div></div>
						<div class="signal-item" style="margin-top:8px;"><span>综合置信度</span><span class="signal-good">76.4%</span></div>
					</div>
					<div class="signal-box"><h4>📊 因子拥挤度预警</h4>
						<div class="signal-item"><span>动量因子</span><span class="signal-warn">拥挤 82%</span></div>
						<div class="signal-item"><span>价值因子</span><span>拥挤 45%</span></div>
						<div class="signal-item"><span>成长因子</span><span class="signal-good">拥挤 31%</span></div>
						<div class="signal-item"><span>小市值因子</span><span class="signal-bad">拥挤 91%</span></div>
					</div>
				</div>
				<div class="double-list">
					<div class="factor-list"><h4>🏆 因子IC有效性排名 (月度Top5)</h4>
						${topFactors.map(f => `<div class="factor-item"><span class="factor-name">${f.name} <span class="badge">${f.category}</span></span><span class="factor-value ${f.trend === 'up' ? 'trend-up' : (f.trend==='down'?'trend-down':'trend-steady')}">IC: ${f.ic.toFixed(3)} ${f.trend === 'up' ? '↑' : (f.trend==='down'?'↓':'→')}</span></div>`).join('')}
					</div>
					<div class="factor-list"><h4>📈 因子种类轮动强度</h4>
						${rotationData.map(c => `<div class="factor-item"><span class="factor-name">${c.name}</span><span class="factor-value">强度: ${c.efficiency}%</span><div class="progress-bar" style="width:50px; margin-left:8px;"><div class="progress-fill" style="width:${c.efficiency}%"></div></div></div>`).join('')}
					</div>
				</div>
			</div>`;
			
			$("#jbaobiao").html(html);
			
			setTimeout(function() {
				var categoryChart = echarts.init(document.getElementById('categoryChart'));
				categoryChart.setOption({
					backgroundColor: 'transparent',
					tooltip: { trigger: 'item', textStyle: { color: '#00eaff', fontSize: 12 } },
					legend: { textStyle: { color: '#00eaff', fontSize: 11 }, left: 'left', itemWidth: 14, itemHeight: 10 },
					series: [{
						type: 'pie', radius: ['35%', '60%'], avoidLabelOverlap: false,
						data: categoryData.map(c => ({ name: c.name, value: c.count })),
						itemStyle: { borderColor: '#0a0f12', borderWidth: 1, color: '#00eaff' },
						label: { show: true, color: '#8cc9ff', fontSize: 11, formatter: '{b}' }
					}]
				});
				
				var effChart = echarts.init(document.getElementById('efficiencyChart'));
				effChart.setOption({
					backgroundColor: 'transparent',
					grid: { left: '12%', right: '3%', top: 18, bottom: 8, containLabel: true },
					xAxis: { type: 'category', data: categoryData.map(c => c.name), axisLabel: { rotate: 35, color: '#8cc9ff', fontSize: 10, interval: 0 } },
					yAxis: { type: 'value', name: '有效性%', nameTextStyle: { color: '#00eaff', fontSize: 11 }, axisLabel: { color: '#8cc9ff', fontSize: 10 } },
					series: [{ data: categoryData.map(c => c.efficiency), type: 'bar', barWidth: '55%', itemStyle: { color: '#00eaff', borderRadius: 0 }, label: { show: true, position: 'top', color: '#00eaff', fontSize: 10 } }]
				});
				
				$(window).off('resize.dashboard').on('resize.dashboard', function() { categoryChart.resize(); effChart.resize(); });
			}, 50);
		}
		
		$(document).ready(function() { renderDashboard(); });
		
		$(document).off('click',"#dataSelect").on('click',"#dataSelect", function(){
			var sKey=$("#ssbtn").text().substr(0);
			var sTxt=$("#inputTxt").val();
			if(sTxt==''){ WarnMessage("请输入查询对象！"); $(document).off('click',"#Yes").on('click',"#Yes",function(){ $(this).parent().parent().remove(); })}
			else if(sTxt!=''){
				$.post(MServer+"qq/channel/ch011C.php", { qflag:"QFCRE", sflag:"_04", sKey:sKey, sTxt:sTxt }, function(data1){ $("#jbaobiao").html(data1); oncontextmenu(); });
			}
		});
		
		$(document).ready(function (){ $("#因子名称").css({'background':'rgba(0,234,255,0.2)'}); $("#ssbtn").html("因子名称"); })
		$(document).off('click',".sbtn").on('click',".sbtn", function(){ $(".sbtn").css({'background':'transparent'}); $(this).css({'background':'rgba(0,234,255,0.2)'}); $("#ssbtn").html($(this).attr('id')); })
		
		$(document).off('dblclick',".cimg").on('dblclick',".cimg", function(){
			let text = $(this).html();
			let pattern = /image(.*?)png/;
			let match = text.match(pattern);
			if (match) {
				let tevar=match[1].replace('/','').replace('.','');
				let tmg = MServer+'qq/channel/img/image/'+tevar+'.png';
				if($("#tt"+tevar).length>0){alert("此图已存在！");}
				else{
					$("#mq_main").append("<div class='dashb' id='tt"+tevar+"'><div class='dashbt'>"+tevar+"<img class='shut' src='./assets/images/close3.png'></div><div class='dashbb'><img style='width:100%;height:100%;' src='"+tmg+"' onerror=src='./assets/images/default.png' alt='' ></div></div>");
					var x = $("#tt"+tevar).position().top+Math.random()*50;
					var y=$("#tt"+tevar).position().left+Math.random()*50;
					$("#tt"+tevar).css({top:x, left:y})
					divmove("tt"+tevar,"tt"+tevar);
				}
			}
		})
	</script>
</body>	
</html>
